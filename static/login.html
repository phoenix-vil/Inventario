<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--red:#a32d2d;--red-bg:#fcebeb;--radius:14px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--red:#f09595;--red-bg:#501313
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:18px;padding:2rem 1.75rem;width:380px;max-width:100%;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.logo{text-align:center;margin-bottom:1.5rem}
.logo .ico{font-size:42px}
.logo h1{font-size:22px;font-weight:700;margin-top:8px}
.logo p{font-size:14px;color:var(--text2);margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px}
.field input,.field select{width:100%;height:46px;padding:0 14px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;appearance:none;-webkit-appearance:none}
.field-select-wrap{position:relative}
.field-select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text2);font-size:14px}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{width:100%;height:48px;border:none;border-radius:10px;background:var(--text);color:var(--bg2);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:active{opacity:.85}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:12px;display:none;background:var(--red-bg);color:var(--red)}
.msg.show{display:block}
</style>
<link rel="stylesheet" href="/static/modern.css">
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="ico">🔐</div>
    <h1>Mi negocio</h1>
    <p>Inicia sesión para continuar</p>
  </div>
  <div class="field">
    <label>Sucursal</label>
    <div class="field-select-wrap">
      <select id="sucursal" autofocus>
        <option value="">Cargando...</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Usuario</label>
    <input id="usuario" autocomplete="username">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <button class="btn" onclick="entrar()">Entrar</button>
  <div class="msg" id="msg"></div>
</div>

<script src="/static/auth.js"></script>
<script>
// Si ya hay sesión activa, ir al inicio
if (getSesion() && getSesion().token) { location.href = '/'; }

async function cargarSucursales() {
  const sel = document.getElementById('sucursal');
  try {
    const r = await fetch('/api/sucursales');
    const sucursales = await r.json();
    if (!sucursales.length) {
      sel.innerHTML = '<option value="">Sin sucursales registradas</option>';
      return;
    }
    sel.innerHTML = sucursales.map(s => `<option value="${s.nombre}">${s.nombre}</option>`).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">Error al cargar</option>';
  }
}
cargarSucursales();

async function entrar() {
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const sucursal = document.getElementById('sucursal').value.trim();
  const msg = document.getElementById('msg');
  if (!sucursal) {
    msg.className = 'msg show'; msg.textContent = 'Selecciona una sucursal';
    return;
  }
  if (!usuario || !password) {
    msg.className = 'msg show'; msg.textContent = 'Ingresa usuario y contraseña';
    return;
  }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password, sucursal })
    });
    const data = await r.json();
    if (!r.ok) {
      msg.className = 'msg show'; msg.textContent = data.detail || 'No se pudo iniciar sesión';
      return;
    }
    localStorage.setItem('sesion', JSON.stringify(data));
    location.href = '/';
  } catch (e) {
    msg.className = 'msg show'; msg.textContent = 'Error de conexión';
  }
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') entrar();
});
</script>
</body>
</html>
