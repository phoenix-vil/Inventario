<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a1a18">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/static/icon-nav-v2.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/static/icon-nav-blanco.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/touch-icon-v3-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only Enterprises</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--red:#a32d2d;--red-bg:#fcebeb;--radius:14px;
  --t1:#2b2b28;--t2:#4a4a44;--tblob:#6b6b66;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--red:#f09595;--red-bg:#501313
}}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem;position:relative;overflow:hidden}

/* ─── Fondo animado: color y movimiento cambian según la tienda de la
   sucursal elegida (ver TEMAS en el script). Dos capas superpuestas se
   funden entre sí con una transición de opacidad al cambiar de tienda. ─── */
.fondo{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
/* inset:0 (nunca gira ni se sale del viewport, así no deja huecos en las
   esquinas); el movimiento lo da desplazar la posición del degradado sobre
   un lienzo más grande que su propia caja. */
.fondo-capa{position:absolute;inset:0;opacity:0;transition:opacity 1.15s ease;
  background:
    radial-gradient(circle at 25% 25%, color-mix(in srgb, var(--t1) 75%, transparent), transparent 55%),
    radial-gradient(circle at 78% 70%, color-mix(in srgb, var(--t2) 70%, transparent), transparent 55%),
    linear-gradient(135deg, var(--t1), var(--t2));
  background-size:170% 170%;
  animation:mover-fondo 13s ease-in-out infinite;
}
.fondo-capa.activa{opacity:1}
@keyframes mover-fondo{
  0%,100%{background-position:0% 0%}
  50%{background-position:100% 100%}
}

/* Siluetas orgánicas (no círculos): border-radius asimétrico que además va
   cambiando de forma mientras flotan, como una gota con vida propia. */
.blob{position:absolute;filter:blur(30px);opacity:.55;background:var(--tblob);
  border-radius:42% 58% 65% 35% / 45% 40% 60% 55%;
  transition:background 1.15s ease;animation:flotar 9s ease-in-out infinite}
.blob.b1{width:190px;height:190px;top:8%;left:6%;animation-delay:0s}
.blob.b2{width:250px;height:250px;top:56%;left:76%;animation-delay:-3s}
.blob.b3{width:160px;height:160px;top:76%;left:14%;animation-delay:-6s}
.blob.b4{width:210px;height:210px;top:10%;left:70%;animation-delay:-1.5s}
@keyframes flotar{
  0%,100%{transform:translate(0,0) rotate(0deg) scale(1);border-radius:42% 58% 65% 35% / 45% 40% 60% 55%}
  25%{transform:translate(45px,-55px) rotate(18deg) scale(1.12);border-radius:58% 42% 38% 62% / 62% 55% 45% 38%}
  50%{transform:translate(-30px,35px) rotate(-14deg) scale(.92);border-radius:50% 50% 40% 60% / 40% 60% 55% 45%}
  75%{transform:translate(30px,25px) rotate(10deg) scale(1.05);border-radius:38% 62% 55% 45% / 55% 42% 58% 40%}
}
@media(prefers-reduced-motion:reduce){.fondo-capa,.blob,.logo .ico,.card{animation:none}}

.card{position:relative;z-index:1;background:color-mix(in srgb, var(--bg2) 82%, transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0.5px solid var(--border);border-radius:18px;padding:2rem 1.75rem;width:380px;max-width:100%;box-shadow:0 12px 40px rgba(0,0,0,.14);transition:box-shadow .3s;animation:entrada .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes entrada{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.logo{text-align:center;margin-bottom:1.5rem}
.logo .ico{transition:filter .3s;animation:flotar-logo 4.5s ease-in-out infinite}
@keyframes flotar-logo{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.logo p{font-size:14px;color:var(--text2);margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px}
.field input,.field select{width:100%;height:46px;padding:0 14px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;appearance:none;-webkit-appearance:none}
.field-select-wrap{position:relative}
.field-select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text2);font-size:14px}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{width:100%;height:48px;border:none;border-radius:10px;background:var(--text);color:var(--bg2);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .3s}
.btn:active{opacity:.85}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:12px;display:none;background:var(--red-bg);color:var(--red)}
.msg.show{display:block}
</style>
<link rel="stylesheet" href="/static/modern.css?v=1787598500">
</head>
<body>

<div class="fondo">
  <div class="fondo-capa activa" id="fondo-a"></div>
  <div class="fondo-capa" id="fondo-b"></div>
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>

<div class="card">
  <div class="logo">
    <div class="ico" id="logo-login-wrap" style="display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap"></div>
    <p>Inicia sesión para continuar</p>
  </div>
  <div class="field">
    <label>Sucursal</label>
    <div class="field-select-wrap">
      <select id="sucursal" autofocus onchange="onCambioSucursal()">
        <option value="">Cargando...</option>
      </select>
    </div>
  </div>
  <div class="field">
    <label>Usuario</label>
    <input id="usuario" autocomplete="username">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <button class="btn" onclick="entrar()">Entrar</button>
  <div class="msg" id="msg"></div>
</div>

<script src="/static/auth.js?v=1787598500"></script>
<script>
// Si ya hay sesión activa, ir al inicio
if (getSesion() && getSesion().token) { location.href = '/'; }

let sucursales = [];

async function cargarSucursales() {
  const sel = document.getElementById('sucursal');
  try {
    const r = await fetch('/api/sucursales');
    sucursales = await r.json();
    if (!sucursales.length) {
      sel.innerHTML = '<option value="">Sin sucursales registradas</option>';
      return;
    }
    sel.innerHTML = sucursales.map(s => `<option value="${s.nombre}">${s.nombre}</option>`).join('');
    onCambioSucursal();
  } catch (e) {
    sel.innerHTML = '<option value="">Error al cargar</option>';
  }
}
cargarSucursales();
renderLogos('logo-login-wrap', [], 112); // logo genérico mientras carga / sin sucursal elegida

// ─── Fondo animado por tienda ────────────────────────────────────────────
// Paleta tomada de cada logo. Sin tienda única (genérico, o varias como
// Imprenta) usa un degradado neutro o mezcla las dos.
const TEMAS = {
  '': { t1: '#2b2b28', t2: '#4a4a44', blob: '#6b6b66' },
  'Only Reef': { t1: '#0d3d66', t2: '#4fc3d9', blob: '#2f8fb0' },
  'Only Garden': { t1: '#0d3d17', t2: '#4caf50', blob: '#2f7a35' },
  'Only Pets': { t1: '#122a52', t2: '#29b6d8', blob: '#1f6f97' },
  'Only Reptile': { t1: '#0f3d16', t2: '#7bc47f', blob: '#3f8f46' },
  'El Zar del LED': { t1: '#3a0d0d', t2: '#c9a227', blob: '#9c1f1f' },
};
let capaActiva = 'a';
function aplicarTema(tiendas) {
  let tema;
  if (tiendas && tiendas.length === 1 && TEMAS[tiendas[0]]) {
    tema = TEMAS[tiendas[0]];
  } else if (tiendas && tiendas.length > 1) {
    const a = TEMAS[tiendas[0]] || TEMAS[''];
    const b = TEMAS[tiendas[1]] || TEMAS[''];
    tema = { t1: a.t1, t2: b.t2, blob: a.blob };
  } else {
    tema = TEMAS[''];
  }
  const siguiente = capaActiva === 'a' ? 'b' : 'a';
  const elSiguiente = document.getElementById('fondo-' + siguiente);
  const elActual = document.getElementById('fondo-' + capaActiva);
  elSiguiente.style.setProperty('--t1', tema.t1);
  elSiguiente.style.setProperty('--t2', tema.t2);
  document.documentElement.style.setProperty('--tblob', tema.blob);
  requestAnimationFrame(() => {
    elSiguiente.classList.add('activa');
    elActual.classList.remove('activa');
  });
  capaActiva = siguiente;
}

// El/los logo(s) y el fondo cambian según la(s) tienda(s) de la sucursal
// elegida (antes de iniciar sesión, todavía no hay sesión.tienda, así que se
// resuelve aparte). Imprenta (Only Reef + Only Garden) muestra ambos logos.
function onCambioSucursal() {
  const nombre = document.getElementById('sucursal').value;
  const suc = sucursales.find(s => s.nombre === nombre);
  const tiendas = (suc && suc.tiendas) || [];
  renderLogos('logo-login-wrap', tiendas, 112);
  aplicarTema(tiendas);
}

async function entrar() {
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const sucursal = document.getElementById('sucursal').value.trim();
  const msg = document.getElementById('msg');
  if (!sucursal) {
    msg.className = 'msg show'; msg.textContent = 'Selecciona una sucursal';
    return;
  }
  if (!usuario || !password) {
    msg.className = 'msg show'; msg.textContent = 'Ingresa usuario y contraseña';
    return;
  }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, password, sucursal })
    });
    const data = await r.json();
    if (!r.ok) {
      msg.className = 'msg show'; msg.textContent = data.detail || 'No se pudo iniciar sesión';
      return;
    }
    localStorage.setItem('sesion', JSON.stringify(data));
    location.href = '/';
  } catch (e) {
    msg.className = 'msg show'; msg.textContent = 'Error de conexión';
  }
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') entrar();
});
</script>
</body>
</html>
