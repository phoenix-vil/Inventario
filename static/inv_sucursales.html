<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --amber:#854f0b;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --amber:#ef9f27;--amber-bg:#412402;--red:#f09595;--red-bg:#501313
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:0.5px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-inicio{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;text-decoration:none;flex-shrink:0;transition:background .12s}
.btn-inicio:hover{background:var(--bg)}
.home-img{width:18px;height:18px;object-fit:contain}
@media(prefers-color-scheme:dark){.home-img{filter:invert(1)}}
.topbar-right{display:flex;gap:6px;align-items:center;flex-shrink:0}
.icon-btn{height:36px;width:36px;border:0.5px solid var(--border);border-radius:8px;background:transparent;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s;color:var(--text)}
.icon-btn:hover{background:var(--bg)}
.container{max-width:1100px;margin:0 auto;padding:1.25rem}
/* Filtros */
.filtros{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:flex-end}
.filtro-campo{display:flex;flex-direction:column;gap:4px}
.filtro-campo label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.filtros input,.filtros select{height:42px;padding:0 12px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.filtros input:focus,.filtros select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.filtros input{min-width:180px}
.sel-suc{min-width:180px;font-weight:600;border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
/* Stats */
.suc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:3px}
.stat-value{font-size:20px;font-weight:700}
.stat-value.danger{color:var(--red)}
/* Alertas */
.alert-section{background:var(--red-bg);border:0.5px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.alert-title{font-size:13px;font-weight:600;color:var(--red);margin-bottom:.75rem}
.alert-item{padding:.5rem 0;border-bottom:0.5px solid color-mix(in srgb,var(--red) 20%,transparent)}
.alert-item:last-child{border-bottom:none;padding-bottom:0}
.alert-nombre{font-weight:600;font-size:13px}
.alert-meta{font-size:12px;color:var(--text2);margin-top:2px}
.disponible-en{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag-suc{font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--green-bg);color:var(--green)}
.tag-none{font-size:11px;color:var(--text2)}
/* Sección header */
.sec-header{display:flex;align-items:center;gap:8px;margin:1.5rem 0 .75rem;font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.sec-header::after{content:'';flex:1;height:0.5px;background:var(--border)}
.badge-cnt{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--text2);text-transform:none;letter-spacing:0}
/* Tabla */
.tabla-wrap{overflow-x:auto;margin-bottom:.5rem}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text2);background:var(--bg);border-bottom:0.5px solid var(--border);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:10px 12px;border-bottom:0.5px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.th-g{background:var(--green-bg)!important;color:var(--green)!important}
.th-s{background:var(--blue-bg)!important;color:var(--blue)!important}
.td-g{font-weight:700;color:var(--green)}
.td-marca{color:var(--text2);font-size:12px}
.b0{color:var(--text2)}
.stock-bajo{color:var(--amber);font-weight:600}
.stock-out{color:var(--red);font-weight:600}
/* Asignar */
.arow{display:flex;align-items:center;gap:5px}
.qty-inp{width:72px;height:30px;text-align:center;border:0.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;-moz-appearance:textfield;transition:border-color .15s,box-shadow .15s}
.qty-inp::-webkit-outer-spin-button,.qty-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.qty-inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.btn-ok{height:30px;padding:0 10px;border:none;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;cursor:pointer;font-weight:600;transition:opacity .12s;white-space:nowrap}
.btn-ok:disabled{opacity:.4;cursor:not-allowed}
/* Escáner */
#qr-reader{width:100%;border-radius:8px;overflow:hidden;position:relative}
#qr-reader video{width:100%;border-radius:8px;display:block}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:42%;pointer-events:none}
.scan-frame::before{content:'';position:absolute;inset:0;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.55)}
.scan-corner{position:absolute;width:28px;height:28px;border:3px solid #4fc3f7;border-radius:6px;filter:drop-shadow(0 0 4px rgba(79,195,247,.6))}
.scan-corner.tl{top:-3px;left:-3px;border-right:none;border-bottom:none}
.scan-corner.tr{top:-3px;right:-3px;border-left:none;border-bottom:none}
.scan-corner.bl{bottom:-3px;left:-3px;border-right:none;border-top:none}
.scan-corner.br{bottom:-3px;right:-3px;border-left:none;border-top:none}
.scan-line{position:absolute;left:4%;right:4%;top:6%;height:2px;background:linear-gradient(90deg,transparent,#4fc3f7,transparent);box-shadow:0 0 10px #4fc3f7;animation:scanmove 2.2s ease-in-out infinite}
@keyframes scanmove{0%,100%{top:6%}50%{top:92%}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.open{display:flex;animation:ov-in .15s}
@keyframes ov-in{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:1.5rem;width:420px;max-width:96vw;animation:mod-in .18s}
@keyframes mod-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:17px;font-weight:600;margin-bottom:1rem}
.scan-msg{padding:9px;border-radius:8px;font-size:13px;margin-top:8px;background:var(--blue-bg);color:var(--blue);display:none}
.scan-msg.show{display:block}
.modal-footer{display:flex;justify-content:flex-end;margin-top:1rem}
.modal-footer button{height:40px;padding:0 16px;border-radius:8px;font-size:14px;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--text)}
.empty{text-align:center;padding:3rem;color:var(--text2)}
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);padding:.625rem 1.25rem;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:600px){.topbar{padding:0 .625rem}.topbar-title{font-size:15px}.filtros input{min-width:130px}}

/* --- Diseno del modal de traslado --- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{width:100%;height:42px;padding:0 12px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.tr-result-item{padding:10px 12px;border:0.5px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px;background:var(--bg2);transition:background .12s,border-color .12s}
.tr-result-item:hover{background:var(--bg);border-color:var(--blue)}
.tr-selected-card{margin-top:8px;padding:.75rem .875rem;background:var(--blue-bg);border:0.5px solid color-mix(in srgb,var(--blue) 30%,transparent);border-radius:10px;font-size:13px;color:var(--blue);font-weight:600;align-items:center;gap:8px}
.tr-arrow-icon{text-align:center;font-size:20px;color:var(--text2);margin:-6px 0 12px}
.tr-empty{font-size:12px;color:var(--text2);padding:8px 2px}
.tr-hint{font-size:12px;color:var(--text2);margin-top:4px}
.modal-footer button:disabled{opacity:.5;cursor:not-allowed}
</style>

<body>

<div class="topbar">
  <a href="/" class="btn-inicio" title="Inicio"><img src="/static/icon-nav-v2.png" alt="Inicio" class="nav-icon" style="height:32px;width:32px"></a>
  <h1 class="topbar-title">🏪 Inventario por sucursal</h1>
  <div class="topbar-right">
    <button class="icon-btn" onclick="abrirEscaner()" title="Escanear código">📷</button>
    <button onclick="abrirTraslado()" class="icon-btn" title="Trasladar stock entre sucursales" style="width:auto;padding:0 10px;font-size:12px">🔄 Trasladar</button>
    <button onclick="descargarCSV()" class="icon-btn" title="Exportar CSV" style="width:auto;padding:0 10px;font-size:12px">⬇ CSV</button>
    <button onclick="cargar()" class="icon-btn" title="Actualizar">↻</button>
  </div>
</div>

<div class="container">
  <div class="filtros">
    <div class="filtro-campo">
      <label>Sucursal</label>
      <select id="f-suc" class="sel-suc" onchange="onCambioSucursal()">
        <option value="">Cargando...</option>
      </select>
    </div>
    <div class="filtro-campo">
      <label>Buscar</label>
      <input type="search" id="f-buscar" placeholder="Nombre, marca o código..." oninput="render()">
    </div>
    <div class="filtro-campo">
      <label>Categoría</label>
      <select id="f-cat" onchange="render()"><option value="">Todas</option></select>
    </div>
    <div class="filtro-campo">
      <label>Marca</label>
      <select id="f-marca" onchange="render()"><option value="">Todas</option></select>
    </div>
  </div>

  <!-- Stats -->
  <div class="suc-stats" id="suc-stats" style="display:none">
    <div class="stat"><div class="stat-label">Productos asignados</div><div class="stat-value" id="st-asig">—</div></div>
    <div class="stat"><div class="stat-label">Unidades asignadas</div><div class="stat-value" id="st-unid">—</div></div>
    <div class="stat"><div class="stat-label">Unidades vendidas</div><div class="stat-value" id="st-vend">—</div></div>
    <div class="stat"><div class="stat-label">Restante en sucursal</div><div class="stat-value" id="st-rest">—</div></div>
    <div class="stat"><div class="stat-label">⚠️ Agotados en suc.</div><div class="stat-value danger" id="st-agot">—</div></div>

<!-- Modal traslado de stock entre sucursales -->

    <div class="field">

</div>

<!-- Modal escáner -->
<div class="overlay" id="scanner-overlay">
  <div class="modal">
    <h2>Escanear código de barras</h2>
    <div id="qr-reader">
      <video id="scan-video" playsinline autoplay muted></video>
      <div class="scan-frame">
        <span class="scan-corner tl"></span><span class="scan-corner tr"></span>
        <span class="scan-corner bl"></span><span class="scan-corner br"></span>
        <div class="scan-line"></div>
      </div>

    <div class="scan-msg" id="scan-msg"></div>

<div class="toast" id="toast"></div>

<script src="/static/auth.js?v=1787605997"></script>
<script>
requireEnterprise();   // pantalla de Only Enterprises

const NO_ASIG = '__no_asignados__';
let data = null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,err=false){
  const t=document.getElementById('toast');t.textContent=msg;
  t.style.background=err?'var(--red)':'var(--text)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}
function fmt(n,pp){
  if(n===null||n===undefined||Number(n)===0)return '<span class="b0">—</span>';
  return pp?Number(n).toFixed(3)+' kg':String(Number(n));
}
function fmtNum(n,pp){
  return pp?Number(n).toFixed(3)+' kg':String(Number(n));
}

/* ── Carga ── */
async function cargar(){
  document.getElementById('tabla-cont').innerHTML='<div class="empty">Cargando...</div>';
  document.getElementById('alert-agotado').style.display='none';
  document.getElementById('suc-stats').style.display='none';
  try{
    const r=await authFetch('/api/inventario/por-sucursal');
    if(!r.ok)throw new Error();
    data=await r.json();
    poblarSucursales();
    poblarFiltros();
    onCambioSucursal();
  }catch(e){
    document.getElementById('tabla-cont').innerHTML='<div class="empty">Error al cargar datos</div>';
  }
}

function poblarSucursales(){
  const sel=document.getElementById('f-suc');
  const val=sel.value;
  // "No Asignados" es opción especial solo en esta pantalla, no viene de la API
  // por eso no aparece en el login (que usa /api/sucursales directamente)
  let opts=`<option value="${NO_ASIG}">⚠️ Sin asignación en ninguna sucursal</option>`;
  opts+=data.sucursales.map(s=>`<option value="${esc(s)}">🏪 Sucursal ${esc(s)}</option>`).join('');
  sel.innerHTML=opts;
  if(val&&val!==NO_ASIG&&data.sucursales.includes(val)) sel.value=val;
  else if(data.sucursales.length) sel.value=data.sucursales[0];
}

function poblarFiltros(){
  const cats=[...new Set(data.productos.map(p=>p.categoria))].sort();
  const marcas=[...new Set(data.productos.map(p=>p.marca).filter(Boolean))].sort();
  const sc=document.getElementById('f-cat'),sm=document.getElementById('f-marca');
  const vc=sc.value,vm=sm.value;
  sc.innerHTML='<option value="">Todas</option>'+cats.map(c=>`<option value="${esc(c)}"${c===vc?' selected':''}>${esc(c)}</option>`).join('');
  sm.innerHTML='<option value="">Todas</option>'+marcas.map(m=>`<option value="${esc(m)}"${m===vm?' selected':''}>${esc(m)}</option>`).join('');
}

function onCambioSucursal(){actualizarStats();renderAlertas();render();}

/* ── Stats ── */
function actualizarStats(){
  const suc=document.getElementById('f-suc').value;
  if(!data||suc===NO_ASIG){document.getElementById('suc-stats').style.display='none';return;}
  document.getElementById('suc-stats').style.display='grid';
  let asig=0,unid=0,vend=0,rest=0,agot=0;
  data.productos.forEach(p=>{
    const d=p.por_sucursal[suc]||{asignado:0,vendido:0};
    if(d.asignado>0){
      asig++;unid+=d.asignado;vend+=d.vendido;
      const r=d.asignado-d.vendido;
      rest+=r;
      if(r<=0)agot++;
    }
  });
  document.getElementById('st-asig').textContent=asig;
  document.getElementById('st-unid').textContent=Math.round(unid*1000)/1000;
  document.getElementById('st-vend').textContent=Math.round(vend*1000)/1000;
  document.getElementById('st-rest').textContent=Math.round(rest*1000)/1000;
  document.getElementById('st-agot').textContent=agot;
}

/* ── Alertas agotado ── */
function renderAlertas(){
  const suc=document.getElementById('f-suc').value;
  const cont=document.getElementById('alert-agotado');
  if(!data||suc===NO_ASIG){cont.style.display='none';return;}
  const agotados=data.productos.filter(p=>{
    const d=p.por_sucursal[suc]||{asignado:0,vendido:0};
    return d.asignado>0&&(d.asignado-d.vendido)<=0;
  });
  if(!agotados.length){cont.style.display='none';return;}
  let html=`<div class="alert-section"><div class="alert-title">🚨 Agotados en Suc. ${esc(suc)} — Disponibilidad en otras sucursales</div>`;
  agotados.forEach(p=>{
    const otros=data.sucursales.filter(s=>{
      if(s===suc)return false;
      const d2=p.por_sucursal[s]||{asignado:0,vendido:0};
      return(d2.asignado-d2.vendido)>0;
    });
    const tags=otros.length
      ?otros.map(s=>{const d2=p.por_sucursal[s]||{asignado:0,vendido:0};const r=Math.round((d2.asignado-d2.vendido)*1000)/1000;return`<span class="tag-suc">Suc.${esc(s)}: ${p.vendido_por_peso?r.toFixed(3)+' kg':r}</span>`;}).join(' ')
      :`<span class="tag-none">Sin stock en otras sucursales · Global: ${p.vendido_por_peso?p.stock_global.toFixed(3)+' kg':p.stock_global}</span>`;
    html+=`<div class="alert-item"><div class="alert-nombre">${esc(p.nombre)}</div>
      <div class="alert-meta">${esc(p.categoria)}${p.marca?' · '+esc(p.marca):''}</div>
      <div class="disponible-en">${tags}</div></div>`;
  });
  html+='</div>';
  cont.innerHTML=html;cont.style.display='block';
}

/* ── Render ── */
function filtrar(prods,suc){
  const q=document.getElementById('f-buscar').value.toLowerCase();
  const cat=document.getElementById('f-cat').value;
  const marca=document.getElementById('f-marca').value;
  return prods.filter(p=>{
    const mq=!q||p.nombre.toLowerCase().includes(q)||(p.marca||'').toLowerCase().includes(q)||p.categoria.toLowerCase().includes(q)||(p.codigo_barras||'')===(q);
    return mq&&(!cat||p.categoria===cat)&&(!marca||p.marca===marca);
  });
}

function render(){
  if(!data)return;
  const suc=document.getElementById('f-suc').value;
  if(!suc){document.getElementById('tabla-cont').innerHTML='<div class="empty">Selecciona una sucursal</div>';return;}

  if(suc===NO_ASIG){
    // Solo productos sin asignación en NINGUNA sucursal. Se mira
    // stock_disponible (global: stock menos lo asignado en toda la empresa) y
    // no por_sucursal, que ahora solo trae las sucursales que esta sesión ve:
    // si no, un producto asignado en otra tienda saldría aquí como no asignado.
    const sinNinguna=filtrar(data.productos,suc).filter(p=>
      p.stock_disponible >= p.stock_global
    );
    if(!sinNinguna.length){
      document.getElementById('tabla-cont').innerHTML='<div class="empty">✅ Todo el inventario tiene asignación en alguna sucursal</div>';
      return;
    }
    let html=`<div class="sec-header">⚠️ Sin asignación en ninguna sucursal <span class="badge-cnt">${sinNinguna.length}</span></div>`;
    html+=tablaNoAsignados(sinNinguna);
    document.getElementById('tabla-cont').innerHTML=html;
    return;
  }

  // Vista normal de sucursal: separar asignados vs no asignados a ESTA sucursal
  const todos=filtrar(data.productos,suc);
  const asignados=todos.filter(p=>(p.por_sucursal[suc]||{}).asignado>0);
  const noAsignadosAqui=todos.filter(p=>!((p.por_sucursal[suc]||{}).asignado>0));

  let html='';

  // Sección 1: asignados
  if(asignados.length){
    html+=`<div class="sec-header">📦 Asignados a Suc. ${esc(suc)} <span class="badge-cnt">${asignados.length}</span></div>`;
    html+=tablaAsignados(asignados,suc);
  }

  // Sección 2: no asignados A ESTA sucursal (pero pueden estar en otras)
  if(noAsignadosAqui.length){
    html+=`<div class="sec-header">➕ No asignados a Suc. ${esc(suc)} — disponibles del stock global <span class="badge-cnt">${noAsignadosAqui.length}</span></div>`;
    html+=tablaAsignarNuevo(noAsignadosAqui,suc);
  }

  if(!html) html='<div class="empty">Sin productos</div>';
  document.getElementById('tabla-cont').innerHTML=html;
}

function cabecera(cols){
  return `<thead><tr>${cols.map(([txt,cls])=>`<th class="${cls||''}">${txt}</th>`).join('')}</tr></thead>`;
}

function filaBase(p,suc){
  const globalCls=p.stock_global===0?'stock-out':p.stock_global<=p.stock_minimo?'stock-bajo':'td-g';
  // Stock del pool (sin asignar a nadie): mostrado como "Para distribuir"
  const dispCls=p.stock_disponible<=0?'stock-out':p.stock_disponible<=p.stock_minimo?'stock-bajo':'';
  return `
    <td><strong>${esc(p.nombre)}</strong></td>
    <td class="td-marca">${p.marca?esc(p.marca):'<span class="b0">—</span>'}</td>
    <td style="color:var(--text2);font-size:12px">${esc(p.categoria)}</td>
    <td class="${globalCls}">${fmtNum(p.stock_global,p.vendido_por_peso)}</td>
    <td class="${dispCls}" title="Stock global menos lo ya asignado a todas las sucursales">${fmtNum(p.stock_disponible,p.vendido_por_peso)}</td>`;
}

function tablaAsignados(prods,suc){
  let html=`<div class="tabla-wrap"><table>${cabecera([
    ['Producto'],['Marca'],['Categoría'],
    ['Stock global','th-g'],['Para distribuir','th-g'],
    ['Asignado a suc.','th-s'],['Vendido en suc.','th-s'],['Restante en suc.','th-s'],
  ])}<tbody>`;
  prods.forEach(p=>{
    const d=p.por_sucursal[suc]||{asignado:0,vendido:0};
    // maxAsig: pool disponible + lo que ya tiene esta sucursal (puede reasignar)
    const maxAsig=Math.max(0,p.stock_disponible)+d.asignado;
    const restante=d.asignado-d.vendido;
    const restCls=restante<=0?'stock-out':restante<=p.stock_minimo?'stock-bajo':'td-g';
    const step=p.vendido_por_peso?'0.001':'1';
    html+=`<tr>${filaBase(p,suc)}
      <td>
        <div class="arow">
          <input type="number" class="qty-inp" id="inp-${p.id}"
            min="0" max="${maxAsig}" step="${step}"
            value="${d.asignado}" onfocus="this.select()">
          <button class="btn-ok" onclick="guardar(${p.id},'${suc}',${p.vendido_por_peso?1:0})">✓ Guardar</button>
        </div>
      </td>
      <td>${fmt(d.vendido,p.vendido_por_peso)}</td>
      <td class="${restCls}">${fmtNum(restante,p.vendido_por_peso)}</td>
    </tr>`;
  });
  return html+'</tbody></table></div>';
}

function tablaAsignarNuevo(prods,suc){
  let html=`<div class="tabla-wrap"><table>${cabecera([
    ['Producto'],['Marca'],['Categoría'],
    ['Stock global','th-g'],['Para distribuir','th-g'],
    ['Asignar a suc.','th-s'],
  ])}<tbody>`;
  prods.forEach(p=>{
    const maxAsig=Math.max(0,p.stock_disponible);
    const step=p.vendido_por_peso?'0.001':'1';
    const dispCls=p.stock_disponible<=0?'stock-out':'';
    html+=`<tr>${filaBase(p,suc)}
      <td>
        ${p.stock_disponible>0
          ?`<div class="arow">
              <input type="number" class="qty-inp" id="inp-${p.id}"
                min="0" max="${maxAsig}" step="${step}"
                placeholder="0" onfocus="this.select()">
              <button class="btn-ok" onclick="guardar(${p.id},'${suc}',${p.vendido_por_peso?1:0})">✓ Asignar</button>
            </div>`
          :`<span class="stock-out" style="font-size:12px">Sin stock disponible</span>`}
      </td>
    </tr>`;
  });
  return html+'</tbody></table></div>';
}

function tablaNoAsignados(prods){
  let html=`<div class="tabla-wrap"><table>${cabecera([
    ['Producto'],['Marca'],['Categoría'],
    ['Stock global','th-g'],['Para distribuir','th-g'],
    ['Sucursal destino','th-s'],['Cantidad','th-s'],
  ])}<tbody>`;
  prods.forEach(p=>{
    const maxAsig=Math.max(0,p.stock_disponible);
    const step=p.vendido_por_peso?'0.001':'1';
    html+=`<tr>${filaBase(p,null)}
      <td>
        <select id="suc-${p.id}" style="height:30px;padding:0 8px;border:0.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px">
          ${data.sucursales.map(s=>`<option value="${esc(s)}">${s}</option>`).join('')}
        </select>
      </td>
      <td>
        <div class="arow">
          <input type="number" class="qty-inp" id="inp-${p.id}" min="0" max="${maxAsig}" step="${step}" placeholder="0" onfocus="this.select()">
          <button class="btn-ok" onclick="guardarConSucursal(${p.id},${p.vendido_por_peso?1:0})">✓ Asignar</button>
        </div>
      </td>
    </tr>`;
  });
  return html+'</tbody></table></div>';
}

/* ── Guardar ── */
async function guardar(productoId, sucursal, porPeso){
  const input=document.getElementById('inp-'+productoId);
  if(!input)return;
  const val=Math.max(0,parseFloat(input.value)||0);
  const p=data.productos.find(x=>x.id===productoId);
  if(!p)return;
  const ant=(p.por_sucursal[sucursal]||{}).asignado||0;
  // pool disponible real = actual + lo que ya tenía esta sucursal
  const maxAsig=Math.max(0,p.stock_disponible)+ant;
  if(val>maxAsig){
    toast(`Máximo disponible: ${porPeso?maxAsig.toFixed(3)+' kg':maxAsig}`,true);
    input.value=maxAsig;return;
  }
  const btn=input.nextElementSibling;btn.disabled=true;
  try{
    const r=await authFetch('/api/stock-sucursal',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({producto_id:productoId,sucursal,cantidad:val})});
    const d=await r.json();
    if(!r.ok){toast(d.detail||'Error',true);btn.disabled=false;return;}
    toast(`✓ ${porPeso?val.toFixed(3)+' kg':val} asignado a Suc. ${sucursal}`);
    // Actualizar localmente: liberar ant y consumir val del pool
    p.stock_disponible=Math.round((p.stock_disponible+ant-val)*1000)/1000;
    p.por_sucursal[sucursal]={...(p.por_sucursal[sucursal]||{}),asignado:val};
    actualizarStats();renderAlertas();render();
  }catch(e){toast('Error de conexión',true);btn.disabled=false;}
}

async function guardarConSucursal(productoId, porPeso){
  const sucursal=document.getElementById('suc-'+productoId).value;
  if(!sucursal){toast('Selecciona una sucursal',true);return;}
  await guardar(productoId, sucursal, porPeso);
}

/* ── CSV ── */
function descargarCSV(){
  if(!data)return;
  const sucs=data.sucursales;
  let csv='Producto,Marca,Categoría,Stock global,Para distribuir,'+
    sucs.flatMap(s=>[`"Asignado Suc.${s}"`,`"Vendido Suc.${s}"`,`"Restante Suc.${s}"`]).join(',')+'\n';
  data.productos.forEach(p=>{
    const g=p.vendido_por_peso?p.stock_global.toFixed(3):p.stock_global;
    const d=p.vendido_por_peso?p.stock_disponible.toFixed(3):p.stock_disponible;
    const cols=sucs.flatMap(s=>{
      const d2=p.por_sucursal[s]||{asignado:0,vendido:0};
      const r=Math.round((d2.asignado-d2.vendido)*1000)/1000;
      return p.vendido_por_peso
        ?[d2.asignado.toFixed(3),d2.vendido.toFixed(3),r.toFixed(3)]
        :[d2.asignado,d2.vendido,r];
    });
    csv+=`"${p.nombre.replace(/"/g,'""')}","${(p.marca||'').replace(/"/g,'""')}","${p.categoria}",${g},${d},${cols.join(',')}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='inventario_sucursales.csv';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

/* ── Escáner ── */
let zxingStream=null,scanLoop=null;
async function abrirEscaner(){
  const msg=document.getElementById('scan-msg');
  msg.className='scan-msg';msg.style.background='';msg.style.color='';
  document.getElementById('scanner-overlay').classList.add('open');
  if(!window.isSecureContext){msg.className='scan-msg show';msg.style.background='var(--red-bg)';msg.style.color='var(--red)';msg.textContent='La cámara requiere HTTPS.';return;}
  if(!navigator.mediaDevices){msg.className='scan-msg show';msg.style.background='var(--red-bg)';msg.style.color='var(--red)';msg.textContent='Cámara no soportada.';return;}
  let i=0;while(!window.BarcodeDetectorPolyfill&&i<20){await new Promise(r=>setTimeout(r,150));i++;}
  if(!window.BarcodeDetectorPolyfill){msg.className='scan-msg show';msg.style.background='var(--red-bg)';msg.style.color='var(--red)';msg.textContent='No se cargó el escáner.';return;}
  const video=document.getElementById('scan-video');
  try{
    zxingStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]},audio:false});
    video.srcObject=zxingStream;await video.play();
    msg.className='scan-msg show';msg.textContent=`Cámara activa (${video.videoWidth}x${video.videoHeight}). Apunta al código...`;
    const detector=new window.BarcodeDetectorPolyfill({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf']});
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    let det=false;
    scanLoop=setInterval(async()=>{
      if(det||!video.videoWidth)return;det=true;
      try{
        const vw=video.videoWidth,vh=video.videoHeight;
        const cw=Math.floor(vw*.7),ch=Math.floor(vh*.42);
        canvas.width=cw;canvas.height=ch;
        ctx.drawImage(video,Math.floor((vw-cw)/2),Math.floor((vh-ch)/2),cw,ch,0,0,cw,ch);
        const codes=await detector.detect(canvas);
        if(codes.length){clearInterval(scanLoop);scanLoop=null;onCodigo(codes[0].rawValue);}
      }catch(e){}det=false;
    },300);
  }catch(e){msg.className='scan-msg show';msg.style.background='var(--red-bg)';msg.style.color='var(--red)';msg.textContent='No se pudo acceder a la cámara: '+(e.message||e.name);}
}
async function cerrarEscaner(){
  document.getElementById('scanner-overlay').classList.remove('open');
  if(scanLoop){clearInterval(scanLoop);scanLoop=null;}
  if(zxingStream){zxingStream.getTracks().forEach(t=>t.stop());zxingStream=null;}
  const v=document.getElementById('scan-video');if(v)v.srcObject=null;
}
function onCodigo(codigo){
  cerrarEscaner();
  if(!data)return;
  const prod=data.productos.find(p=>p.codigo_barras===codigo);
  document.getElementById('f-buscar').value=prod?prod.nombre:codigo;
  render();
  toast(prod?'📦 '+prod.nombre:'Código no encontrado: '+codigo,!prod);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarEscaner();});

/* ── Traslado de stock entre sucursales ─────────────────────────────────── */
let trProductoSel = null;

function abrirTraslado(){
  // Origen: solo las sucursales cuyo inventario ve esta sesión (de su misma
  // tienda). Destino: cualquiera de las registradas — mandar producto a otra
  // tienda es válido, aunque no puedas ver su inventario.
  const destinos = (data && data.sucursales_registradas) || [];
  if(!data || !data.sucursales.length){
    toast('Necesitas al menos 2 sucursales registradas para trasladar', true);
    return;
  }
  if(destinos.length < 2){
    toast('Necesitas al menos 2 sucursales para poder trasladar stock', true);
    return;
  }
  trProductoSel = null;
  document.getElementById('tr-buscar').value = '';
  document.getElementById('tr-resultados').innerHTML = '';
  document.getElementById('tr-seleccionado').style.display = 'none';
  document.getElementById('tr-cantidad').value = '';
  document.getElementById('tr-msg').className = 'scan-msg';

  const origSel = document.getElementById('tr-origen');
  const destSel = document.getElementById('tr-destino');
  origSel.innerHTML = data.sucursales.map(s=>`<option value="${esc(s)}">Suc. ${esc(s)}</option>`).join('');
  destSel.innerHTML = destinos.map(s=>`<option value="${esc(s)}">Suc. ${esc(s)}</option>`).join('');
  const otroDestino = destinos.find(s=>s!==origSel.value);
  if(otroDestino) destSel.value = otroDestino;

  const _btnR = document.getElementById('tr-btn-confirmar');
  if(_btnR){ _btnR.disabled=false; _btnR.textContent='🔄 Confirmar traslado'; }
  document.getElementById('modal-traslado').classList.add('open');
  actualizarStockOrigen();
}

function cerrarTraslado(){
  document.getElementById('modal-traslado').classList.remove('open');
  trProductoSel = null;
}

function filtrarTraslado(){
  const q = document.getElementById('tr-buscar').value.toLowerCase().trim();
  const cont = document.getElementById('tr-resultados');
  if(!q || !data){ cont.innerHTML=''; return; }
  const encontrados = data.productos.filter(p=>
    p.nombre.toLowerCase().includes(q) || (p.marca||'').toLowerCase().includes(q) || (p.codigo_barras||'')===q
  ).slice(0, 8);
  if(!encontrados.length){ cont.innerHTML = '<div class="tr-empty">Sin resultados</div>'; return; }
  cont.innerHTML = encontrados.map(p=>`
    <div class="tr-result-item" onclick='seleccionarProductoTraslado(${p.id})'>
      <strong>${esc(p.nombre)}</strong>${p.marca?' · '+esc(p.marca):''}
    </div>`).join('');
}

function seleccionarProductoTraslado(id){
  trProductoSel = data.productos.find(p=>p.id===id);
  if(!trProductoSel) return;
  document.getElementById('tr-buscar').value = '';
  document.getElementById('tr-resultados').innerHTML = '';
  const sel = document.getElementById('tr-seleccionado');
  sel.style.display = 'flex';
  sel.textContent = '📦 ' + trProductoSel.nombre;
  actualizarStockOrigen();
}

function actualizarStockOrigen(){
  const disp = document.getElementById('tr-disponible');
  if(!trProductoSel){ disp.textContent=''; return; }
  const origen = document.getElementById('tr-origen').value;
  const d = trProductoSel.por_sucursal[origen] || {asignado:0, vendido:0};
  const restante = Math.round((d.asignado - d.vendido)*1000)/1000;
  const unidad = trProductoSel.vendido_por_peso ? ' kg' : '';
  disp.textContent = `Disponible en Suc. ${origen}: ${restante}${unidad}`;
  document.getElementById('tr-cantidad').max = Math.max(0, restante);
}

async function confirmarTraslado(){
  const msg = document.getElementById('tr-msg');
  const btn = document.getElementById('tr-btn-confirmar');

  function mostrarError(texto){
    msg.className='scan-msg show'; msg.style.background='var(--red-bg)'; msg.style.color='var(--red)'; msg.textContent=texto;
  }

  if(!trProductoSel){ mostrarError('Selecciona un producto'); return; }

  const origen = document.getElementById('tr-origen').value;
  const destino = document.getElementById('tr-destino').value;
  const cantidad = parseFloat(document.getElementById('tr-cantidad').value);

  if(origen === destino){ mostrarError('La sucursal de origen y destino deben ser distintas'); return; }
  if(isNaN(cantidad) || cantidad<=0){ mostrarError('Cantidad inválida'); return; }

  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Trasladando...';

  try{
    const r = await authFetch('/api/stock-sucursal/trasladar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({producto_id:trProductoSel.id, sucursal_origen:origen, sucursal_destino:destino, cantidad})
    });
    const d = await r.json();
    if(!r.ok){ mostrarError(d.detail||'Error'); btn.disabled=false; btn.textContent=textoOriginal; return; }
    toast(`✓ ${cantidad} trasladado de Suc.${origen} a Suc.${destino}`);
    cerrarTraslado();
    cargar();
  }catch(e){
    mostrarError('Error de conexión');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

cargar();
