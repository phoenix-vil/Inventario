<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a1a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · Only Enterprises</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --amber:#854f0b;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --amber:#ef9f27;--amber-bg:#412402;--red:#f09595;--red-bg:#501313
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:0.5px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center}
.btn-inicio{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);text-decoration:none}
.icon-btn{height:36px;width:36px;border:0.5px solid var(--border);border-radius:8px;background:transparent;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.container{max-width:800px;margin:0 auto;padding:1.25rem 1.25rem 6rem}

.btn-agregar{width:100%;height:52px;border:none;border-radius:14px;background:var(--text);color:var(--bg2);font-size:16px;font-weight:700;cursor:pointer;margin-bottom:1.25rem}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.25rem}
.stat{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:22px;font-weight:800}
.stat-value.red{color:var(--red)}

.search-bar{margin-bottom:1.25rem}
.search-bar input{width:100%;height:46px;padding:0 16px;border:0.5px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--text);font-size:15px;font-family:inherit}
.search-bar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}

.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.grid-clientes{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.grid-clientes .columna{min-width:0}
.grid-clientes .card{min-width:0}
.grupo-titulo{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.02em;margin:0 0 .5rem 2px}
.grupo-titulo .badge{background:var(--border);color:var(--text2);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
.grupo-titulo.deben{color:var(--red)}
.grupo-titulo.deben .badge{background:var(--red-bg);color:var(--red)}
.cliente-row{padding:.7rem .75rem;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .1s;overflow:hidden}
.cliente-row:last-child{border-bottom:none}
.cliente-row:hover{background:var(--bg)}
.cliente-nombre{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cliente-row-sub{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:2px}
.cliente-tel{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.cliente-saldo{font-weight:800;font-size:13px;white-space:nowrap}
.cliente-saldo.debe{color:var(--red)}
.cliente-saldo.sin-deuda{color:var(--text2);font-weight:600;font-size:11px}

.empty{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:14px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:1.5rem;width:460px;max-width:96vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:700;margin-bottom:1.25rem}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.field input,.field textarea{width:100%;height:44px;padding:0 14px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.field textarea{height:70px;padding:10px 14px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.metodo-btn{flex:1;height:44px;border:0.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.metodo-btn.activo{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.modal-footer button{height:44px;padding:0 18px;border-radius:10px;font-size:14px;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--text)}
.modal-footer button.primary{background:var(--text);color:var(--bg2);border:none;font-weight:600}
.msg{padding:9px;border-radius:8px;font-size:13px;margin-top:8px;display:none}
.msg.show{display:block}
.msg.error{background:var(--red-bg);color:var(--red)}
.msg.ok{background:var(--green-bg);color:var(--green)}

/* Detalle de cliente */
.detalle-saldo{text-align:center;padding:1.25rem;background:var(--red-bg);border-radius:12px;margin-bottom:1.25rem}
.detalle-saldo.sin-deuda{background:var(--green-bg)}
.detalle-saldo-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.detalle-saldo-valor{font-size:32px;font-weight:800;color:var(--red)}
.detalle-saldo.sin-deuda .detalle-saldo-valor{color:var(--green)}
.btn-abono{width:100%;height:48px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:1.25rem}
.hist-section-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:1rem 0 .5rem}
.hist-row{display:flex;justify-content:space-between;padding:.625rem 0;border-bottom:0.5px solid var(--border);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-fecha{color:var(--text2);font-size:11px}
@media(max-width:600px){.topbar{padding:0 .625rem}.topbar-title{font-size:15px}}
</style>
<link rel="stylesheet" href="/static/modern.css?v=1787605997">
<style>
.tk-head,.tk-foot{text-align:center;margin:8px 0}
.tk-sub{font-size:12px;color:var(--text);text-align:center}
.tk-items{padding:8px 0;margin:8px 0}
.tk-line{display:flex;justify-content:space-between;margin-bottom:4px;font-family:ui-monospace,monospace;font-size:13px}
.tk-total{font-weight:700;font-size:16px;margin-top:8px;padding-top:8px}
.tk-desc{color:var(--red)}
.tk-ahorro{color:var(--green);font-weight:600}
.tk-foot{font-size:12px;color:var(--text2);margin-top:10px}
#recibo-contenido{background:var(--bg);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
</style>

<body>

<div class="topbar">
  <a href="/" class="btn-inicio" title="Inicio"><img src="/static/icon-nav-v2.png" alt="Inicio" class="nav-icon" style="height:32px;width:32px"></a>
  <h1 class="topbar-title">👥 Clientes</h1>
  <button class="icon-btn" onclick="cargarClientes()" title="Actualizar">↻</button>
</div>

<div class="container">
  <button class="btn-agregar" onclick="abrirNuevoCliente()">+ Nuevo cliente</button>

  <div class="stats-grid">
    <div class="stat">
      <div class="stat-label">Cuentas por cobrar</div>
      <div class="stat-value red" id="st-total">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Clientes con saldo</div>
      <div class="stat-value" id="st-num">—</div>
    </div>
  </div>

  <div class="search-bar">
    <input type="search" id="buscar" placeholder="Buscar cliente por nombre..." oninput="filtrarClientes()">
  </div>

  <div id="lista-clientes">
    <div class="card"><div class="empty">Cargando...</div></div>
  </div>
</div>

<!-- Modal nuevo/editar cliente -->
<div class="overlay" id="modal-cliente">
  <div class="modal">
    <h2 id="cliente-modal-titulo">+ Nuevo cliente</h2>
    <div class="field"><label>Nombre *</label><input type="text" id="cl-nombre" placeholder="Nombre completo"></div>
    <div class="field"><label>Teléfono</label><input type="tel" inputmode="numeric" autocomplete="tel" id="cl-telefono" placeholder="10 dígitos, ej. 5527671391" oninput="limitarTel(this)"></div>
    <div class="field" id="campo-nivel" style="display:none">
      <label>Tipo de precio</label>
      <select id="cl-nivel">
        <option value="">Mostrador (precio normal)</option>
        <option value="1">Precio 1</option>
        <option value="2">Precio 2</option>
        <option value="3">Precio 3</option>
      </select>
    </div>
    <div class="field"><label>Límite de crédito (opcional)</label><input type="number" id="cl-limite" min="0" step="0.01" placeholder="Sin límite"></div>
    <div class="field"><label>Nota</label><textarea id="cl-nota" placeholder="Notas adicionales..."></textarea></div>
    <div class="msg" id="cliente-msg"></div>
    <div class="modal-footer">
      <button onclick="cerrarModalCliente()">Cancelar</button>
      <button class="primary" onclick="guardarCliente()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal detalle de cliente -->
<div class="overlay" id="modal-detalle">
  <div class="modal">
    <h2 id="detalle-nombre">Cliente</h2>
    <div class="detalle-saldo" id="detalle-saldo-cont">
      <div class="detalle-saldo-label">Saldo pendiente</div>
      <div class="detalle-saldo-valor" id="detalle-saldo-valor">$0.00</div>
    </div>
    <button class="btn-abono" onclick="mostrarFormAbono()">💰 Registrar abono</button>
    <button class="btn-abono" id="btn-liquidar" onclick="abrirLiquidar()" style="display:none;background:var(--bg2);color:var(--red);border:0.5px solid var(--red)">🧾 Liquidar cuenta (poner en $0)</button>
    <div id="form-abono" style="display:none;margin-bottom:1.25rem;padding:.875rem;background:var(--bg);border-radius:10px">
      <div class="field"><label>Monto del abono *</label><input type="number" id="ab-monto" min="0" step="0.01" placeholder="0.00"></div>
      <div class="field">
        <label>Método de pago</label>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <button type="button" id="ab-btn-efectivo" class="metodo-btn activo" onclick="setMetodoAbono('efectivo')">💵 Efectivo</button>
          <button type="button" id="ab-btn-tarjeta" class="metodo-btn" onclick="setMetodoAbono('tarjeta')">💳 Tarjeta</button>
          <button type="button" id="ab-btn-transferencia" class="metodo-btn" onclick="setMetodoAbono('transferencia')">🏦 Transferencia</button>
        </div>
      </div>
      <!-- Sección tarjeta (datos del ticket de la TPV) -->
      <div id="ab-sec-tarjeta" style="display:none">
        <div class="field"><label>Terminal (TPV)</label><input id="ab-tpv-term" placeholder="Ej: Clip, BBVA, etc." autocomplete="off"></div>
        <div class="field"><label>Referencia / No. de operación *</label><input id="ab-tpv-ref" placeholder="Ej: 001234" autocomplete="off"></div>
        <div class="field"><label>Código de autorización *</label><input id="ab-tpv-aut" placeholder="Ej: 456789" autocomplete="off"></div>
      </div>
      <!-- Sección transferencia -->
      <div id="ab-sec-transferencia" style="display:none">
        <div class="field"><label>Referencia / Folio (opcional)</label><input id="ab-transf-ref" placeholder="Ej: 998877" autocomplete="off"></div>
      </div>
      <div class="field"><label>Nota (opcional)</label><input type="text" id="ab-nota" placeholder="Ej: Pago parcial"></div>
      <button onclick="confirmarAbono()" style="width:100%;height:42px;border:none;border-radius:8px;background:var(--green);color:#fff;font-weight:600;cursor:pointer">Confirmar abono</button>
      <div class="msg" id="abono-msg"></div>
    </div>
    <div class="hist-section-title">Ventas a crédito</div>
    <div id="detalle-ventas"></div>
    <div class="hist-section-title">Pagos realizados</div>
    <div id="detalle-pagos"></div>
    <div class="modal-footer">
      <button onclick="abrirEditarCliente()">✏️ Editar</button>
      <button onclick="eliminarClienteActual()" id="btn-eliminar-cliente" style="color:var(--red);display:none">🗑 Eliminar</button>
      <button onclick="cerrarDetalle()">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/static/auth.js?v=1787605997"></script>
<script>
const _sesion = requireAuth();
// El tipo de precio solo tiene sentido donde se venden niveles de mayoreo
const usaNiveles = !!(_sesion && _sesion.usa_niveles_precio);
if(usaNiveles){
  const campo = document.getElementById('campo-nivel');
  if(campo) campo.style.display = '';
}

const _sesionActual = getSesion();
if(_sesionActual && _sesionActual.rol === 'gerente'){
  const _btnElim = document.getElementById('btn-eliminar-cliente');
  if(_btnElim) _btnElim.style.display = 'inline-block';
}

let clientesCache = [];
let clienteActualId = null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function money(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}

async function cargarClientes(){
  try{
    const [rLista, rResumen] = await Promise.all([
      authFetch('/api/clientes'),
      authFetch('/api/clientes-resumen').catch(()=>null),
    ]);
    clientesCache = await rLista.json();
    renderClientes(clientesCache);

    if(rResumen && rResumen.ok){
      const resumen = await rResumen.json();
      document.getElementById('st-total').textContent = money(resumen.total_por_cobrar);
      document.getElementById('st-num').textContent = resumen.num_clientes_con_saldo;
    } else {
      document.getElementById('st-total').style.display='none';
      document.getElementById('st-num').style.display='none';
    }
  }catch(e){
    document.getElementById('lista-clientes').innerHTML = '<div class="card"><div class="empty">Error al cargar</div></div>';
  }
}

function filtrarClientes(){
  const q = document.getElementById('buscar').value.toLowerCase();
  const filtrados = clientesCache.filter(c => c.nombre.toLowerCase().includes(q));
  renderClientes(filtrados);
}

// ─── Teléfono ───────────────────────────────────────────────────────────────
// Se escribe y se guarda en 10 dígitos pelados (el backend valida lo mismo y
// es quien manda); los espacios se ponen solo al mostrarlo. Mientras se teclea
// no se formatea, porque reacomodar el texto mueve el cursor y en el iPhone se
// vuelve incómodo escribir.
function soloDigitosTel(v){ return (v||'').replace(/\D/g,'').slice(0,10); }

function limitarTel(input){ input.value = soloDigitosTel(input.value); }

// 55, 56 (CDMX), 33 (Guadalajara) y 81 (Monterrey) son ladas de 2 dígitos; el
// resto del país las tiene de 3. Si el número guardado no trae 10 dígitos (los
// registrados antes de esta validación), se muestra tal cual está.
function formatearTel(v){
  const d = soloDigitosTel(v);
  if(d.length !== 10) return v || '';
  return ['55','56','33','81'].includes(d.slice(0,2))
    ? d.slice(0,2)+' '+d.slice(2,6)+' '+d.slice(6)
    : d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6);
}

// Mismas reglas que normalizar_telefono() en main.py. Devuelve el mensaje de
// error, o null si está bien (vacío también está bien: el campo es opcional).
function errorTelefono(digitos){
  if(!digitos) return null;
  if(digitos.length !== 10) return 'El teléfono debe tener 10 dígitos (escribiste '+digitos.length+')';
  if(digitos[0]==='0' || digitos[0]==='1') return 'El teléfono no puede empezar con 0 ni con 1';
  return null;
}

// Fila compacta: en columna angosta no alcanza el ancho para nombre+teléfono
// a la izquierda y saldo a la derecha en la misma línea, así que el saldo va
// debajo, junto al teléfono.
function filaCliente(c){
  const saldoHtml = c.saldo>0
    ? `<span class="cliente-saldo debe">${money(c.saldo)}</span>`
    : `<span class="cliente-saldo sin-deuda">Sin saldo</span>`;
  const sub = c.telefono ? esc(formatearTel(c.telefono)) : (c.nivel_precio ? 'Precio '+c.nivel_precio : '');
  return `<div class="cliente-row" onclick="abrirDetalle(${c.id})">
    <div class="cliente-nombre">${esc(c.nombre)}</div>
    <div class="cliente-row-sub">
      <span class="cliente-tel">${sub}</span>
      ${saldoHtml}
    </div>
  </div>`;
}

function columnaClientes(titulo, clase, lista, vacio){
  const badge = `<span class="badge">${lista.length}</span>`;
  const cuerpo = lista.length
    ? `<div class="card">${lista.map(filaCliente).join('')}</div>`
    : `<div class="card"><div class="empty">${vacio}</div></div>`;
  return `<div class="columna">
    <div class="grupo-titulo ${clase}">${titulo} ${badge}</div>
    ${cuerpo}
  </div>`;
}

function renderClientes(lista){
  const cont = document.getElementById('lista-clientes');
  if(!lista.length){
    cont.innerHTML = '<div class="card"><div class="empty">Sin clientes registrados</div></div>';
    return;
  }
  // A la izquierda los que deben (más saldo pendiente primero), a la derecha
  // los que no tienen deuda (alfabético, ya vienen así del backend).
  const deben = lista.filter(c => c.saldo > 0).sort((a,b) => b.saldo - a.saldo);
  const sinDeuda = lista.filter(c => !(c.saldo > 0));

  cont.innerHTML = '<div class="grid-clientes">'
    + columnaClientes('Deben', 'deben', deben, 'Nadie debe')
    + columnaClientes('Sin deuda', '', sinDeuda, 'Todos tienen deuda')
    + '</div>';
}

// ─── Nuevo / editar cliente ────────────────────────────────────────────────
function abrirNuevoCliente(){
  clienteActualId = null;
  document.getElementById('cliente-modal-titulo').textContent = '+ Nuevo cliente';
  document.getElementById('cl-nombre').value='';
  document.getElementById('cl-telefono').value='';
  document.getElementById('cl-nivel').value='';
  document.getElementById('cl-limite').value='';
  document.getElementById('cl-nota').value='';
  document.getElementById('cliente-msg').className='msg';
  document.getElementById('modal-cliente').classList.add('open');
}

function abrirEditarCliente(){
  const c = clientesCache.find(x=>x.id===clienteActualId);
  document.getElementById('cliente-modal-titulo').textContent = '✏️ Editar cliente';
  document.getElementById('cl-nombre').value = c ? c.nombre : '';
  document.getElementById('cl-telefono').value = c ? soloDigitosTel(c.telefono) : '';
  document.getElementById('cl-limite').value = c && c.limite_credito ? c.limite_credito : '';
  document.getElementById('cl-nivel').value = c && c.nivel_precio ? String(c.nivel_precio) : '';
  document.getElementById('cl-nota').value = '';
  document.getElementById('cliente-msg').className='msg';
  cerrarDetalle();
  document.getElementById('modal-cliente').classList.add('open');
}

function cerrarModalCliente(){
  document.getElementById('modal-cliente').classList.remove('open');
}

async function guardarCliente(){
  const msg = document.getElementById('cliente-msg');
  const nombre = document.getElementById('cl-nombre').value.trim();
  const digitosTel = soloDigitosTel(document.getElementById('cl-telefono').value);
  const telefono = digitosTel || null;
  const nivelRaw = document.getElementById('cl-nivel').value;
  const nivel_precio = usaNiveles && nivelRaw ? parseInt(nivelRaw, 10) : null;
  const limiteRaw = document.getElementById('cl-limite').value;
  const limite_credito = limiteRaw ? parseFloat(limiteRaw) : null;
  const nota = document.getElementById('cl-nota').value.trim() || null;

  if(!nombre){ msg.className='msg error show'; msg.textContent='Escribe el nombre del cliente'; return; }
  const errTel = errorTelefono(digitosTel);
  if(errTel){ msg.className='msg error show'; msg.textContent=errTel; return; }

  const url = clienteActualId ? '/api/clientes/'+clienteActualId : '/api/clientes';
  const metodo = clienteActualId ? 'PATCH' : 'POST';

  try{
    const r = await authFetch(url, {
      method: metodo, headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nombre, telefono, limite_credito, nota, nivel_precio})
    });
    const data = await r.json();
    if(!r.ok){ msg.className='msg error show'; msg.textContent=data.detail||'Error al guardar'; return; }
    cerrarModalCliente();
    cargarClientes();
  }catch(e){

async function generarPDFRecibo(datos){
  const jsPDFCtor = window.jspdf.jsPDF;
  const contenedor = document.createElement('div');
  contenedor.style.position = 'absolute';
  contenedor.style.left = '-9999px';
  contenedor.style.top = '0';
  contenedor.style.width = '300px';
  contenedor.style.background = '#ffffff';
  contenedor.style.padding = '16px 24px';
  contenedor.style.fontFamily = 'monospace';
  contenedor.style.fontSize = '13px';
  contenedor.style.color = '#000000';
  contenedor.innerHTML = generarReciboHTML(datos);
  contenedor.querySelectorAll('.tk-sub, .tk-foot, .tk-line, .tk-total').forEach(function(el){ el.style.color = '#000000'; });
  contenedor.querySelectorAll('.tk-desc').forEach(function(el){ el.style.color = '#a32d2d'; });
  contenedor.querySelectorAll('.tk-ahorro').forEach(function(el){ el.style.color = '#3b6d11'; });
  document.body.appendChild(contenedor);

  try{
    await new Promise(function(r){ setTimeout(r, 80); });
    const canvas = await html2canvas(contenedor, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const pdfWidth = 320;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    const doc = new jsPDFCtor({unit:'pt', format:[pdfWidth, pdfHeight], orientation:'portrait'});
    doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    return doc.output('blob');
  } finally {
    document.body.removeChild(contenedor);
  }
}

async function compartirComoPDF(datos, nombreArchivo){
  const blob = await generarPDFRecibo(datos);
  const archivo = new File([blob], nombreArchivo, {type:'application/pdf'});

  const puedeCompartir = navigator.canShare && navigator.canShare({files:[archivo]});
  console.log('[diagnostico compartir] canShare files:', puedeCompartir, '| tamano archivo:', archivo.size, 'bytes | tipo:', archivo.type);
  if(puedeCompartir){
    try{
      await navigator.share({files:[archivo]});
      return;
    }catch(e){
      console.log('[diagnostico compartir] navigator.share fallo:', e.name, e.message);
      if(e.name === 'AbortError') return;
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  alert('Tu navegador no permite compartir directo. Se descargó el PDF: adjúntalo manualmente en WhatsApp.');
}

// Misma bandera que usa /pagos para saber si esta PC tiene el agente del
// cajón/impresora instalado (localStorage, no la sesión: es del dispositivo,
// no del usuario). Un abono en efectivo también saca dinero de la caja —debe
// abrir el cajón igual que una venta— y aquí además se imprime el recibo
// directo, con el mismo diseño que ves en pantalla; el botón para activar
// la bandera vive en /pagos, no hace falta repetirlo aquí.
const AGENTE_ACTIVO_KEY = 'agente_pos_local';
const AGENTE_BASE_URL = 'http://127.0.0.1:8788';

function agenteLocalActivo(){
  return localStorage.getItem(AGENTE_ACTIVO_KEY) === '1';
}

// "Best effort" a propósito: si el agente no responde a tiempo no debe
// interrumpir ni avisar del abono ya registrado.
function abrirCajonDinero(){
  if(!agenteLocalActivo()) return;
  const controlador = new AbortController();
  setTimeout(() => controlador.abort(), 1500);
  fetch(AGENTE_BASE_URL + '/abrir-cajon', {method:'POST', signal: controlador.signal}).catch(()=>{});
}

// Genera el recibo del abono como imagen PNG, igual al diseño que se ve en
// pantalla o se comparte por WhatsApp/PDF (mismo patrón que generarPDFRecibo,
// solo que entrega el canvas directo como Blob en vez de meterlo en un PDF).
async function generarImagenReciboTermica(data){
  const contenedor = document.createElement('div');
  contenedor.style.position = 'absolute';
  contenedor.style.left = '-9999px';
  contenedor.style.top = '0';
  contenedor.style.width = '300px';
  contenedor.style.background = '#ffffff';
  contenedor.style.padding = '16px 24px';
  contenedor.style.fontFamily = 'monospace';
  contenedor.style.fontSize = '13px';
  contenedor.style.color = '#000000';
  contenedor.innerHTML = generarReciboHTML(data);
  contenedor.querySelectorAll('.tk-sub, .tk-foot, .tk-line, .tk-total').forEach(function(el){ el.style.color = '#000000'; });
  contenedor.querySelectorAll('.tk-desc').forEach(function(el){ el.style.color = '#a32d2d'; });
  contenedor.querySelectorAll('.tk-ahorro').forEach(function(el){ el.style.color = '#3b6d11'; });
  document.body.appendChild(contenedor);
  try{
    await new Promise(function(r){ setTimeout(r, 80); });
    const canvas = await html2canvas(contenedor, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    return await new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
  } finally {
    document.body.removeChild(contenedor);
  }
}

// Si esta PC tiene el agente activado, le manda la imagen del recibo para
// que la imprima directo en la impresora térmica. Si no responde a tiempo o
// falla, cae sola al diálogo de impresión de siempre (imprimirRecibo, que
// usa reciboActual —ya asignado por mostrarRecibo antes de llamar aquí—),
// así nunca se pierde el recibo aunque el agente se haya caído ese día.
async function intentarImpresionDirectaRecibo(data){
  if(!agenteLocalActivo()) return;
  const controlador = new AbortController();
  const vencido = setTimeout(() => controlador.abort(), 8000);
  try{
    const png = await generarImagenReciboTermica(data);
    if(!png) throw new Error('no se pudo generar la imagen del recibo');
    const r = await fetch(AGENTE_BASE_URL + '/imprimir-ticket', {
      method: 'POST', headers: {'Content-Type': 'image/png'},
      body: png, signal: controlador.signal
    });
    if(!r.ok) throw new Error('el agente respondió con error');
  }catch(e){
    imprimirRecibo();
  }finally{
    clearTimeout(vencido);
  }
}

async function confirmarAbono(){
  const msg = document.getElementById('abono-msg');
  const monto = parseFloat(document.getElementById('ab-monto').value);
  const nota = document.getElementById('ab-nota').value.trim() || null;

  if(isNaN(monto) || monto<=0){ msg.className='msg error show'; msg.textContent='Monto inválido'; return; }

  const body = {monto, nota, metodo_pago: metodoAbono};
  if(metodoAbono==='tarjeta'){
    const ref = document.getElementById('ab-tpv-ref').value.trim();
    const aut = document.getElementById('ab-tpv-aut').value.trim();
    if(!ref || !aut){ msg.className='msg error show'; msg.textContent='Ingresa la referencia y autorización de la TPV'; return; }
    body.tpv_referencia = ref;
    body.tpv_autorizacion = aut;
    body.tpv_terminal = document.getElementById('ab-tpv-term').value.trim() || null;
  }else if(metodoAbono==='transferencia'){
    body.transferencia_referencia = document.getElementById('ab-transf-ref').value.trim() || null;
  }

  try{
    const r = await authFetch('/api/clientes/'+clienteActualId+'/pagos', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if(!r.ok){ msg.className='msg error show'; msg.textContent=data.detail||'Error'; return; }
    document.getElementById('form-abono').style.display='none';
    abrirDetalle(clienteActualId);
    cargarClientes();
    mostrarRecibo(data);
    if(data.metodo_pago==='efectivo'){
      abrirCajonDinero();
      intentarImpresionDirectaRecibo(data);
    }
  }catch(e){
    msg.className='msg error show'; msg.textContent='Error de conexión';
  }
}

    const r = await authFetch('/api/clientes/'+clienteActualId+'/liquidar', {
      method:'POST', headers:{'Content-Type':'application/json'},

    cerrarLiquidar();
