<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --amber:#854f0b;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb;--radius:10px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --amber:#ef9f27;--amber-bg:#412402;--red:#f09595;--red-bg:#501313
}}
html.tema-oscuro{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --amber:#ef9f27;--amber-bg:#412402;--red:#f09595;--red-bg:#501313
}
html.tema-claro{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --amber:#854f0b;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb;--radius:10px
}
html.tema-oscuro .home-img{filter:invert(1)}
html.tema-claro .home-img{filter:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:0.5px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:84px;justify-content:flex-end}
.btn-inicio{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;text-decoration:none;flex-shrink:0;white-space:nowrap}
.btn-inicio:hover{background:var(--bg)}
.home-img{width:18px;height:18px;object-fit:contain;display:block}
@media(prefers-color-scheme:dark){.home-img{filter:invert(1)}}
.icon-btn{height:36px;width:36px;border:0.5px solid var(--border);border-radius:8px;background:transparent;font-size:16px;cursor:pointer;min-width:44px;min-height:44px}
/* El padding inferior debe ganarle a la altura real de .totales, que crece
   cuando hay descuento y ahorro visibles (medido hasta ~237px) — con menos
   margen, el fondo del carrito queda tapado por la barra incluso bajando del
   todo la página. Ver .cart más abajo para el scroll propio del carrito. */
.container{max-width:760px;margin:0 auto;padding:1rem 1.25rem 18rem}
.search-row{display:flex;gap:8px;margin-bottom:1rem}
.search-row input{flex:1;height:46px;padding:0 14px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:16px;font-family:inherit}
.search-row input:focus{outline:2px solid var(--blue);outline-offset:1px}
.search-row button{height:46px;width:46px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg2);font-size:20px;cursor:pointer}
.resultados{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem;max-height:200px;overflow-y:auto}
.res-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;cursor:pointer}
.res-item:active{background:var(--bg)}
.res-name{font-weight:600;font-size:14px}
.res-meta{font-size:12px;color:var(--text2)}
.res-price{font-weight:700;color:var(--blue);white-space:nowrap}
.section-title{font-size:13px;font-weight:600;color:var(--text2);margin:1rem 0 .5rem;text-transform:uppercase;letter-spacing:.5px}
/* Scroll propio: con muchos artículos, antes crecía sin límite y los últimos
   quedaban tapados por la barra fija de cobrar (ver .container arriba).
   overflow-y:auto en vez de overflow:hidden -- con ambos ejes distintos de
   "visible" el navegador sigue recortando las esquinas redondeadas igual. */
.cart{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;max-height:45vh;overflow-y:auto;overflow-x:hidden}
.cart-empty{text-align:center;padding:2.5rem 1rem;color:var(--text2)}
.cart-item{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;border-bottom:0.5px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-price{font-size:12px;color:var(--text2)}
.ci-price-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ci-price-old{font-size:11px;color:var(--text2);text-decoration:line-through}
.ci-desc-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--red-bg);color:var(--red)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border:0.5px solid var(--border);border-radius:6px;background:transparent;color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.qty button:active{background:var(--bg)}
.qty-input{width:58px;height:30px;text-align:center;font-weight:600;font-size:14px;border:0.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;-moz-appearance:textfield}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty-input:focus{outline:2px solid var(--blue);outline-offset:1px}
.qty-unidad{font-size:11px;color:var(--text2)}
.ci-importe{font-weight:700;min-width:70px;text-align:right;font-size:14px}
.ci-del{width:34px;height:34px;border-radius:9px;border:0.5px solid var(--red-bg);background:var(--red-bg);color:var(--red);font-size:15px;cursor:pointer;flex-shrink:0}
.ci-desc-btn{width:34px;height:34px;border-radius:9px;border:0.5px solid var(--green-bg);background:var(--green-bg);color:var(--green);font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0}
.totales{position:fixed;bottom:0;left:16px;right:16px;background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:0.5px solid var(--border);border-bottom:none;border-radius:16px 16px 0 0;padding:1rem 1.25rem;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.totales-inner{max-width:760px;margin:0 auto}
.linea{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;color:var(--text2)}
.linea.desc{color:var(--red)}
.linea-ahorro{color:var(--green)!important;font-weight:600}
.linea-total{display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin:6px 0 12px}
.acciones{display:flex;gap:8px}
.acciones button{flex:1;height:48px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--text)}
.btn-desc{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.btn-cobrar{background:var(--green);color:#fff;border-color:var(--green)}
.btn-cobrar:disabled{opacity:.4;cursor:not-allowed}
/* Modales */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:1.5rem;width:400px;max-width:96vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:600;margin-bottom:1rem}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.field input,.field select{width:100%;height:42px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}
.modal-footer button{height:40px;padding:0 16px;border-radius:8px;font-size:14px;cursor:pointer;border:0.5px solid var(--border);background:transparent;color:var(--text)}
.modal-footer .primary{background:var(--text);color:var(--bg2);border-color:var(--text)}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:8px;display:none}
.msg.show{display:block}
.msg.error{background:var(--red-bg);color:var(--red)}
.msg.ok{background:var(--green-bg);color:var(--green)}
.metodo-btn{flex:1;height:44px;border:0.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.metodo-btn.activo{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
#qr-reader{width:100%;border-radius:8px;overflow:hidden;position:relative;margin-bottom:8px}
#qr-reader video{width:100%;border-radius:8px;display:block}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:42%;pointer-events:none}
.scan-frame::before{content:'';position:absolute;inset:0;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.55)}
.scan-corner{position:absolute;width:28px;height:28px;border:3px solid #4fc3f7;border-radius:6px;filter:drop-shadow(0 0 4px rgba(79,195,247,.6))}
.scan-corner.tl{top:-3px;left:-3px;border-right:none;border-bottom:none}
.scan-corner.tr{top:-3px;right:-3px;border-left:none;border-bottom:none}
.scan-corner.bl{bottom:-3px;left:-3px;border-right:none;border-top:none}
.scan-corner.br{bottom:-3px;right:-3px;border-left:none;border-top:none}
.scan-line{position:absolute;left:4%;right:4%;top:6%;height:2px;background:linear-gradient(90deg,transparent,#4fc3f7,transparent);box-shadow:0 0 10px #4fc3f7;animation:scanmove 2.2s ease-in-out infinite}
@keyframes scanmove{0%,100%{top:6%}50%{top:92%}}
.ticket{font-family:ui-monospace,monospace;font-size:13px;background:var(--bg);border-radius:8px;padding:1rem;margin:0.5rem 0}
.ticket .tk-line{display:flex;justify-content:space-between;margin-bottom:3px}
.ticket .tk-total{font-weight:700;font-size:15px;border-top:1px dashed var(--border);margin-top:6px;padding-top:6px}
.tk-head,.tk-foot{text-align:center;margin:8px 0}
.tk-negocio{font-size:18px;font-weight:700}
.tk-sub{font-size:12px;color:var(--text);text-align:center}
.tk-items{padding:8px 0;margin:8px 0}
.tk-line{display:flex;justify-content:space-between;margin-bottom:4px;font-family:ui-monospace,monospace;font-size:13px}
.tk-total{font-weight:700;font-size:16px;margin-top:8px;padding-top:8px}
.tk-desc{color:var(--red)}
.tk-ahorro{color:var(--green);font-weight:600}
.tk-foot{font-size:12px;color:var(--text2);margin-top:10px}
#ticket-contenido{background:var(--bg);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
@media(max-width:560px){
  .topbar{padding:0 .625rem}.topbar-title{font-size:15px}.topbar-right{min-width:0}
  .container{padding:.875rem .875rem 18rem}
  /* En pantallas angostas el stepper de cantidad + precio + botones ya no
     dejan casi nada de ancho para el nombre del producto (se veía cortado a
     1-2 letras). Aquí el nombre pasa a ocupar su propia línea completa, y el
     resto de los controles se acomoda debajo. */
  .cart-item{flex-wrap:wrap}
  .ci-info{flex-basis:100%}
}

/* ─── Escritorio ancho: búsqueda a la izquierda, carrito completo (con
   botones de pago debajo) a la derecha ───────────────────────────────────
   Solo entra a partir de 1024px (una PC o el contenedor de escritorio,
   nunca un teléfono ni la mayoría de las tabletas en vertical) — la versión
   móvil de aquí abajo no se toca en nada: panel-buscar/panel-carrito son
   bloques normales sin ningún estilo en móvil, y .totales sigue fija abajo
   con position:fixed sin importar en qué nivel del HTML esté anidada.
   .container pasa a display:contents (desaparece como caja, sin tocar el
   DOM) para que panel-buscar y panel-carrito entren directo a la cuadrícula
   de .pos-layout como sus dos columnas.

   Las dos columnas quedan con una altura fija (la pantalla completa menos
   la barra de arriba), y adentro cada una es un renglón de flex en columna:
   el encabezado no se encoge, la lista de en medio sí (flex:1) y hace
   scroll interno propio si no cabe, y el bloque de pago se queda siempre
   visible al fondo del carrito, nunca empujado fuera de la pantalla. */
@media(min-width:1024px){
  .pos-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 56px;
    max-width:1400px;
    margin:0 auto;
    padding:1.25rem;
    height:calc(100vh - 54px - 2.5rem);
  }
  .container{display:contents}
  .panel-buscar,.panel-carrito{display:flex;flex-direction:column;min-height:0;height:100%}
  /* Línea divisoria entre las dos columnas, además del espacio del gap: se
     nota más la separación que solo con aire en blanco. */
  .panel-carrito{border-left:0.5px solid var(--border);padding-left:28px}
  .search-row,.section-title,#resultados-titulo{flex-shrink:0}
  .resultados,.cart{flex:1;min-height:0;max-height:none;overflow-y:auto}
  /* El carrito completo (título + lista + pago) queda del lado derecho, uno
     debajo del otro; ya no flota fijo abajo como en móvil, sino el último
     renglón fijo (no se encoge) de esa columna. */
  .totales{
    flex-shrink:0;
    position:static;
    border-radius:16px;
    border-bottom:0.5px solid var(--border);
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .totales-inner{max-width:none}
}
</style>

<body>

<div class="topbar">
  <a href="/" class="btn-inicio" title="Inicio"><img src="/static/icon-nav-v2.png" alt="Inicio" class="nav-icon" style="height:32px;width:32px"></a>
  <h1 class="topbar-title">💳 Punto de venta</h1>
  <div class="topbar-right">
    <span id="nav-operador" style="font-size:12px;color:var(--text2);white-space:nowrap"></span>
    <button class="icon-btn" onclick="abrirPendientes()" title="Ventas en espera" style="position:relative;margin-right:4px">
    ⏸<span id="badge-pendientes" style="display:none;position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:16px;height:16px;align-items:center;justify-content:center;padding:0 3px;pointer-events:none"></span>
  </button>
  <button class="icon-btn" id="btn-agente-local" onclick="configurarAgenteLocal()" title="Impresora y cajón en esta computadora">🖨️</button>
  <a href="/historial" class="icon-btn" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none" title="Historial">📋</a>
  </div>
</div>

<!-- pos-layout envuelve ambas: en móvil no hace nada (los dos siguen igual
     que siempre, .container en flujo normal y .totales fija abajo); en
     escritorio ancho (ver @media min-width:1024px) los pone lado a lado en
     dos columnas, para aprovechar el espacio que sobra en un monitor. -->
<div class="pos-layout">
<div class="container">
  <!-- panel-buscar/panel-carrito no hacen nada en móvil (bloques normales,
       transparentes): el orden visual sigue siendo el de siempre. En
       escritorio (@media min-width:1024px) son las dos columnas. -->
  <div class="panel-buscar">
    <div class="search-row">
      <input type="search" id="buscar" placeholder="Buscar producto por nombre…" oninput="buscar()" autocomplete="off">
      <button onclick="abrirEscaner()" title="Escanear">📷</button>
    </div>
    <div class="section-title" id="resultados-titulo" style="display:none"></div>
    <div class="resultados" id="resultados"></div>
  </div>

  <div class="panel-carrito">
    <div class="section-title">Carrito</div>
    <div class="cart" id="cart"></div>

    <div class="totales">
      <div class="totales-inner">
        <div class="linea"><span>Subtotal</span><span id="t-subtotal">$0.00</span></div>
        <div class="linea desc" id="linea-desc" style="display:none"><span id="desc-label">Descuento</span><span id="t-desc">-$0.00</span></div>
        <div class="linea linea-ahorro" id="linea-ahorro" style="display:none"><span>🎉 Ahorraste</span><span id="t-ahorro">$0.00</span></div>
        <div class="linea-total"><span>Total</span><span id="t-total">$0.00</span></div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <button class="btn-desc" onclick="abrirDescuento()" style="flex:1;height:48px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:0.5px solid var(--border)">% Descuento</button>
          <button onclick="abrirCustomVenta()" style="flex:1;height:48px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:0.5px solid var(--blue-bg);background:var(--blue-bg);color:var(--blue)">+ Personalizado</button>
        </div>
        <div class="acciones">
          <button onclick="dejarEnEspera()" style="width:100%;height:40px;margin-bottom:8px;border:0.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:14px;cursor:pointer">⏸ Dejar en espera</button>
          <button class="btn-cobrar" id="btn-cobrar" onclick="abrirCobro()" disabled>Cobrar</button>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- Modal escáner -->
<div class="overlay" id="scanner-modal">
  <div class="modal">
    <h2>Escanear código</h2>
    <div id="qr-reader"><video id="scan-video" playsinline autoplay muted></video><div class="scan-frame"><span class="scan-corner tl"></span><span class="scan-corner tr"></span><span class="scan-corner bl"></span><span class="scan-corner br"></span><div class="scan-line"></div></div></div>
    <div class="msg" id="scan-msg"></div>
    <div class="modal-footer"><button onclick="cerrarEscaner()">Cerrar</button></div>
  </div>
</div>

<!-- Modal cantidad (productos por peso) -->

</div>

<!-- Modal descuento extra -->
<div class="overlay" id="desc-modal">

    <h2>Descuento extra</h2>

      <label>Descuento</label>

        <button type="button" id="desc-modo-monto" class="metodo-btn" onclick="setModoDescGeneral('monto')" style="flex:1">$ Monto</button>

      <button class="primary" onclick="autorizarDescuento()">Aplicar</button>
    </div>
  </div>
</div>

<!-- Modal descuento por articulo -->
<div class="overlay" id="item-desc-modal">
  <div class="modal">
    <h2>Descuento por artículo</h2>
    <p id="item-desc-nombre" style="font-size:13px;color:var(--text2);margin-bottom:12px"></p>
    <div class="field">
      <label>Descuento</label>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button type="button" id="item-desc-modo-pct" class="metodo-btn activo" onclick="setModoDescItem('pct')" style="flex:1">% Porcentaje</button>
        <button type="button" id="item-desc-modo-monto" class="metodo-btn" onclick="setModoDescItem('monto')" style="flex:1">$ Monto</button>
      </div>
      <input type="number" id="item-desc-valor" min="0" step="0.01" placeholder="0">
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/static/auth.js?v=1787605997"></script>
<script>
const sesionPOS = requireAuth();
requireSucursalOperativa();
let carrito = [];

// Revisar si viene un producto desde Consulta de Precios
(function(){
  const _quickAdd = sessionStorage.getItem('only_enterprises_quick_add');
  if(!_quickAdd) return;
  sessionStorage.removeItem('only_enterprises_quick_add');
  try{
    const _p = JSON.parse(_quickAdd);
    // Reintentar hasta que renderCarrito exista y la sesión esté lista
    let _try = 0;
    const _iv = setInterval(()=>{
      _try++;
      if(typeof renderCarrito === 'function' && typeof actualizarTotales === 'function'){
        clearInterval(_iv);
        carrito.push({
          id: _p.id, nombre: _p.nombre, precio: _p.precio,
          precioOriginal: _p.precioOriginal, cantidad: 1,
          vendido_por_peso: _p.vendido_por_peso, unidad: _p.unidad,
          stock: _p.stock
        });
        renderCarrito();
        actualizarTotales();
      }
      if(_try > 40) clearInterval(_iv);
    }, 100);
  }catch(e){ console.error('quick add error', e); }
})();


const _quickAdd = sessionStorage.getItem('only_enterprises_quick_add');
if(_quickAdd){
  sessionStorage.removeItem('only_enterprises_quick_add');
  try{
    const _p = JSON.parse(_quickAdd);
    // Esperar a que la sesión esté lista y luego agregar
    setTimeout(()=>{
      carrito = [{
        id: _p.id, nombre: _p.nombre, precio: _p.precio,
        precioOriginal: _p.precioOriginal, cantidad: 1,
        vendido_por_peso: _p.vendido_por_peso, unidad: _p.unidad,
        stock: _p.stock
      }];
      renderCarrito();
      actualizarTotales();
      document.getElementById('busqueda').focus();
    }, 200);
  }catch(e){}
}
        // {id, nombre, precio, cantidad, vendido_por_peso, unidad}
let descuentoExtra = 0;  // porcentaje
let autorizadoPor = null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function money(n){return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(p){const n=Math.round((Number(p)||0)*100)/100;return (n%1===0)?String(n):n.toFixed(2).replace(/0$/,'');}

// ─── Búsqueda ───────────────────────────────────────────────────────────
let debTimer;
function buscar(){clearTimeout(debTimer);debTimer=setTimeout(ejecutarBusqueda,250);}

async function ejecutarBusqueda(){
  const q = document.getElementById('buscar').value.trim();
  if(!q){ mostrarMasVendidos(); return; }
  document.getElementById('resultados-titulo').style.display='none';
  try{
    const r = await authFetch('/api/pos/buscar?q='+encodeURIComponent(q));
    const items = await r.json();
    renderResultados(items);
  }catch(e){}
}

// Con el buscador vacío (recién entrando, o al borrar lo que se escribió),
// en vez de dejar esa columna en blanco se sugieren los productos más
// vendidos de esta sucursal —mismo formato que una búsqueda normal, así que
// se agregan al carrito igual, con un clic—. Se pide una sola vez por
// visita a la pantalla: no cambia mientras se sigue vendiendo, así que no
// vale la pena consultarlo de nuevo cada vez que se borra el buscador.
let masVendidosCache = null;
async function mostrarMasVendidos(){
  const titulo = document.getElementById('resultados-titulo');
  titulo.textContent = '🔥 Más vendidos';
  titulo.style.display = 'block';
  if(masVendidosCache){ renderResultados(masVendidosCache); return; }
  try{
    const r = await authFetch('/api/pos/mas-vendidos');
    masVendidosCache = await r.json();
    // Si ya se escribió algo mientras esto cargaba, no lo pise
    if(!document.getElementById('buscar').value.trim()) renderResultados(masVendidosCache);
  }catch(e){}
}

let ultimosResultados = [];

function renderResultados(items){
  ultimosResultados = items;
  const cont = document.getElementById('resultados');
  if(!items.length){cont.innerHTML='<div class="res-meta" style="padding:8px">Sin resultados</div>';return;}
  cont.innerHTML = items.map((p,i)=>`
    <div class="res-item" onclick="agregarPorIndice(${i})">
      <div>
        <div class="res-name">${esc(p.nombre)}</div>
        <div class="res-meta">${esc(p.categoria)} · stock: ${p.vendido_por_peso?p.stock.toFixed(2)+' kg':p.stock}</div>
      </div>
      <div class="res-price">${money(p.precio_final)}${p.vendido_por_peso?'/kg':''}</div>
    </div>`).join('');
}

function agregarPorIndice(i){
  const p = ultimosResultados[i];
  if(p) agregar(p);
}

// ─── Carrito ────────────────────────────────────────────────────────────
let pesoPendiente = null;

function agregar(p){
  // Restriccion de stock agotado desactivada: se permite agregar aunque stock sea 0
  if(p.vendido_por_peso){
    pesoPendiente = p;
    document.getElementById('peso-titulo').textContent = p.nombre;
    document.getElementById('peso-label').textContent = `Peso en kg (disponible: ${p.stock.toFixed(2)} kg)`;
    document.getElementById('peso-input').value='';
    document.getElementById('peso-input').max=p.stock;
    document.getElementById('peso-modal').classList.add('open');
    setTimeout(()=>document.getElementById('peso-input').focus(),60);
    return;
  }
  const ex = carrito.find(c=>c.id===p.id);
  if(ex){
    if(ex.cantidad+1>p.stock){
      alert(`⚠️ Solo hay ${p.stock} unidades de "${p.nombre}" en stock.`);
      return;
    }
    ex.cantidad++;
  }
  else{carrito.push({id:p.id,nombre:p.nombre,precio:p.precio_final,precioOriginal:p.precio_venta,cantidad:1,vendido_por_peso:false,unidad:p.unidad,stock:p.stock});}
  limpiarBusqueda();
  renderCarrito();
}

function confirmarPeso(){
  const kg = parseFloat(document.getElementById('peso-input').value);
  if(isNaN(kg)||kg<=0){return;}
  const p = pesoPendiente;
  if(kg>p.stock){
    alert(`⚠️ Solo hay ${p.stock.toFixed(2)} kg de "${p.nombre}" en stock.`);
    return;
  }
  carrito.push({id:p.id,nombre:p.nombre,precio:p.precio_final,precioOriginal:p.precio_venta,cantidad:kg,vendido_por_peso:true,unidad:'kg',stock:p.stock});
  cerrarPeso();
  limpiarBusqueda();
  renderCarrito();
}
function cerrarPeso(){document.getElementById('peso-modal').classList.remove('open');pesoPendiente=null;}

function limpiarBusqueda(){
  const inp = document.getElementById('buscar');
  inp.focus();
  inp.select();
}

function cambiarCantidad(id,delta){
  const c = carrito.find(x=>x.id===id);
  if(!c)return;
  if(c.vendido_por_peso){
    const nuevo = Math.round((c.cantidad+delta*0.1)*1000)/1000;
    c.cantidad = Math.max(0.1, nuevo);
  }else{
    c.cantidad += delta;
    if(c.cantidad<=0){carrito=carrito.filter(x=>x.id!==id);}
  }
  renderCarrito();
}

function cambiarCantidadManual(id, input){
  const c = carrito.find(x=>x.id===id);
  if(!c)return;
  let val = parseFloat(input.value);
  if(isNaN(val)||val<0){val=c.vendido_por_peso?0.001:1;}
  if(c.vendido_por_peso){
    val = Math.round(val*1000)/1000;
    if(val<=0)val=0.001;
  }else{
    val = Math.round(val);
    if(val<=0)val=1;
  }
  if(c.stock!=null && val>c.stock){
    const disp = c.vendido_por_peso?c.stock.toFixed(3)+' kg':c.stock;
    alert(`⚠️ Solo hay ${disp} disponibles. Se ajustó al máximo.`);
    val = c.stock;
  }
  c.cantidad = val;
  renderCarrito();
}

function quitar(id){carrito=carrito.filter(x=>x.id!==id);renderCarrito();}

let itemDescuentoActualId = null;
let modoDescItem = 'pct';
function setModoDescItem(modo){
  modoDescItem = modo;
  document.getElementById('item-desc-modo-pct').classList.toggle('activo', modo==='pct');
  document.getElementById('item-desc-modo-monto').classList.toggle('activo', modo==='monto');
  document.getElementById('item-desc-valor').placeholder = modo==='pct' ? '0' : '0.00';
}

function descuentoItem(id){
  const c = carrito.find(x=>x.id===id);
  if(!c) return;
  itemDescuentoActualId = id;
  setModoDescItem('pct');
  const actual = (c.precioOriginal && c.precioOriginal>c.precio) ? Math.round((1-c.precio/c.precioOriginal)*100) : 0;
  document.getElementById('item-desc-nombre').textContent = c.nombre + ' — ' + (c.cantidad || 1) + ' x ' + money(c.precioOriginal) + ' = ' + money(c.precioOriginal * (c.cantidad || 1));
  document.getElementById('item-desc-valor').value = actual || '';
  document.getElementById('item-desc-msg').className = 'msg';
  document.getElementById('item-desc-modal').classList.add('open');
}

function cerrarDescuentoItem(){
  document.getElementById('item-desc-modal').classList.remove('open');
  itemDescuentoActualId = null;
}

function aplicarDescuentoItem(){
  const c = carrito.find(x=>x.id===itemDescuentoActualId);
  const msg = document.getElementById('item-desc-msg');
  if(!c){ cerrarDescuentoItem(); return; }
  const valor = parseFloat(document.getElementById('item-desc-valor').value);
  if(isNaN(valor) || valor<0){ msg.className='msg error show'; msg.textContent='Valor inválido'; return; }
  let nuevoPrecio;
  if(modoDescItem==='monto'){
    const cantItem = c.cantidad || 1;
    const totalOriginal = c.precioOriginal * cantItem;
    if(valor > totalOriginal){ msg.className='msg error show'; msg.textContent='El monto no puede ser mayor a ' + money(totalOriginal) + ' (' + cantItem + ' x ' + money(c.precioOriginal) + ')'; return; }
    nuevoPrecio = Math.round((c.precioOriginal - (valor / cantItem)) * 100) / 100;
  }else{
    if(valor>100){ msg.className='msg error show'; msg.textContent='Porcentaje inválido (0-100)'; return; }
    nuevoPrecio = Math.round(c.precioOriginal * (1 - valor/100) * 100) / 100;
  }
  c.precio = nuevoPrecio;
  renderCarrito();
  cerrarDescuentoItem();
}

function toastSeguro(msg){
  if(typeof toast==='function'){ toast(msg); }
}

async function actualizarBadgePendientes(){
  try{
    const r = await authFetch('/api/pos/pendientes?hoy_inicio='+encodeURIComponent(hoyInicioISO()));
    const lista = await r.json();
    const badge = document.getElementById('badge-pendientes');
    if(lista.length>0){
      badge.textContent = lista.length;
      badge.style.display='flex';
    }else{
      badge.style.display='none';
    }
  }catch(e){}
}

function hoyInicioISO(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0).toISOString();
}

async function abrirPendientes(){
  const cont = document.getElementById('pendientes-lista');
  cont.innerHTML = 'Cargando...';
  document.getElementById('pendientes-modal').classList.add('open');
  try{
    const r = await authFetch('/api/pos/pendientes?hoy_inicio='+encodeURIComponent(hoyInicioISO()));
    const lista = await r.json();
    if(!lista.length){
      cont.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text2)">No hay ventas en espera</div>';
      return;
    }
    cont.innerHTML = lista.map(p=>{
      const fecha = new Date(p.creado_en).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:.75rem 0;border-bottom:0.5px solid var(--border)">
        <div>
          <div style="font-weight:600;font-size:14px">${p.nota?esc(p.nota):('Venta de '+esc(p.operador||''))}</div>
          <div style="font-size:12px;color:var(--text2)">${p.num_items} artículo(s) · ${money(p.total_aprox)} · ${fecha}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="reanudarPendiente(${p.id})" style="height:34px;padding:0 12px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-size:13px;cursor:pointer">Reanudar</button>
          <button onclick="borrarPendiente(${p.id})" style="height:34px;padding:0 10px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--red);font-size:13px;cursor:pointer">🗑</button>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    cont.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text2)">Error al cargar</div>';
  }
}

function cerrarPendientes(){
  document.getElementById('pendientes-modal').classList.remove('open');
}

async function dejarEnEspera(){
  if(!carrito.length){ alert('El carrito está vacío'); return; }
  const nota = await promptPersonalizado('Nota para identificar esta venta (opcional):', '', 'Dejar en espera');
  if(nota===null) return;
  try{
    const r = await authFetch('/api/pos/pendientes', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({carrito, descuento_extra_pct: descuentoExtra, autorizado_por: autorizadoPor, nota: nota||null, hoy_inicio: hoyInicioISO()})
    });
    if(!r.ok){
      const data = await r.json().catch(()=>({}));
      alert(extraerMensajeError(data.detail, 'No se pudo dejar en espera'));
      return;
    }
    carrito = [];
    descuentoExtra = 0;
    autorizadoPor = null;
    renderCarrito();
    toastSeguro('Venta dejada en espera');
  }catch(e){ alert('Error de conexión'); }
}




async function reanudarPendiente(id){
  if(carrito.length>0){
    const confirmar = await confirmarPersonalizado('Ya tienes productos en el carrito actual. Si continúas, se perderán.', '⚠️ Carrito con productos');
    if(!confirmar) return;
  }
  try{
    const r = await authFetch('/api/pos/pendientes/'+id);
    if(!r.ok){ alert('No se pudo cargar la venta en espera'); return; }
    const data = await r.json();
    carrito = data.carrito || [];
    descuentoExtra = data.descuento_extra_pct || 0;
    autorizadoPor = data.autorizado_por || null;
    await authFetch('/api/pos/pendientes/'+id, {method:'DELETE'});
    renderCarrito();
    cerrarPendientes();
  }catch(e){ alert('Error de conexión'); }
}

async function borrarPendiente(id){
  const ok = await confirmarPersonalizado('¿Eliminar esta venta en espera? No se puede deshacer.', 'Eliminar venta en espera');
  if(!ok) return;
  try{
    await authFetch('/api/pos/pendientes/'+id, {method:'DELETE'});
    abrirPendientes();
    actualizarBadgePendientes();
  }catch(e){}
}

function renderCarrito(){
  const cont = document.getElementById('cart');
  if(!carrito.length){
    cont.innerHTML='<div class="cart-empty">Carrito vacío.<br>Busca o escanea un producto para empezar.</div>';
    descuentoExtra=0;autorizadoPor=null;
    actualizarTotales();
    actualizarBadgePendientes();
    document.getElementById('btn-cobrar').disabled=true;
    return;
  }
  cont.innerHTML = carrito.map(c=>{
    const importe = c.precio*c.cantidad;
    const step = c.vendido_por_peso?'0.001':'1';
    const cantVal = c.vendido_por_peso?c.cantidad.toFixed(3):c.cantidad;
    const tieneDesc = c.precioOriginal && c.precioOriginal>c.precio;
    const pctDesc = tieneDesc ? Math.round((1-c.precio/c.precioOriginal)*100) : 0;
    const precioLinea = tieneDesc
      ? `<span class="ci-price-old">${money(c.precioOriginal)}</span> <span class="ci-price">${money(c.precio)}${c.vendido_por_peso?'/kg':' c/u'}</span> <span class="ci-desc-badge">-${pctDesc}%</span>`
      : `<span class="ci-price">${money(c.precio)}${c.vendido_por_peso?'/kg':' c/u'}</span>`;
    return `<div class="cart-item">
      <div class="ci-info">
        <div class="ci-name">${esc(c.nombre)}${c.personalizado?' <span class="ci-desc-badge" style="background:var(--blue-bg);color:var(--blue)">Personalizado</span>':''}</div>
        <div class="ci-price-row">${precioLinea}</div>
      </div>
      <div class="qty">
        <button onclick="cambiarCantidad(${c.id},-1)">−</button>
        <input type="number" class="qty-input" inputmode="decimal" step="${step}" min="0" value="${cantVal}"
               onchange="cambiarCantidadManual(${c.id}, this)" onfocus="this.select()">
        ${c.vendido_por_peso?'<span class="qty-unidad">kg</span>':''}
        <button onclick="cambiarCantidad(${c.id},1)">+</button>
      </div>
      <div class="ci-importe">${money(importe)}</div>
      <button class="ci-desc-btn" onclick="descuentoItem(${c.id})" title="Descuento a este artículo">%</button>
      <button class="ci-del" onclick="quitar(${c.id})">🗑</button>
    </div>`;
  }).join('');
  actualizarTotales();
  actualizarBadgePendientes();
  document.getElementById('btn-cobrar').disabled=false;
}

function calcSubtotal(){return carrito.reduce((s,c)=>s+c.precio*c.cantidad,0);}
function calcAhorroProductos(){
  return carrito.reduce((s,c)=>{
    const orig = c.precioOriginal;
    if(orig && orig>c.precio) return s+(orig-c.precio)*c.cantidad;
    return s;
  },0);
}

function actualizarTotales(){
  const subtotal = calcSubtotal();
  const descMonto = subtotal*(descuentoExtra/100);
  const total = subtotal-descMonto;
  const ahorroProductos = calcAhorroProductos();
  const ahorroTotal = ahorroProductos+descMonto;
  document.getElementById('t-subtotal').textContent = money(subtotal);
  document.getElementById('t-total').textContent = money(total);
  const lineaDesc = document.getElementById('linea-desc');
  if(descuentoExtra>0){
    lineaDesc.style.display='flex';
    document.getElementById('desc-label').textContent = `Descuento ${fmtPct(descuentoExtra)}% (aut: ${autorizadoPor||'-'})`;
    document.getElementById('t-desc').textContent = '-'+money(descMonto);
  }else{
    lineaDesc.style.display='none';
  }
  const lineaAhorro = document.getElementById('linea-ahorro');
  if(ahorroTotal>0.005){
    lineaAhorro.style.display='flex';
    document.getElementById('t-ahorro').textContent = money(ahorroTotal);
  }else{
    lineaAhorro.style.display='none';
  }
}

function autorizarDescuento(){
  const valor = parseFloat(document.getElementById('d-valor').value);
  const msg = document.getElementById('desc-msg');
  if(isNaN(valor)||valor<0){msg.className='msg error show';msg.textContent='Valor inválido';return;}
  let pct;
  if(modoDescGeneral==='monto'){
    const subtotal = calcSubtotal();
    if(subtotal<=0){msg.className='msg error show';msg.textContent='El carrito está vacío';return;}
    if(valor>subtotal){msg.className='msg error show';msg.textContent='El monto no puede ser mayor al subtotal';return;}
    pct = Math.min(100, (valor/subtotal)*100);
  }else{
    if(valor>100){msg.className='msg error show';msg.textContent='El porcentaje no puede ser mayor a 100';return;}
    pct = valor;
  }
  descuentoExtra=pct;
  autorizadoPor=sesionPOS?sesionPOS.usuario:null;
  actualizarTotales();
  cerrarDescuento();
}

// ─── Cobro ──────────────────────────────────────────────────────────────
let metodoPago = 'efectivo';

function extraerMensajeError(detail, fallback){
  if(!detail) return fallback;
  if(typeof detail === 'string') return detail;
  if(Array.isArray(detail)){
    return detail.map(function(e){
      if(typeof e === 'string') return e;
      if(e && e.msg) return e.msg;
      return JSON.stringify(e);
    }).join(' — ');
  }
  return fallback;
}

const ORDEN_METODOS = ['efectivo', 'tarjeta', 'credito', 'transferencia'];

function irAMetodo(direccion){
  const n = ORDEN_METODOS.length;
  const i = ORDEN_METODOS.indexOf(metodoPago);
  setMetodo(ORDEN_METODOS[(i + direccion + n) % n]);
}

// Flecha arriba/abajo solo cuando el foco sigue en uno de los 4 botones de
// método (ahí no chocan con nada). Izquierda/derecha y Tab se manejan aparte,
// a nivel de todo el modal —ver más abajo—: como setMetodo() salta el foco
// al campo principal apenas se elige un método, el foco casi nunca sigue en
// estos botones, y flechas/Tab que solo escucharan aquí nunca se disparaban.
function navegarMetodoBoton(e){
  if(e.key === 'ArrowDown'){ e.preventDefault(); irAMetodo(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); irAMetodo(-1); }
}

// Izquierda/derecha cambian el método desde cualquier parte del modal de
// cobro, sin importar qué campo tenga el foco en ese momento —a diferencia
// de arriba/abajo, no chocan con nada al escribir un número o una
// referencia corta—. Tab solo se atrapa si el foco sigue en uno de los 4
// botones, para no romper el Tab normal del resto del formulario.
document.getElementById('cobro-modal').addEventListener('keydown', function(e){
  if(e.target.id === 'c-cliente-buscar'){
    // Ahí sí hace falta mover el cursor dentro del texto para corregir un
    // nombre, así que la flecha solo cambia de método cuando el cursor ya
    // está en el borde de ese lado (o el campo está vacío, como queda
    // recién enfocado al elegir "Crédito") —si no, quedaba atorado ahí sin
    // poder llegar nunca a Transferencia—.
    const cursor = e.target.selectionStart;
    const largo = e.target.value.length;
    if(e.key === 'ArrowLeft' && cursor > 0) return;
    if(e.key === 'ArrowRight' && cursor < largo) return;
  }
  if(e.key === 'ArrowRight'){ e.preventDefault(); irAMetodo(1); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); irAMetodo(-1); }
  else if(e.key === 'Tab' && e.target.classList && e.target.classList.contains('metodo-btn')){
    e.preventDefault();
    irAMetodo(e.shiftKey ? -1 : 1);
  }
});

function setMetodo(m){
  metodoPago = m;
  document.getElementById('btn-efectivo').classList.toggle('activo', m==='efectivo');
  document.getElementById('btn-tarjeta').classList.toggle('activo', m==='tarjeta');
  document.getElementById('btn-credito').classList.toggle('activo', m==='credito');
  document.getElementById('btn-transferencia').classList.toggle('activo', m==='transferencia');
  document.getElementById('sec-efectivo').style.display = m==='efectivo'?'block':'none';
  document.getElementById('sec-tarjeta').style.display = m==='tarjeta'?'block':'none';
  document.getElementById('sec-credito').style.display = m==='credito'?'block':'none';
  document.getElementById('sec-transferencia').style.display = m==='transferencia'?'block':'none';
  document.getElementById('cobro-msg').className='msg';
  // Salta el cursor directo al campo principal de cada método —pensado para
  // cobrar con mouse + teclado en escritorio sin soltar el teclado para
  // hacer clic: se escribe el dato y se da Enter (ver confirmarConEnter) en
  // vez de tener que ir a buscar el campo primero. En tarjeta empieza en
  // Terminal, el primero de la fila (Referencia y Autorización van después,
  // uno por uno, con Enter —ver siguienteCampo—).
  const campoPrincipal = {
    efectivo: 'c-pago', tarjeta: 'c-tpv-term',
    transferencia: 'c-transf-ref', credito: 'c-cliente-buscar',
  }[m];
  if(campoPrincipal) document.getElementById(campoPrincipal).focus();
}

// Tarjeta tiene tres campos en fila (Terminal, Referencia, Autorización):
// Enter en los dos primeros solo avanza al siguiente, para que se puedan
// llenar uno tras otro sin tocar el mouse. Solo el último (Autorización)
// termina la venta al dar Enter —ver confirmarConEnter—.
function siguienteCampo(e, siguienteId){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  document.getElementById(siguienteId).focus();
}

// Enter en el campo final de efectivo/tarjeta/transferencia termina la
// venta directo, sin soltar el teclado para hacer clic en "Confirmar venta".
// En tarjeta, si no se alcanzó a llenar referencia o autorización (o se
// dejaron vacías a propósito), se completan con "N/A" en vez de bloquear la
// venta —se puede corregir después desde el historial si hace falta el
// dato real de la terminal—.
function confirmarConEnter(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  if(metodoPago === 'tarjeta'){
    const ref = document.getElementById('c-tpv-ref');
    const aut = document.getElementById('c-tpv-aut');
    if(!ref.value.trim()) ref.value = 'N/A';
    if(!aut.value.trim()) aut.value = 'N/A';
  }
  confirmarCobro();
}

let clienteSeleccionado = null;

async function buscarClienteCredito(){

function seleccionarCliente(id, nombre, saldo){

// Al elegir (o quitar) un cliente con precio de mayoreo hay que recalcular lo
// que ya está en el carrito: si no, la venta se cobraría a precio de
// mostrador solo por el orden en que se capturó.
async function aplicarPreciosCliente(clienteId){
  if(!sesionPOS || !sesionPOS.usa_niveles_precio) return;
  const ids = carrito.filter(l => !l.personalizado && l.id > 0).map(l => l.id);
  try{
    const r = await authFetch('/api/pos/precios-cliente', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({cliente_id: clienteId || null, producto_ids: ids})
    });
    if(!r.ok) return;
    const d = await r.json();
    let cambiadas = 0;
    carrito.forEach(function(l){
      const nuevo = d.precios[String(l.id)];
      if(nuevo != null && Math.abs(nuevo - l.precio) > 0.005){ l.precio = nuevo; cambiadas++; }
    });
    const aviso = document.getElementById('c-aviso-nivel');
    if(aviso){
      aviso.textContent = d.nivel_precio
        ? 'Precio ' + d.nivel_precio + ' aplicado' + (cambiadas ? ' a ' + cambiadas + ' artículo(s)' : '')
        : (cambiadas ? 'Precios de mostrador restaurados' : '');
      aviso.style.display = aviso.textContent ? 'block' : 'none';
    }
    if(cambiadas){ renderCarrito(); actualizarTotales(); if(document.getElementById('cobro-modal').classList.contains('open')) renderResumenCobro(); }
  }catch(e){}
}

function mostrarNuevoCliente(){

  document.getElementById('c-nuevo-nombre').focus();
}

// El teléfono se captura y se manda en 10 dígitos pelados; normalizar_telefono()
// en main.py valida lo mismo del lado del servidor.
function limitarTelPOS(input){ input.value = (input.value||'').replace(/\D/g,'').slice(0,10); }

async function crearClienteRapido(){
  const nombre = document.getElementById('c-nuevo-nombre').value.trim();
  if(!nombre){ alert('Escribe el nombre del cliente'); return; }
  const digitosTel = (document.getElementById('c-nuevo-telefono').value||'').replace(/\D/g,'').slice(0,10);
  if(digitosTel && digitosTel.length !== 10){ alert('El teléfono debe tener 10 dígitos (escribiste '+digitosTel.length+')'); return; }
  if(digitosTel && (digitosTel[0]==='0' || digitosTel[0]==='1')){ alert('El teléfono no puede empezar con 0 ni con 1'); return; }
  const telefono = digitosTel || null;
  try{
    const r = await authFetch('/api/clientes', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nombre, telefono})
    });
    const data = await r.json();
    if(!r.ok){ alert(extraerMensajeError(data.detail, 'No se pudo crear el cliente')); return; }
    seleccionarCliente(data.id, data.nombre, 0);
    document.getElementById('c-cliente-nuevo').style.display='none';
    document.getElementById('c-nuevo-nombre').value='';
    document.getElementById('c-nuevo-telefono').value='';
  }catch(e){ alert('Error de conexión'); }
}

function renderResumenCobro(){
  const subtotal=calcSubtotal();
  const total=subtotal*(1-descuentoExtra/100);
  let html='<div class="ticket">';
  carrito.forEach(c=>{
    const cant=c.vendido_por_peso?c.cantidad.toFixed(3)+'kg':c.cantidad+'x';
    html+=`<div class="tk-line"><span>${cant} ${esc(c.nombre)}</span><span>${money(c.precio*c.cantidad)}</span></div>`;
  });

    html+=`<div class="tk-line"><span>Descuento ${descuentoExtra}%</span><span>-${money(subtotal*descuentoExtra/100)}</span></div>`;
  }
  html+=`<div class="tk-line tk-total"><span>TOTAL</span><span>${money(total)}</span></div></div>`;

  document.getElementById('cobro-modal').classList.add('open');

function cerrarCobro(){document.getElementById('cobro-modal').classList.remove('open');}

function calcCambio(){

  const pago=parseFloat(document.getElementById('c-pago').value)||0;

// ─── Agente local del punto de venta (impresora + cajón) ───────────────────
// El ticket se imprime con window.print() (diálogo normal del sistema), que
// nunca manda los comandos ESC/POS de abrir el cajón ni permite saltarse ese
// diálogo — hay que hablarle a la impresora por fuera de ahí. Por eso hace
// falta un agente aparte: un programa chico que corre en la PC donde está
// conectada la impresora por USB, escucha en 127.0.0.1 y traduce estas
// peticiones a los comandos que la impresora entiende. Ver
// ~/inventario/cajon-agente/ para el instalador.
//
// Solo tiene sentido intentarlo en LA PC donde de verdad está ese agente
// instalado y corriendo —el mostrador con el cajón físico—; en cualquier
// otro dispositivo (los iPhone de las demás sucursales, una tablet) nunca va
// a haber nadie escuchando en localhost. Por eso es una bandera local, propia
// de este navegador/dispositivo (localStorage, no la sesión del usuario): se
// activa una sola vez, a mano, desde el botón 🖨️ de esta pantalla, y así el
// resto de sucursales queda exactamente como estaba.
const AGENTE_ACTIVO_KEY = 'agente_pos_local';
const AGENTE_BASE_URL = 'http://127.0.0.1:8788';

function agenteLocalActivo(){
  return localStorage.getItem(AGENTE_ACTIVO_KEY) === '1';
}

function actualizarBotonAgenteLocal(){
  const btn = document.getElementById('btn-agente-local');
  if(!btn) return;
  const activo = agenteLocalActivo();
  btn.style.color = activo ? 'var(--blue)' : '';
  btn.style.borderColor = activo ? 'var(--blue)' : '';
  btn.title = activo
    ? 'Impresora y cajón activos en esta computadora (toca para desactivar)'
    : 'Impresora y cajón en esta computadora (toca para activar)';
}

async function configurarAgenteLocal(){
  if(agenteLocalActivo()){
    const ok = await confirmarPersonalizado(
      'Esta computadora dejará de intentar abrir el cajón y de imprimir directo: volverá al diálogo de impresión de siempre.',
      '¿Desactivar la impresora y el cajón aquí?'
    );
    if(ok){ localStorage.removeItem(AGENTE_ACTIVO_KEY); actualizarBotonAgenteLocal(); }
    return;
  }
  const ok = await confirmarPersonalizado(
    'Actívalo solo en la computadora donde ya instalaste el agente de ~/inventario/cajon-agente/ '
    + '(el que habla con la impresora Xprinter y el cajón EC-CD-50M). '
    + 'Desde ese momento, cada venta intentará abrir el cajón e imprimir el ticket sola, sin el diálogo de Windows.',
    '¿Activar la impresora y el cajón aquí?'
  );
  if(ok){ localStorage.setItem(AGENTE_ACTIVO_KEY, '1'); actualizarBotonAgenteLocal(); }
}

// Es "best effort" a propósito: si el agente no responde a tiempo (se
// reinició la PC y todavía no arranca, se cerró sin querer, etc.) no debe
// interrumpir ni avisar del cobro.
function abrirCajonDinero(){
  if(!agenteLocalActivo()) return;
  const controlador = new AbortController();
  setTimeout(() => controlador.abort(), 1500);
  fetch(AGENTE_BASE_URL + '/abrir-cajon', {method:'POST', signal: controlador.signal}).catch(()=>{});
}

// Nombre a mostrar como encabezado del ticket impreso directo (es solo texto,
// a diferencia del ticket en pantalla que sí lleva el logo de la tienda).
// Mismo criterio que logosActivos(): la tienda de la sesión, o "Vilnix" si no
// hay una sola.
function nombreTiendaParaTicket(){
  const s = getSesion();
  const tiendas = (s && s.tienda) || [];
  return tiendas.length ? tiendas.join(' + ') : 'Vilnix';
}

// Si esta PC tiene el agente activado, le pide que imprima el ticket directo
// a la impresora (como texto ESC/POS, más rápido y confiable que la versión
// de imagen que se intentó antes). Si no responde a tiempo, cae solo al
// diálogo de impresión de siempre —la "recaída automática"—, así nunca se
// pierde el ticket aunque el agente se haya caído ese día. En cualquier
// dispositivo sin la bandera activada (todas las demás sucursales) no se
// toca nada: se queda igual que siempre, con el botón manual del modal.
async function intentarImpresionDirecta(v){
  if(!agenteLocalActivo()) return;
  const payload = Object.assign({}, v, {encabezado: nombreTiendaParaTicket()});
  const controlador = new AbortController();
  const vencido = setTimeout(() => controlador.abort(), 2500);
  try{
    const r = await fetch(AGENTE_BASE_URL + '/imprimir-ticket', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload), signal: controlador.signal
    });
    if(!r.ok) throw new Error('el agente respondió con error');
  }catch(e){
    imprimirTicket();
  }finally{
    clearTimeout(vencido);
  }
}

// Va aquí y no arriba junto a requireAuth(): usa AGENTE_ACTIVO_KEY, declarada
// unas líneas arriba en este mismo bloque, y en JS un const/let no se puede
// leer antes de que su propia línea se ejecute.
actualizarBotonAgenteLocal();

async function confirmarCobro(){
  // Guarda contra doble venta: si el botón ya está deshabilitado es que un
  // toque anterior sigue en curso (doble tap, o red lenta y el cajero toca
  // de nuevo creyendo que no se registró). Sin esto, cada toque de más
  // registraba una venta idéntica completa —pasó de verdad en Jardincito:
  // un artículo personalizado se cobró 3 veces en milisegundos por esto—.
  const btn=document.getElementById('btn-confirmar-cobro');
  if(btn.disabled) return;
  btn.disabled=true;
  try{
    const msg=document.getElementById('cobro-msg');
    const subtotal=calcSubtotal();
    const total=subtotal*(1-descuentoExtra/100);
    const items=carrito.map(c=>({
      producto_id: c.personalizado ? null : c.id,
      nombre: c.personalizado ? c.nombre : null,
      cantidad: c.cantidad,
      precio_unitario: c.precio,
      precio_original: c.precioOriginal||null,
    }));
    let body={items,descuento_extra_pct:descuentoExtra,autorizado_por:autorizadoPor,metodo_pago:metodoPago};

    if(metodoPago==='efectivo'){
      const pagoRaw=document.getElementById('c-pago').value.trim();
      if(pagoRaw===''){
        body.pago_con=total;
      }else{
        const pago=parseFloat(pagoRaw);
        if(isNaN(pago)||pago<0){msg.className='msg error show';msg.textContent='Monto de pago inválido';return;}
        if(pago<total){msg.className='msg error show';msg.textContent=`El pago (${money(pago)}) es menor al total (${money(total)})`;return;}
        body.pago_con=pago;
      }
    }else if(metodoPago==='tarjeta'){
      // Tarjeta: pedir datos del ticket de la TPV
      const ref=document.getElementById('c-tpv-ref').value.trim();
      const aut=document.getElementById('c-tpv-aut').value.trim();
      if(!ref||!aut){
        msg.className='msg error show';msg.textContent='Ingresa la referencia y autorización de la TPV';return;
      }
      body.tpv_referencia=ref;
      body.tpv_autorizacion=aut;
      body.tpv_terminal=document.getElementById('c-tpv-term').value.trim()||null;
    }else if(metodoPago==='credito'){
      if(!clienteSeleccionado){
        msg.className='msg error show';msg.textContent='Selecciona o crea un cliente para la venta a crédito';return;
      }
      body.cliente_id=clienteSeleccionado.id;
    }else if(metodoPago==='transferencia'){
      body.transferencia_referencia=document.getElementById('c-transf-ref').value.trim()||null;
    }

    const r=await authFetch('/api/pos/venta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    if(!r.ok){msg.className='msg error show';msg.textContent=extraerMensajeError(data.detail, 'Error al registrar venta');return;}
    cerrarCobro();
    carrito=[];descuentoExtra=0;autorizadoPor=null;
    renderCarrito();
    if(data.metodo_pago==='efectivo') abrirCajonDinero();
    mostrarTicket(data);
    if(cotizacionOrigenId){
      try{
        await authFetch('/api/cotizaciones/'+cotizacionOrigenId+'/marcar-vendida', {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({venta_id:data.id})
        });
      }catch(e){}
      cotizacionOrigenId = null;
    }
  }catch(e){
    document.getElementById('cobro-msg').className='msg error show';
    document.getElementById('cobro-msg').textContent='Error de conexión';
  }finally{
    btn.disabled=false;
  }
}

async function generarPDFTicketVenta(v){
  const jsPDFCtor = window.jspdf.jsPDF;
  const contenedor = document.createElement('div');
  contenedor.style.position = 'absolute';
  contenedor.style.left = '-9999px';
  contenedor.style.top = '0';
  contenedor.style.width = '300px';
  contenedor.style.background = '#ffffff';
  contenedor.style.padding = '16px';
  contenedor.style.fontFamily = 'monospace';
  contenedor.style.fontSize = '13px';
  contenedor.style.color = '#000000';
  contenedor.innerHTML = generarTicketHTML(v);
  contenedor.querySelectorAll('.tk-sub, .tk-foot, .tk-negocio, .tk-line, .tk-total').forEach(function(el){ el.style.color = '#000000'; });
  contenedor.querySelectorAll('.tk-desc').forEach(function(el){ el.style.color = '#a32d2d'; });
  contenedor.querySelectorAll('.tk-ahorro').forEach(function(el){ el.style.color = '#3b6d11'; });
  document.body.appendChild(contenedor);

  try{
    await new Promise(function(r){ setTimeout(r, 80); });
    const canvas = await html2canvas(contenedor, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const pdfWidth = 320;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    const doc = new jsPDFCtor({unit:'pt', format:[pdfWidth, pdfHeight], orientation:'portrait'});
    doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    return doc.output('blob');
  } finally {
    document.body.removeChild(contenedor);
  }
}

async function compartirComoPDFVenta(v, nombreArchivo){
  const blob = await generarPDFTicketVenta(v);
  const archivo = new File([blob], nombreArchivo, {type:'application/pdf'});
  const puedeCompartir = navigator.canShare && navigator.canShare({files:[archivo]});
  console.log('[diagnostico compartir]', nombreArchivo, '| canShare:', puedeCompartir, '| tamano:', archivo.size, 'bytes | tipo:', archivo.type);
  if(puedeCompartir){
    try{
      await navigator.share({files:[archivo]});
      return;
    }catch(e){
      console.log('[diagnostico compartir] navigator.share fallo:', e.name, e.message);
      if(e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  alert('Tu navegador no permite compartir directo. Se descargó el PDF: adjúntalo manualmente en WhatsApp.');
}

function generarTicketHTML(v){
  const fecha=new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  const RAYA='<svg width="100%" height="3" style="display:block;margin:6px 0"><line x1="0" y1="1.5" x2="100%" y2="1.5" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/></svg>';
  let html=`<div class="tk-head">
    ${logosTicketHTML(88)}
    ${v.sucursal?`<div class="tk-sub">Sucursal ${esc(v.sucursal)}</div>`:''}
    <div class="tk-sub">Ticket de venta #${v.id}</div>
    <div class="tk-sub">${fecha}</div>
    ${v.operador?`<div class="tk-sub">Operador: ${esc(v.operador)}</div>`:''}
  </div>${RAYA}<div class="tk-items">`;
  (v.detalle||[]).forEach(it=>{
    const cant=Number.isInteger(it.cantidad)?it.cantidad+'x':it.cantidad.toFixed(3)+'kg';
    const tieneDescItem = it.precio_original!=null && it.precio_original>it.precio_unitario;
    if(tieneDescItem){
      const importeOriginal = it.precio_original * it.cantidad;
      const pctItem = Math.round((1-it.precio_unitario/it.precio_original)*100);
      html+=`<div class="tk-line"><span>${cant} ${esc(it.nombre)}</span><span>${money(importeOriginal)}</span></div>`;
      html+=`<div class="tk-line tk-desc"><span>Descuento (${pctItem}%)</span><span>${money(it.importe)}</span></div>`;
    }else{
      html+=`<div class="tk-line"><span>${cant} ${esc(it.nombre)}</span><span>${money(it.importe)}</span></div>`;
    }
  });
  html+='</div>'+RAYA;
  if(v.descuento_extra_pct>0){
    html+=`<div class="tk-line"><span>Subtotal</span><span>${money(v.subtotal)}</span></div>`;
    html+=`<div class="tk-line tk-desc"><span>Descuento ${fmtPct(v.descuento_extra_pct)}%</span><span>${money(-(v.subtotal*v.descuento_extra_pct/100))}</span></div>`;
  }
  const ahorroTk = v.ahorro_total!=null ? v.ahorro_total : 0;
  if(ahorroTk>0.005){
    html+=`<div class="tk-line tk-ahorro"><span>🎉 Ahorraste</span><span>${money(ahorroTk)}</span></div>`;
  }
  html+=`<div class="tk-line tk-total"><span>TOTAL</span><span>${money(v.total)}</span></div>`+RAYA;
  if(v.metodo_pago==='credito'){
    html+=`<div class="tk-line" style="color:var(--amber)"><span>Pago</span><span>A CRÉDITO</span></div>`;
    if(v.cliente_nombre)html+=`<div class="tk-line"><span>Cliente</span><span>${esc(v.cliente_nombre)}</span></div>`;
  }else if(v.metodo_pago==='tarjeta'){
    html+=`<div class="tk-line"><span>Pago</span><span>TARJETA</span></div>`;
    if(v.tpv_terminal)html+=`<div class="tk-line"><span>Terminal</span><span>${esc(v.tpv_terminal)}</span></div>`;
    if(v.tpv_referencia)html+=`<div class="tk-line"><span>Referencia</span><span>${esc(v.tpv_referencia)}</span></div>`;
    if(v.tpv_autorizacion)html+=`<div class="tk-line"><span>Autorización</span><span>${esc(v.tpv_autorizacion)}</span></div>`;
  }else if(v.metodo_pago==='transferencia'){
    html+=`<div class="tk-line"><span>Pago</span><span>TRANSFERENCIA</span></div>`;
    if(v.transferencia_referencia)html+=`<div class="tk-line"><span>Referencia</span><span>${esc(v.transferencia_referencia)}</span></div>`;
  }else{
    html+=`<div class="tk-line"><span>Pago</span><span>EFECTIVO</span></div>`;
    if(v.pago_con!=null){
      html+=`<div class="tk-line"><span>Pagó con</span><span>${money(v.pago_con)}</span></div>`;
      html+=`<div class="tk-line"><span>Cambio</span><span>${money(v.cambio||0)}</span></div>`;
    }
  }
  html+='<div class="tk-foot">¡Gracias por su compra!</div>';
  return html;
}

function ticketTextoPlano(v){
  if(!v)return '';
  const fecha=new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  let txt=`🏪 MI NEGOCIO`;
  if(v.sucursal)txt+=` — Sucursal ${v.sucursal}`;
  txt+=`\n📋 Ticket #${v.id} | ${fecha}`;
  if(v.operador)txt+=`\n👤 ${v.operador}`;
  txt+=`\n─────────────────────\n`;
  (v.detalle||[]).forEach(it=>{
    const cant=Number.isInteger(it.cantidad)?it.cantidad+'x':it.cantidad.toFixed(3)+'kg';
    txt+=`${cant} ${it.nombre} — ${money(it.importe)}\n`;
  });
  txt+=`─────────────────────\n`;
  if(v.descuento_extra_pct>0){
    txt+=`Subtotal: ${money(v.subtotal)}\n`;
    txt+=`Descuento ${fmtPct(v.descuento_extra_pct)}%: -${money(v.subtotal*v.descuento_extra_pct/100)}\n`;
  }
  const ahorroTxt=v.ahorro_total!=null?v.ahorro_total:0;
  if(ahorroTxt>0.005){
    txt+=`🎉 Ahorraste: ${money(ahorroTxt)}\n`;
  }
  txt+=`💰 TOTAL: ${money(v.total)}\n`;
  if(v.metodo_pago==='tarjeta'){
    txt+=`💳 Pago: Tarjeta`;
    if(v.tpv_terminal)txt+=` (${v.tpv_terminal})`;
    txt+=`\n`;
    if(v.tpv_referencia)txt+=`Ref: ${v.tpv_referencia}\n`;
  }else if(v.pago_con){
    txt+=`💵 Pagó: ${money(v.pago_con)} | Cambio: ${money(v.cambio||0)}\n`;
  }
  txt+=`\n¡Gracias por su compra! 🙏`;
  return txt;
}

// ─── Escáner ────────────────────────────────────────────────────────────
let zxingStream=null,scanLoop=null;

async function abrirEscaner(){
  const msg=document.getElementById('scan-msg');
  msg.className='msg';
  document.getElementById('scanner-modal').classList.add('open');
  if(!window.isSecureContext){msg.className='msg error show';msg.textContent='La cámara requiere HTTPS.';return;}
  if(!navigator.mediaDevices){msg.className='msg error show';msg.textContent='Cámara no soportada.';return;}
  let intentos=0;
  while(!window.BarcodeDetectorPolyfill&&intentos<20){await new Promise(r=>setTimeout(r,150));intentos++;}
  if(!window.BarcodeDetectorPolyfill){msg.className='msg error show';msg.textContent='No se cargó el escáner. Recarga la página.';return;}
  const video=document.getElementById('scan-video');
  try{
    zxingStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]},audio:false});
    video.srcObject=zxingStream;
    await video.play();
    msg.className='msg show';msg.textContent=`Cámara activa (${video.videoWidth}x${video.videoHeight})`;
    const detector=new window.BarcodeDetectorPolyfill({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code','itf']});
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    let detectando=false;
    scanLoop=setInterval(async()=>{
      if(detectando||!video.videoWidth)return;
      detectando=true;
      try{
        const vw=video.videoWidth,vh=video.videoHeight;
        const cw=Math.floor(vw*0.7),ch=Math.floor(vh*0.42);
        const cx=Math.floor((vw-cw)/2),cy=Math.floor((vh-ch)/2);
        canvas.width=cw;canvas.height=ch;
        ctx.drawImage(video,cx,cy,cw,ch,0,0,cw,ch);
        const codigos=await detector.detect(canvas);
        if(codigos.length>0){clearInterval(scanLoop);scanLoop=null;onCodigo(codigos[0].rawValue);}
      }catch(err){}
      detectando=false;
    },300);
  }catch(e){msg.className='msg error show';msg.textContent='No se pudo acceder a la cámara: '+(e.message||e.name);}
}

async function cerrarEscaner(){
  document.getElementById('scanner-modal').classList.remove('open');
  if(scanLoop){clearInterval(scanLoop);scanLoop=null;}
  if(zxingStream){zxingStream.getTracks().forEach(t=>t.stop());zxingStream=null;}
  const v=document.getElementById('scan-video');if(v)v.srcObject=null;
}

async function onCodigo(codigo){
  await cerrarEscaner();
  try{
    const r=await authFetch('/api/pos/buscar?q='+encodeURIComponent(codigo));
    const items=await r.json();
    const exacto=items.find(p=>p.codigo_barras===codigo)||items[0];
    if(exacto){agregar(exacto);}
    else{
      document.getElementById('buscar').value=codigo;
      ejecutarBusqueda();
    }
  }catch(e){}
}

async function importarCotizacion(cotId){
  try{
    const r = await authFetch('/api/cotizaciones/'+cotId);
    if(!r.ok){ alert('No se pudo cargar la cotización #'+cotId); return; }
    const cot = await r.json();
    const detalle = cot.detalle || [];

    let agregados = 0;
    const noEncontrados = [];
    for(const it of detalle){
      if(it.producto_id != null){
        try{
          const rp = await authFetch('/api/pos/producto/'+it.producto_id);
          if(!rp.ok){ noEncontrados.push(it.nombre); continue; }
          const p = await rp.json();
          const existente = carrito.find(c=>c.id===p.id && !c.personalizado);
          if(existente){
            existente.cantidad += it.cantidad;
          }else{
            carrito.push({
              id:p.id, nombre:p.nombre, precio:it.precio_unitario, precioOriginal:p.precio_venta,
              cantidad:it.cantidad, vendido_por_peso:p.vendido_por_peso, unidad:p.unidad, stock:p.stock,
              personalizado:false
            });
          }
          agregados++;
        }catch(e){ noEncontrados.push(it.nombre); }
      }else{
        carrito.push({
          id:_customVentaIdCounter--, nombre:it.nombre, precio:it.precio_unitario, precioOriginal:it.precio_unitario,
          cantidad:it.cantidad, vendido_por_peso:false, unidad:'', stock:999999, personalizado:true
        });
        agregados++;
      }
    }
    renderCarrito();

    let msg = 'Cotización #'+cotId+': se importaron '+agregados+' artículo(s).';
    if(noEncontrados.length){
      msg += ' No se encontraron en inventario: ' + noEncontrados.join(', ') + '.';
    }
    alert(msg);
  }catch(e){
    alert('Error al importar la cotización');
  }
}
