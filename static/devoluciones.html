<style>
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:8px;display:none}
.msg.show{display:block}
.msg.error{background:var(--red-bg);color:var(--red)}
.msg.ok{background:var(--green-bg);color:var(--green)}


*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --red:#a32d2d;--red-bg:#fcebeb;--radius:10px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --red:#f09595;--red-bg:#501313
}}
html.tema-oscuro{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --red:#f09595;--red-bg:#501313
}
html.tema-claro{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --red:#a32d2d;--red-bg:#fcebeb;--radius:10px
}
html.tema-oscuro .home-img{filter:invert(1)}
html.tema-claro .home-img{filter:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:0.5px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:84px;justify-content:flex-end}
.btn-inicio{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;text-decoration:none;flex-shrink:0;white-space:nowrap}
.btn-inicio:hover{background:var(--bg)}
.home-img{width:18px;height:18px;object-fit:contain;display:block}
@media(prefers-color-scheme:dark){.home-img{filter:invert(1)}}
.container{max-width:760px;margin:0 auto;padding:1.25rem}
button{height:40px;padding:0 16px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600}
button:hover{background:var(--bg)}
button.primary{background:var(--text);color:var(--bg2);border-color:var(--text)}
button.primary:hover{opacity:.85;background:var(--text)}
.btn-csv{background:transparent;color:var(--text);border-color:var(--border)}
.lista{display:flex;flex-direction:column;gap:8px}
.venta{background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:.875rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.venta:active{background:var(--bg)}
.v-id{font-weight:600;font-size:14px}
.v-fecha{font-size:12px;color:var(--text2)}
.v-items{font-size:12px;color:var(--text2)}
.v-total{font-size:18px;font-weight:700;color:var(--green);white-space:nowrap}
.v-desc{font-size:11px;color:var(--red)}
.empty{text-align:center;padding:3rem;color:var(--text2)}
.op-row{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1rem;border-bottom:0.5px solid var(--border)}
.op-row:last-child{border-bottom:none}
.op-nombre{font-weight:600;font-size:14px}
.op-ventas{font-size:12px;color:var(--text2)}
.op-total{font-size:18px;font-weight:700;color:var(--green)}
/* Modal detalle */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:1.5rem;width:400px;max-width:96vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:600;margin-bottom:1rem}
#detalle-contenido{background:var(--bg);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.acciones{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.acciones button{flex:1;min-width:90px;height:44px;border-radius:10px;border:0.5px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer;font-size:13px;justify-content:center}
.acciones button:hover{background:var(--bg)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.modal-footer button{width:auto;min-width:96px;height:42px;padding:0 16px;border-radius:9px;border:0.5px solid var(--border);background:transparent;color:var(--text);font-size:14px;cursor:pointer}
.modal-footer button.primary{background:var(--text);color:var(--bg2);border:none;font-weight:600}
.modal-footer button:hover{background:var(--text);opacity:.85}
@media(max-width:560px){
  .topbar{padding:0 .625rem}.topbar-title{font-size:15px}.topbar-right{min-width:0}
  .container{padding:.875rem}.stat-value{font-size:16px}
}

/* ─── Vista móvil (sin cambios respecto a la versión anterior) ────────── */
.venta-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1rem}
.venta-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:.875rem;padding-bottom:.875rem;border-bottom:0.5px solid var(--border)}
.venta-id{font-size:18px;font-weight:700}
.venta-meta{font-size:12px;color:var(--text2);margin-top:2px}
.item-row{display:flex;align-items:center;gap:10px;padding:.75rem 0;border-bottom:0.5px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-info{flex:1;min-width:0}
.item-nombre{font-size:14px;font-weight:600}
.item-sub{font-size:12px;color:var(--text2);margin-top:2px}
.item-cant{width:78px;height:40px;padding:0 8px;border:0.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;text-align:center}
.item-cant:disabled{opacity:.4}

#vista-escritorio{display:none}
</style>
<style>
.pantalla{display:flex;flex-direction:column;gap:16px}
.col-izq,.col-der{display:flex;flex-direction:column;gap:16px}
.box{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;contain:paint}
.box-header{padding:.875rem 1rem;border-bottom:0.5px solid var(--border);font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.box-header .contador{color:var(--text);font-weight:700}
.box-body{padding:.625rem}
.box-buscar .box-body{padding:1rem}

.buscador{display:flex;gap:8px}
.buscador input{flex:1;height:48px;padding:0 14px;border:0.5px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:16px}
.buscador button{height:48px;padding:0 22px;border:none;border-radius:10px;background:var(--text);color:var(--bg2);font-weight:600;font-size:15px;cursor:pointer}

.ticket-info{padding:.625rem 1rem;background:var(--blue-bg);border-bottom:0.5px solid var(--border);border-left:3px solid var(--blue);font-size:12px;color:var(--blue);font-weight:600;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;flex-shrink:0}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
.badge-activa{background:var(--green-bg);color:var(--green)}
.badge-parcial{background:var(--amber-bg);color:var(--amber)}
.badge-cancelada{background:var(--red-bg);color:var(--red)}
.badge-devuelta{background:var(--red-bg);color:var(--red)}
.badge-devolucion{background:var(--red-bg);color:var(--red)}

/* filas de transacciones recientes */
.tx-row{display:flex;justify-content:space-between;align-items:center;padding:.75rem .875rem;border-radius:10px;cursor:pointer}
.tx-row:hover{background:var(--bg)}
.tx-id{font-weight:700;font-size:14px}
.tx-meta{font-size:12px;color:var(--text2);margin-top:2px}
.tx-total{font-size:16px;font-weight:700;color:var(--green);white-space:nowrap}

/* filas de articulos disponibles para marcar */
.art-row{display:flex;align-items:center;gap:10px;padding:.75rem .875rem;border-radius:10px}
.art-row.agregado{background:var(--blue-bg)}
.art-info{flex:1;min-width:0}
.art-nombre{font-size:14px;font-weight:600}
.art-sub{font-size:12px;color:var(--text2);margin-top:2px}
.btn-agregar{height:36px;padding:0 14px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-agregar:hover{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.btn-agregar:disabled{opacity:.5;cursor:default;background:transparent !important;color:var(--text2) !important;border-color:var(--border) !important}

/* caja "para devolver" */
.sel-row{display:flex;align-items:center;gap:8px;padding:.7rem .875rem;border-radius:10px}
.sel-row:hover{background:var(--bg)}
.sel-info{flex:1;min-width:0}
.sel-nombre{font-size:13px;font-weight:600}
.sel-sub{font-size:11px;color:var(--text2);margin-top:2px}
.sel-cant{width:64px;height:36px;border:0.5px solid var(--border);border-radius:8px;text-align:center;font-size:14px;background:var(--bg);color:var(--text)}
.sel-quitar{width:32px;height:32px;padding:0;border:none;background:transparent;color:var(--red);font-size:18px;line-height:1;cursor:pointer;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sel-quitar:hover{background:var(--red-bg)}

.vacio{text-align:center;padding:2.5rem 1.25rem;color:var(--text2);font-size:13px;line-height:1.6}

.box-resumen{flex-shrink:0}
.resumen{padding:.875rem 1rem}
.total-line{display:flex;justify-content:space-between;margin-bottom:5px;font-size:14px}
.total-line.grande{font-size:17px;font-weight:700;margin-top:8px}
.acciones{display:flex;gap:8px;margin-top:.875rem;flex-wrap:wrap}
.btn-devolver{flex:1;min-width:150px;height:48px;border:none;border-radius:10px;background:var(--amber);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.btn-cancelar-venta{flex:1;min-width:150px;height:48px;border:0.5px solid var(--red);border-radius:10px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:14px;cursor:pointer}
.btn-devolver:disabled,.btn-cancelar-venta:disabled{opacity:.4;cursor:not-allowed}

.hist-dev{margin:.625rem .875rem;padding:.875rem;background:var(--bg);border-radius:10px}
.hist-dev-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.hist-dev-item{font-size:12px;color:var(--text2);margin-bottom:4px}

@media(min-width:1024px){
  .container{max-width:1200px}
  #vista-movil{display:none}
  #vista-escritorio{display:grid;grid-template-columns:1fr 380px;grid-template-rows:minmax(0,1fr);gap:24px;height:calc(100vh - 54px - 2.5rem)}
  .col-izq,.col-der{min-height:0}
  .box.box-lista,.box.box-devolver{flex:1;min-height:0}
  .box-body{flex:1;min-height:0;overflow-y:auto;contain:paint}
}
</style>

.tk-head,.tk-foot{text-align:center;margin:8px 0}

.tk-btn-sec{flex:1 1 0;height:44px;border:0.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center}
.tk-btn-cerrar{width:100%;height:44px;border:0.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center}
.field{margin-bottom:14px}

<div class="topbar">
  <a href="/" class="btn-inicio" title="Inicio"><img src="/static/icon-nav-v2.png" alt="Inicio" class="nav-icon" style="height:32px;width:32px"></a>
  <h1 class="topbar-title">↩️ Devoluciones</h1>

</div>

<div class="container">
  <div class="msg" id="msg-general"></div>

  <!-- Vista móvil: sin cambios respecto a la versión anterior -->
  <div id="vista-movil">
    <div class="buscador" style="margin-bottom:1.25rem">
      <input type="number" id="num-ticket-movil" placeholder="Número de ticket (ej. 95)" inputmode="numeric" onkeydown="if(event.key==='Enter')buscarVentaMovil()">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="/static/auth.js?v=1787605997"></script>
<script>
requireGerente();
requireSucursalOperativa();

function money(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

let ventaActual = null;
let accionPendiente = null;
let seleccion = [];      // artículos marcados para devolver: [{producto_id, nombre, precio_unitario, cantidad, disponible}]
let ultimasCache = null; // últimas transacciones de la sucursal, para la caja izquierda cuando no hay búsqueda

function mostrarMsg(texto, tipo){
  const el = document.getElementById('msg-general');
  el.className = 'msg ' + (tipo||'error') + ' show';
  el.textContent = texto;
}
function limpiarMsg(){ document.getElementById('msg-general').className = 'msg'; }

async function buscarVenta(){
  const id = document.getElementById('num-ticket').value.trim();
  limpiarMsg();
  if(!id){ mostrarMsg('Escribe el número de ticket'); return; }

  try{
    const r = await authFetch('/api/ventas/' + id);
    if(r.status === 404){
      mostrarMsg('No existe una venta con el ticket #' + id);
      ventaActual = null; seleccion = [];
      renderListaIzquierda(); renderSeleccionados();
      return;
    }
    if(!r.ok){ mostrarMsg('No se pudo consultar la venta'); return; }
    ventaActual = await r.json();
    seleccion = [];
    renderListaIzquierda();
    renderSeleccionados();
  }catch(e){ mostrarMsg('Error de conexión'); }
}

function devueltoPorProducto(){
  const mapa = {};
  (ventaActual.devoluciones || []).forEach(function(d){
    mapa[d.producto_id] = (mapa[d.producto_id] || 0) + d.cantidad;
  });
  return mapa;
}

function disponibleDe(it){
  const yaDev = devueltoPorProducto();
  const dev = (it.devuelto != null) ? it.devuelto : (yaDev[it.producto_id] || 0);
  return (it.disponible_devolucion != null) ? it.disponible_devolucion : Math.round((it.cantidad - dev) * 1000) / 1000;
}

function esEscritorio(){ return window.matchMedia('(min-width:1024px)').matches; }

// ─── Vista móvil: idéntica a la versión anterior, no se toca en este cambio ─
async function buscarVentaMovil(){
  const id = document.getElementById('num-ticket-movil').value.trim();
  limpiarMsg();
  document.getElementById('resultado').innerHTML = '';
  ventaActual = null;
  if(!id){ mostrarMsg('Escribe el número de ticket'); return; }

  try{
    const r = await authFetch('/api/ventas/' + id);
    if(r.status === 404){ mostrarMsg('No existe una venta con el ticket #' + id); return; }
    if(!r.ok){ mostrarMsg('No se pudo consultar la venta'); return; }
    ventaActual = await r.json();
    renderVentaMovil();
  }catch(e){ mostrarMsg('Error de conexión'); }
}

function renderVentaMovil(){
  const v = ventaActual;
  const estado = v.estado || 'activa';
  const yaDev = devueltoPorProducto();
  const fecha = new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  const nombresMet = {efectivo:'Efectivo', tarjeta:'Tarjeta', credito:'Crédito', transferencia:'Transferencia'};
  const etiquetasEstado = {activa:'Activa', parcial:'Devolución parcial', devuelta:'Devuelta / Cancelada', cancelada:'Cancelada', devolucion:'Devolución'};

  let html = '<div class="venta-card">';
  html += '<div class="venta-head"><div>'
    + '<div class="venta-id">Ticket #' + v.id + '</div>'
    + '<div class="venta-meta">' + fecha + '</div>'
    + '<div class="venta-meta">' + esc(v.sucursal || '') + (v.operador ? ' · ' + esc(v.operador) : '') + '</div>'
    + '<div class="venta-meta">Pago: ' + (nombresMet[v.metodo_pago] || v.metodo_pago) + '</div>'
    + '</div>'
    + '<span class="badge badge-' + estado + '">' + (etiquetasEstado[estado] || estado) + '</span>'
    + '</div>';

  const cancelada = (estado === 'devuelta' || estado === 'cancelada' || estado === 'devolucion');

  (v.detalle || []).forEach(function(it){
    const dev = (it.devuelto != null) ? it.devuelto : (yaDev[it.producto_id] || 0);
    const disp = (it.disponible_devolucion != null) ? it.disponible_devolucion : Math.round((it.cantidad - dev) * 1000) / 1000;
    html += '<div class="item-row">'
      + '<div class="item-info">'
      + '<div class="item-nombre">' + esc(it.nombre) + '</div>'
      + '<div class="item-sub">' + it.cantidad + ' x ' + money(it.precio_unitario)
      + (dev > 0 ? ' · <span style="color:var(--amber)">' + dev + ' devuelto(s)</span>' : '')
      + '</div></div>'
      + '<input type="number" class="item-cant" id="dev-' + it.producto_id + '" min="0" max="' + disp + '" step="any" placeholder="0"'
      + ' data-disp="' + disp + '" data-nombre="' + esc(it.nombre).replace(/"/g, '&quot;') + '"'
      + ' oninput="validarCantidadMovil(this)"'
      + (disp <= 0 || cancelada ? ' disabled' : '') + '>'
      + '</div>';
  });

  const neto = v.total - (v.total_devuelto || 0);
  html += '<div class="totales">';
  html += '<div class="total-line"><span>Total original</span><span>' + money(v.total) + '</span></div>';
  if(v.total_devuelto > 0){
    html += '<div class="total-line" style="color:var(--red)"><span>Devuelto</span><span>-' + money(v.total_devuelto) + '</span></div>';
  }
  html += '<div class="total-line grande"><span>Neto</span><span>' + money(neto) + '</span></div>';
  html += '</div>';

  html += '<div class="acciones">'
    + '<button class="btn-devolver" onclick="pedirMotivoDevolucionMovil()"' + (cancelada ? ' disabled' : '') + '>Devolver seleccionados</button>'
    + '<button class="btn-cancelar-venta" onclick="pedirMotivoCancelacionMovil()"' + (cancelada ? ' disabled' : '') + '>Cancelar venta completa</button>'
    + '</div>';

  if((v.devoluciones || []).length){
    html += '<div class="hist-dev"><div class="hist-dev-title">Devoluciones registradas</div>';
    v.devoluciones.forEach(function(d){
      const f = new Date(d.fecha).toLocaleString('es-MX').replace(',', '');
      html += '<div class="hist-dev-item">• ' + d.cantidad + ' x ' + esc(d.nombre) + ' — ' + money(d.importe)
        + '<br><span style="opacity:.8">' + f + ' · ' + esc(d.operador || '')
        + (d.motivo ? ' · ' + esc(d.motivo) : '') + '</span></div>';
    });
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('resultado').innerHTML = html;
}

function validarCantidadMovil(el){
  const disp = parseFloat(el.dataset.disp || '0');
  const nombre = el.dataset.nombre || 'este artículo';
  const val = parseFloat(el.value);
  if(isNaN(val)) { limpiarMsg(); return; }
  if(val < 0){ el.value = ''; return; }
  if(val > disp){
    el.value = disp;
    mostrarMsg('Solo puedes devolver ' + disp + ' de "' + nombre + '" (es lo que queda del ticket)');
  }else{
    limpiarMsg();
  }
}

function recolectarItemsMovil(){
  const items = [];
  const yaDev = devueltoPorProducto();
  let excedido = null;
  (ventaActual.detalle || []).forEach(function(it){
    const el = document.getElementById('dev-' + it.producto_id);
    if(!el || el.disabled) return;
    const cant = parseFloat(el.value);
    if(isNaN(cant) || cant <= 0) return;
    const disp = Math.round((it.cantidad - (yaDev[it.producto_id] || 0)) * 1000) / 1000;
    if(cant > disp + 0.0001){
      excedido = {nombre: it.nombre, disp: disp, pedido: cant};
      return;
    }
    items.push({producto_id: it.producto_id, cantidad: cant});
  });
  if(excedido){
    mostrarMsg('No puedes devolver ' + excedido.pedido + ' de "' + excedido.nombre
      + '": solo quedan ' + excedido.disp + ' por devolver');
    return null;
  }
  return items;
}

function pedirMotivoDevolucionMovil(){
  limpiarMsg();
  const items = recolectarItemsMovil();
  if(items === null) return;
  if(!items.length){ mostrarMsg('Escribe la cantidad a devolver en al menos un artículo'); return; }
  const total = items.reduce(function(s, i){
    const linea = ventaActual.detalle.find(function(x){ return x.producto_id === i.producto_id; });
    return s + (linea ? linea.precio_unitario * i.cantidad : 0);
  }, 0);
  accionPendiente = {tipo: 'devolucion', items: items};
  abrirMotivo('Devolver artículos',
    items.length + ' artículo(s) · Se reembolsarán ' + money(total));
}

function pedirMotivoCancelacionMovil(){
  limpiarMsg();
  const neto = ventaActual.total - (ventaActual.total_devuelto || 0);
  accionPendiente = {tipo: 'cancelacion'};
  abrirMotivo('Cancelar venta completa',
    'Se devolverá todo lo pendiente del ticket #' + ventaActual.id + ' · ' + money(neto));
}

// ─── Caja izquierda: últimas transacciones, o artículos del ticket buscado ──
async function cargarUltimasTransacciones(){
  try{
    const r = await authFetch('/api/ventas?limit=20');
    if(!r.ok) return;
    const data = await r.json();
    // Los registros de devolución/cancelación son ventas propias con venta_origen_id
    // apuntando al ticket original; no son transacciones nuevas, así que no se listan aquí.
    ultimasCache = data.filter(function(v){ return !v.venta_origen_id; }).slice(0, 15);
    if(!ventaActual) renderListaIzquierda();
  }catch(e){}
}

function renderListaIzquierda(){
  if(!ventaActual){ renderUltimasTransacciones(); return; }
  renderArticulosTicket();
}

function renderUltimasTransacciones(){
  document.getElementById('lista-titulo').textContent = 'Últimas transacciones';
  document.getElementById('lista-ticket-info').innerHTML = '';
  const cont = document.getElementById('lista-contenido');
  if(!ultimasCache) { cont.innerHTML = '<div class="vacio">Cargando…</div>'; return; }
  if(!ultimasCache.length){ cont.innerHTML = '<div class="vacio">Sin transacciones recientes</div>'; return; }
  cont.innerHTML = ultimasCache.map(function(v){
    const fecha = new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
    return '<div class="tx-row" onclick="clicTransaccion(' + v.id + ')">'
      + '<div><div class="tx-id">Ticket #' + v.id + '</div><div class="tx-meta">' + esc(v.operador || '') + ' · ' + fecha + '</div></div>'
      + '<div class="tx-total">' + money(v.total) + '</div>'
      + '</div>';
  }).join('');
}

function clicTransaccion(id){
  document.getElementById('num-ticket').value = id;
  buscarVenta();
}

function renderArticulosTicket(){
  const v = ventaActual;
  const estado = v.estado || 'activa';
  const fecha = new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  const nombresMet = {efectivo:'Efectivo', tarjeta:'Tarjeta', credito:'Crédito', transferencia:'Transferencia'};
  const etiquetasEstado = {activa:'Activa', parcial:'Devolución parcial', devuelta:'Devuelta / Cancelada', cancelada:'Cancelada', devolucion:'Devolución'};
  const cancelada = (estado === 'devuelta' || estado === 'cancelada' || estado === 'devolucion');

  document.getElementById('lista-titulo').textContent = 'Artículos del ticket #' + v.id;
  document.getElementById('lista-ticket-info').innerHTML =
    '<div class="ticket-info"><span>' + esc(v.sucursal || '') + (v.operador ? ' · ' + esc(v.operador) : '') + ' · ' + fecha
    + ' · Pago: ' + (nombresMet[v.metodo_pago] || v.metodo_pago) + '</span>'
    + '<span class="badge badge-' + estado + '">' + (etiquetasEstado[estado] || estado) + '</span></div>';

  let html = '';
  (v.detalle || []).forEach(function(it){
    const yaDev = devueltoPorProducto();
    const dev = (it.devuelto != null) ? it.devuelto : (yaDev[it.producto_id] || 0);
    const disp = disponibleDe(it);
    const enLista = seleccion.some(function(s){ return s.producto_id === it.producto_id; });
    html += '<div class="art-row' + (enLista ? ' agregado' : '') + '">'
      + '<div class="art-info">'
      + '<div class="art-nombre">' + esc(it.nombre) + '</div>'
      + '<div class="art-sub">' + it.cantidad + ' x ' + money(it.precio_unitario)
      + (dev > 0 ? ' · <span style="color:var(--amber)">' + dev + ' devuelto(s)</span>' : '')
      + (enLista ? ' · en la lista →' : '')
      + '</div></div>'
      + '<button class="btn-agregar" onclick="agregarArticulo(' + it.producto_id + ')"'
      + (disp <= 0 || cancelada || enLista ? ' disabled' : '') + '>'
      + (enLista ? 'Agregada' : '+ Agregar') + '</button>'
      + '</div>';
  });

  if((v.devoluciones || []).length){
    html += '<div class="hist-dev"><div class="hist-dev-title">Devoluciones registradas</div>';
    v.devoluciones.forEach(function(d){
      const f = new Date(d.fecha).toLocaleString('es-MX').replace(',', '');
      html += '<div class="hist-dev-item">• ' + d.cantidad + ' x ' + esc(d.nombre) + ' — ' + money(d.importe)
        + '<br><span style="opacity:.8">' + f + ' · ' + esc(d.operador || '')
        + (d.motivo ? ' · ' + esc(d.motivo) : '') + '</span></div>';
    });
    html += '</div>';
  }

  document.getElementById('lista-contenido').innerHTML = html || '<div class="vacio">Este ticket no tiene artículos</div>';
}

// ─── Caja derecha: artículos marcados para devolver ─────────────────────
function agregarArticulo(productoId){
  if(!ventaActual) return;
  const it = (ventaActual.detalle || []).find(function(x){ return x.producto_id === productoId; });
  if(!it) return;
  const disp = disponibleDe(it);
  if(disp <= 0) return;
  if(seleccion.some(function(s){ return s.producto_id === productoId; })) return;
  seleccion.push({producto_id: productoId, nombre: it.nombre, precio_unitario: it.precio_unitario, cantidad: disp, disponible: disp});
  renderArticulosTicket();
  renderSeleccionados();
}

function quitarSeleccion(productoId){
  seleccion = seleccion.filter(function(s){ return s.producto_id !== productoId; });
  renderArticulosTicket();
  renderSeleccionados();
}

function cambiarCantidadSeleccion(productoId, valorStr){
  const item = seleccion.find(function(s){ return s.producto_id === productoId; });
  if(!item) return;
  limpiarMsg();
  let val = parseFloat(valorStr);
  if(isNaN(val) || val < 0) val = 0;
  if(val > item.disponible){
    val = item.disponible;
    mostrarMsg('Solo puedes devolver ' + item.disponible + ' de "' + item.nombre + '"');
  }
  item.cantidad = val;
  renderResumenSeleccion();
}

function renderSeleccionados(){
  const cont = document.getElementById('sel-contenido');
  const contador = document.getElementById('sel-contador');
  contador.textContent = seleccion.length ? seleccion.length + (seleccion.length === 1 ? ' artículo' : ' artículos') : '';

  if(!seleccion.length){
    cont.innerHTML = '<div class="vacio">Busca un ticket y marca los artículos<br>que quieras devolver.<br>Aparecerán aquí.</div>';
  }else{
    cont.innerHTML = seleccion.map(function(s){
      return '<div class="sel-row">'
        + '<div class="sel-info"><div class="sel-nombre">' + esc(s.nombre) + '</div><div class="sel-sub">' + money(s.precio_unitario) + ' c/u</div></div>'
        + '<input class="sel-cant" type="number" min="0" max="' + s.disponible + '" step="any" value="' + s.cantidad + '" '
        + 'oninput="cambiarCantidadSeleccion(' + s.producto_id + ', this.value)">'
        + '<button class="sel-quitar" onclick="quitarSeleccion(' + s.producto_id + ')">×</button>'
        + '</div>';
    }).join('');
  }
  renderResumenSeleccion();
}

function renderResumenSeleccion(){
  const caja = document.getElementById('caja-resumen');
  const resumen = document.getElementById('sel-resumen');
  if(!ventaActual){ caja.style.display = 'none'; return; }
  caja.style.display = 'block';
  const estado = ventaActual.estado || 'activa';
  const cancelada = (estado === 'devuelta' || estado === 'cancelada' || estado === 'devolucion');
  const total = seleccion.reduce(function(s, i){ return s + i.precio_unitario * (parseFloat(i.cantidad) || 0); }, 0);

  let html = '<div class="total-line"><span>Total original</span><span>' + money(ventaActual.total) + '</span></div>';
  if(ventaActual.total_devuelto > 0){
    html += '<div class="total-line" style="color:var(--red)"><span>Ya devuelto</span><span>-' + money(ventaActual.total_devuelto) + '</span></div>';
  }
  html += '<div class="total-line grande"><span>A reembolsar ahora</span><span style="color:var(--amber)">' + money(total) + '</span></div>';
  html += '<div class="acciones">'
    + '<button class="btn-devolver" onclick="pedirMotivoDevolucion()"' + (cancelada || !seleccion.length ? ' disabled' : '') + '>Devolver seleccionados</button>'
    + '<button class="btn-cancelar-venta" onclick="pedirMotivoCancelacion()"' + (cancelada ? ' disabled' : '') + '>Cancelar venta completa</button>'
    + '</div>';
  resumen.innerHTML = html;
}

function pedirMotivoDevolucion(){
  limpiarMsg();
  const items = seleccion.filter(function(s){ return parseFloat(s.cantidad) > 0; })
    .map(function(s){ return {producto_id: s.producto_id, cantidad: parseFloat(s.cantidad)}; });
  if(!items.length){ mostrarMsg('Marca al menos un artículo para devolver'); return; }
  const total = seleccion.reduce(function(s, i){ return s + i.precio_unitario * (parseFloat(i.cantidad) || 0); }, 0);
  accionPendiente = {tipo: 'devolucion', items: items};
  abrirMotivo('Devolver artículos',
    items.length + ' artículo(s) · Se reembolsarán ' + money(total));
}

function pedirMotivoCancelacion(){
  limpiarMsg();
  if(!ventaActual) return;
  seleccion = (ventaActual.detalle || []).map(function(it){
    const disp = disponibleDe(it);
    return {producto_id: it.producto_id, nombre: it.nombre, precio_unitario: it.precio_unitario, cantidad: disp, disponible: disp};
  }).filter(function(s){ return s.disponible > 0; });
  renderArticulosTicket();
  renderSeleccionados();

  const neto = ventaActual.total - (ventaActual.total_devuelto || 0);
  accionPendiente = {tipo: 'cancelacion'};
  abrirMotivo('Cancelar venta completa',
    'Se devolverá todo lo pendiente del ticket #' + ventaActual.id + ' · ' + money(neto));
}

function abrirMotivo(titulo, resumen){
  document.getElementById('motivo-titulo').textContent = titulo;
  document.getElementById('motivo-resumen').textContent = resumen;
  document.getElementById('motivo-input').value = '';
  document.getElementById('motivo-msg').className = 'msg';
  document.getElementById('motivo-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('motivo-input').focus(); }, 60);
}
function cerrarMotivo(){
  document.getElementById('motivo-modal').classList.remove('open');
  accionPendiente = null;
}

async function confirmarMotivo(){
  const motivo = document.getElementById('motivo-input').value.trim();
  const msg = document.getElementById('motivo-msg');
  if(!motivo){ msg.className = 'msg error show'; msg.textContent = 'El motivo es obligatorio'; return; }
  if(!accionPendiente){ cerrarMotivo(); return; }

  const esDevolucion = accionPendiente.tipo === 'devolucion';
  const url = '/api/ventas/' + ventaActual.id + (esDevolucion ? '/devolucion' : '/cancelar');
  const cuerpo = esDevolucion ? {items: accionPendiente.items, motivo: motivo} : {motivo: motivo};

  try{
    const r = await authFetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(cuerpo),
    });
    const data = await r.json();
    if(!r.ok){
      msg.className = 'msg error show';
      msg.textContent = extraerMensaje(data.detail, 'No se pudo completar la operación');
      return;
    }
    cerrarMotivo();
    const el = document.getElementById('msg-general');
    el.className = 'msg ok show';
    el.textContent = (esDevolucion ? 'Devolución registrada: ' : 'Venta cancelada: ')
      + money(data.monto_devuelto) + ' · Stock actualizado';
    document.getElementById('num-ticket').value = ventaActual.id;
    document.getElementById('num-ticket-movil').value = ventaActual.id;
    seleccion = [];
    buscarVentaSilencioso();
    if(esEscritorio()) cargarUltimasTransacciones();
    if(data.id_devolucion) tkMostrar(data.id_devolucion, !esDevolucion);
  }catch(e){
    msg.className = 'msg error show';
    msg.textContent = 'Error de conexión';
  }
}

async function buscarVentaSilencioso(){
  try{
    const r = await authFetch('/api/ventas/' + ventaActual.id);
    if(r.ok){
      ventaActual = await r.json();
      renderVentaMovil();
      renderListaIzquierda();
      renderSeleccionados();
    }
  }catch(e){}
}

function extraerMensaje(detail, fallback){
  if(!detail) return fallback;
  if(typeof detail === 'string') return detail;
  if(Array.isArray(detail)){
    return detail.map(function(e){ return (e && e.msg) ? e.msg : JSON.stringify(e); }).join(' — ');
  }
  return fallback;
}

// ─── Ticket de devolucion / cancelacion ─────────────────────────────────
let tkActual = null;
let tkFueCancelacion = false;

precargarLogosActivos();
if(esEscritorio()) cargarUltimasTransacciones();

function fmtPct(p){const n=Math.round((Number(p)||0)*100)/100;return (n%1===0)?String(n):n.toFixed(2).replace(/0$/,'');}

function tkGenerarHTML(v){
  const fecha = new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  const RAYA = '<svg width="100%" height="3" style="display:block;margin:6px 0"><line x1="0" y1="1.5" x2="100%" y2="1.5" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/></svg>';
  const nombresMet = {efectivo:'EFECTIVO', tarjeta:'TARJETA', credito:'A CRÉDITO', transferencia:'TRANSFERENCIA'};

  let html = '<div class="tk-head">'
    + logosTicketHTML(88)
    + '<div class="tk-sub">COMPROBANTE DE DEVOLUCIÓN</div>'
    + (v.sucursal ? '<div class="tk-sub">Sucursal ' + esc(v.sucursal) + '</div>' : '')
    + '<div class="tk-sub">Devolución #' + v.id + '</div>'
    + (v.venta_origen_id ? '<div class="tk-sub">Ticket original #' + v.venta_origen_id + '</div>' : '')
    + '<div class="tk-sub">' + fecha + '</div>'
    + (v.operador ? '<div class="tk-sub">Operador: ' + esc(v.operador) + '</div>' : '')
    + '</div>' + RAYA;

  let subtotalNeto = 0;
  (v.detalle || []).forEach(function(it){
    const cant = Math.abs(it.cantidad);
    const c = Number.isInteger(cant) ? cant + 'x' : cant.toFixed(3) + 'kg';
    const pUnit = it.precio_unitario || 0;
    const pOrig = (it.precio_original != null && it.precio_original > pUnit) ? it.precio_original : pUnit;
    subtotalNeto += pUnit * cant;
    html += '<div class="tk-line"><span>' + c + ' ' + esc(it.nombre) + '</span><span>' + money(pOrig * cant) + '</span></div>';
    if(pOrig > pUnit){
      const pct = Math.round((1 - pUnit / pOrig) * 100);
      html += '<div class="tk-line tk-desc"><span style="padding-left:12px">Descuento (' + pct + '%)</span><span>'
        + money(-((pOrig - pUnit) * cant)) + '</span></div>';
    }
  });
  html += RAYA;

  const pctGen = v.descuento_extra_pct || 0;
  if(pctGen > 0){
    html += '<div class="tk-line"><span>Subtotal devuelto</span><span>' + money(subtotalNeto) + '</span></div>';
    html += '<div class="tk-line tk-desc"><span>Descuento general (' + fmtPct(pctGen) + '%)</span><span>'
      + money(-(subtotalNeto * pctGen / 100)) + '</span></div>';
    html += RAYA;
  }

  html += '<div class="tk-line tk-total"><span>TOTAL DEVUELTO</span><span>' + money(v.total) + '</span></div>';
  html += RAYA;
  html += '<div class="tk-line"><span>Reembolso</span><span>' + (nombresMet[v.metodo_pago] || v.metodo_pago) + '</span></div>';
  if(v.autorizado_por){
    html += '<div class="tk-line"><span>Motivo</span><span>' + esc(v.autorizado_por) + '</span></div>';
  }
  html += '<div class="tk-foot">Conserve este comprobante</div>';
  return html;
}

async function tkMostrar(idDevolucion, esCancelacion){
  try{
    const r = await authFetch('/api/ventas/' + idDevolucion);
    if(!r.ok) return;
    tkActual = await r.json();
    tkFueCancelacion = !!esCancelacion;
    document.getElementById('tk-titulo').textContent = esCancelacion ? 'Comprobante de cancelación' : 'Comprobante de devolución';
    document.getElementById('tk-contenido').innerHTML = tkGenerarHTML(tkActual);
    document.getElementById('tk-modal').classList.add('open');
  }catch(e){}
}

function tkCerrar(){
  document.getElementById('tk-modal').classList.remove('open');
  // Tras cancelar una venta completa no queda nada más que devolver en ese
  // ticket: se regresa al inicio (últimas transacciones) en vez de dejar
  // la venta ya cancelada abierta en pantalla.
  if(tkFueCancelacion){
    tkFueCancelacion = false;
    ventaActual = null;
    seleccion = [];
    document.getElementById('num-ticket').value = '';
    document.getElementById('num-ticket-movil').value = '';
    document.getElementById('resultado').innerHTML = '';
    renderListaIzquierda();
    renderSeleccionados();
  }
}

async function tkGenerarPDF(){
  const jsPDFCtor = window.jspdf.jsPDF;
  const cont = document.createElement('div');
  cont.style.position = 'absolute';
  cont.style.left = '-9999px';
  cont.style.top = '0';
  cont.style.width = '300px';
  cont.style.background = '#ffffff';
  cont.style.padding = '16px 24px';
  cont.style.boxSizing = 'border-box';
  cont.style.fontFamily = 'monospace';
  cont.style.fontSize = '13px';
  cont.style.color = '#000000';
  cont.innerHTML = tkGenerarHTML(tkActual);
  cont.querySelectorAll('.tk-sub, .tk-foot, .tk-line, .tk-total').forEach(function(el){ el.style.color = '#000000'; });
  cont.querySelectorAll('.tk-desc').forEach(function(el){ el.style.color = '#a32d2d'; });
  document.body.appendChild(cont);
  try{
    await new Promise(function(r){ setTimeout(r, 80); });
    const canvas = await html2canvas(cont, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const img = canvas.toDataURL('image/png');
    const w = 320, h = (canvas.height * w) / canvas.width;
    const doc = new jsPDFCtor({unit:'pt', format:[w, h], orientation:'portrait'});
    doc.addImage(img, 'PNG', 0, 0, w, h);
    return doc.output('blob');
  } finally {
    document.body.removeChild(cont);
  }
}

async function tkDescargar(){
  if(!tkActual) return;
  const blob = await tkGenerarPDF();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'devolucion_' + tkActual.id + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}

async function tkCompartirWhatsApp(){
  if(!tkActual) return;
  const blob = await tkGenerarPDF();
  const archivo = new File([blob], 'devolucion_' + tkActual.id + '.pdf', {type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[archivo]})){
    try{ await navigator.share({files:[archivo]}); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'devolucion_' + tkActual.id + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  alert('Tu navegador no permite compartir directo. Se descargó el PDF: adjúntalo manualmente en WhatsApp.');
}

function tkImprimir(){
  if(!tkActual) return;
  const win = window.open('', '_blank');
  const estilos = '<style>@page{size:58mm auto;margin:0}body{font-family:monospace;font-size:11px;width:48mm;margin:0 auto;padding:2mm 0;line-height:1.35;color:#000}img{max-width:42mm;height:auto}.tk-desc,.tk-ahorro,.tk-line span,.tk-total,.tk-sub,.tk-foot{color:#000 !important}.tk-desc,.tk-ahorro{font-weight:bold}'
    + '.tk-head,.tk-foot{text-align:center;margin:8px 0}.tk-sub{font-size:12px;color:#000;text-align:center}'
    + '.tk-line{display:flex;justify-content:space-between;margin-bottom:3px}'
    + '.tk-desc{color:#a32d2d}'
    + '.tk-total{font-weight:700;font-size:16px;margin-top:8px;padding-top:8px}</style>';
  win.document.write('<html><head><title>Comprobante de devolución</title>' + estilos + '</head><body>' + reemplazarLogosPorURL(tkGenerarHTML(tkActual)) + '</body></html>');
  win.document.close();
  setTimeout(function(){ win.print(); }, 300);
}
</script>

<!-- Modal del ticket de devolucion -->
<div class="overlay" id="tk-modal">
  <div class="modal">
    <h2 id="tk-titulo">Comprobante</h2>
    <div id="tk-contenido"></div>
    <div class="tk-botones">
      <button class="tk-btn-wa" onclick="tkCompartirWhatsApp()">Compartir por WhatsApp</button>
      <div class="fila">
        <button class="tk-btn-sec" onclick="tkDescargar()">Descargar</button>
        <button class="tk-btn-sec" onclick="tkImprimir()">Imprimir</button>
      </div>
      <button class="tk-btn-cerrar" onclick="tkCerrar()">Cerrar</button>
    </div>
  </div>
</div>
</body>
</html>
