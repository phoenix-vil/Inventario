<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a1a18">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/static/icon-nav-v2.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="/static/icon-nav-blanco.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/touch-icon-v3-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial · Only Enterprises</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--green:#3b6d11;--green-bg:#eaf3de;
  --red:#a32d2d;--red-bg:#fcebeb;--radius:10px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--green:#97c459;--green-bg:#173404;
  --red:#f09595;--red-bg:#501313
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:0.5px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:84px;justify-content:flex-end}
.btn-inicio{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;text-decoration:none;flex-shrink:0;white-space:nowrap}
.btn-inicio:hover{background:var(--bg)}
.home-img{width:18px;height:18px;object-fit:contain;display:block}
@media(prefers-color-scheme:dark){.home-img{filter:invert(1)}}
.container{max-width:760px;margin:0 auto;padding:1.25rem}
.filtros{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:flex-end}
.filtro-campo{display:flex;flex-direction:column;gap:4px}
.filtro-campo label{font-size:11px;color:var(--text2)}
.filtros input,.filtros select{height:40px;padding:0 10px;border:0.5px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);font-size:14px;font-family:inherit}
button{height:40px;padding:0 16px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600}
button:hover{background:var(--bg)}
button.primary{background:var(--text);color:var(--bg2);border-color:var(--text)}
button.primary:hover{opacity:.85;background:var(--text)}
.btn-csv{background:transparent;color:var(--text);border-color:var(--border)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:.875rem 1rem}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:3px}
.stat-value{font-size:20px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:8px}
.venta{background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;padding:.875rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.venta:active{background:var(--bg)}
.v-id{font-weight:600;font-size:14px}
.v-fecha{font-size:12px;color:var(--text2)}
.v-items{font-size:12px;color:var(--text2)}
.v-total{font-size:18px;font-weight:700;color:var(--green);white-space:nowrap}
.v-desc{font-size:11px;color:var(--red)}
.empty{text-align:center;padding:3rem;color:var(--text2)}
.op-row{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1rem;border-bottom:0.5px solid var(--border)}
.op-row:last-child{border-bottom:none}
.op-nombre{font-weight:600;font-size:14px}
.op-ventas{font-size:12px;color:var(--text2)}
.op-total{font-size:18px;font-weight:700;color:var(--green)}
/* Modal detalle */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:1.5rem;width:400px;max-width:96vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:600;margin-bottom:1rem}
#detalle-contenido{background:var(--bg);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.tk-head,.tk-foot{text-align:center;margin:8px 0}
.tk-negocio{font-size:18px;font-weight:700}
.tk-sub{font-size:12px;color:var(--text);text-align:center}
.tk-items{padding:8px 0;margin:8px 0}
.tk-line{display:flex;justify-content:space-between;margin-bottom:4px;font-family:ui-monospace,monospace;font-size:13px}
.tk-total{font-weight:700;font-size:16px;margin-top:8px;padding-top:8px}
.tk-desc{color:var(--red)}
.tk-ahorro{color:var(--green);font-weight:600}
.acciones{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.acciones button{flex:1;min-width:90px;height:44px;border-radius:10px;border:0.5px solid var(--border);background:transparent;color:var(--text);font-weight:600;cursor:pointer;font-size:13px;justify-content:center}
.acciones button:hover{background:var(--bg)}
.modal-footer button{width:100%;height:40px;border-radius:8px;background:var(--text);color:var(--bg2);border:none;font-size:14px;cursor:pointer;justify-content:center}
.modal-footer button:hover{background:var(--text);opacity:.85}
@media(max-width:560px){
  .topbar{padding:0 .625rem}.topbar-title{font-size:15px}.topbar-right{min-width:0}
  .container{padding:.875rem}.stat-value{font-size:16px}
}
</style>
<link rel="stylesheet" href="/static/modern.css?v=1786846610">
</head>
<body>

<div class="topbar">
  <a href="/" class="btn-inicio" title="Inicio"><img src="/static/icon-nav-v2.png" alt="Inicio" class="nav-icon" style="height:32px;width:32px"></a>
  <h1 class="topbar-title">📋 Historial de ventas</h1>
  <div class="topbar-right">
    <button class="icon-btn" onclick="reporteDesdeHistorial()" title="Descargar reporte PDF" style="margin-right:6px">📄</button>
    <a href="/pagos" class="btn-inicio" style="min-width:0">💳 Vender</a>
  </div>
</div>

<div class="container">
  <div class="filtros">
    <div class="filtro-campo">
      <label>Desde</label>
      <input type="date" id="f-desde">
    </div>
    <div class="filtro-campo">
      <label>Hasta</label>
      <input type="date" id="f-hasta">
    </div>
    <div class="filtro-campo">
      <label>Operador</label>
      <select id="f-operador"><option value="">Todos</option></select>
    </div>
    <div class="filtro-campo">
      <label>Pago</label>
      <select id="f-metodo">
        <option value="">Todos</option>
        <option value="efectivo">Efectivo</option>
        <option value="tarjeta">Tarjeta</option>
        <option value="credito">Crédito</option>
        <option value="transferencia">Transferencia</option>
      </select>
    </div>
    <!-- Solo para sesiones sin restricción (Only Enterprises); ver
         cargarSucursalesSelect(). -->
    <div class="filtro-campo" id="campo-sucursal" style="display:none">
      <label>Sucursal</label>
      <select id="f-sucursal"><option value="">Todas</option></select>
    </div>
    <button class="primary" onclick="cargar()">Filtrar</button>
    <button class="btn-csv" onclick="descargarCSV()">⬇ CSV</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-label">Ventas</div><div class="stat-value" id="s-num">—</div></div>
    <div class="stat"><div class="stat-label">Total vendido</div><div class="stat-value" id="s-total" style="color:var(--green)">—</div></div>
    <div class="stat"><div class="stat-label">Efectivo</div><div class="stat-value" id="s-efectivo">—</div></div>
    <div class="stat"><div class="stat-label">Tarjeta</div><div class="stat-value" id="s-tarjeta">—</div></div>
    <div class="stat"><div class="stat-label">Ticket promedio</div><div class="stat-value" id="s-prom">—</div></div>
    <div class="stat"><div class="stat-label">💰 Abonos cobrados</div><div class="stat-value" id="s-abonos" style="color:var(--blue)">—</div></div>
  </div>

  <div class="lista" id="lista"></div>

  <div class="section-title" id="op-titulo" style="font-size:13px;font-weight:600;color:var(--text2);margin:1.5rem 0 .75rem;text-transform:uppercase;letter-spacing:.5px;display:none">Ventas por operador</div>
  <div class="card" id="op-desglose" style="display:none"></div>

  <div class="section-title" id="suc-titulo" style="font-size:13px;font-weight:600;color:var(--text2);margin:1.5rem 0 .75rem;text-transform:uppercase;letter-spacing:.5px;display:none">Ventas por sucursal</div>
  <div class="card" id="suc-desglose" style="display:none"></div>

  <!-- Detalle de los abonos cobrados en el periodo. Faltaba: renderAbonos()
       existía desde siempre, pero nunca llegó a ejecutarse porque el endpoint
       de abonos devolvía 422 por un orden de rutas equivocado. -->
  <div class="section-title" id="abonos-titulo" style="font-size:13px;font-weight:600;color:var(--text2);margin:1.5rem 0 .75rem;text-transform:uppercase;letter-spacing:.5px;display:none">💰 Abonos cobrados</div>
  <div class="card" id="abonos-lista" style="display:none"></div>
</div>

<!-- Modal detalle de venta -->
<div class="overlay" id="detalle-modal">
  <div class="modal">
    <h2>Detalle de venta</h2>
    <div id="detalle-contenido"></div>
    <div class="acciones">
      <button onclick="compartirWhatsApp()" style="width:100%;border:none;background:#25d366;color:#fff;font-weight:700;flex-basis:100%">Compartir por WhatsApp</button>
      <button onclick="descargarTicketDetalle()" style="flex:1;color:var(--text2);font-size:13px">Descargar</button>
      <button onclick="imprimirDetalle()" style="flex:1;color:var(--text2);font-size:13px">Imprimir</button>
    </div>
    <div class="modal-footer">
      <button onclick="cerrarDetalle()">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/static/auth.js?v=1786846610"></script>
<script>
requireGerente();
let ventas=[];
let ventaDetalle=null;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function money(n){return '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(p){const n=Math.round((Number(p)||0)*100)/100;return (n%1===0)?String(n):n.toFixed(2).replace(/0$/,'');}

async function cargarOperadores(){
  try{
    const r=await authFetch('/api/ventas-operadores');
    if(!r.ok)return;
    const ops=await r.json();
    const sel=document.getElementById('f-operador');
    sel.innerHTML='<option value="">Todos</option>'+ops.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  }catch(e){}
}

async function cargar(){
  const desdeStr=document.getElementById('f-desde').value;
  const hastaStr=document.getElementById('f-hasta').value;
  const operador=document.getElementById('f-operador').value;
  const metodo=document.getElementById('f-metodo').value;
  const sucursal=document.getElementById('f-sucursal').value;
  const params=new URLSearchParams();
  if(desdeStr){
    const [y,m,d]=desdeStr.split('-').map(Number);
    params.set('desde', new Date(y,m-1,d,0,0,0).toISOString());
  }
  if(hastaStr){
    const [y,m,d]=hastaStr.split('-').map(Number);
    params.set('hasta', new Date(y,m-1,d,23,59,59,999).toISOString());
  }
  if(operador)params.set('operador',operador);
  if(metodo)params.set('metodo_pago',metodo);
  if(sucursal)params.set('sucursal',sucursal);
  try{
    const [rv,rs,ra]=await Promise.all([
      authFetch('/api/ventas?'+params.toString()),
      authFetch('/api/ventas/resumen?'+params.toString()),
      authFetch('/api/clientes/abonos-periodo?'+params.toString())
    ]);
    ventas=await rv.json();
    // La lista de ventas primero: es lo principal de la pantalla, y así un
    // fallo en cualquiera de los desgloses de abajo no la deja en blanco.
    render();
    const resumen=await rs.json();
    document.getElementById('s-num').textContent=resumen.num_ventas;
    document.getElementById('s-total').textContent=money(resumen.total_vendido);
    document.getElementById('s-efectivo').textContent=money(resumen.total_efectivo||0);
    document.getElementById('s-tarjeta').textContent=money(resumen.total_tarjeta||0);
    document.getElementById('s-prom').textContent=money(resumen.ticket_promedio);
    renderDesglose(resumen.por_operador||[]);
    renderDesgloseSucursal(resumen.por_sucursal||[]);
    if(ra.ok){
      const abonosData=await ra.json();
      document.getElementById('s-abonos').textContent=money(abonosData.total||0);
      renderAbonos(abonosData.abonos||[]);
    }
  }catch(e){console.error(e);}
}

function renderAbonos(lista){
  const titulo=document.getElementById('abonos-titulo');
  const cont=document.getElementById('abonos-lista');
  if(!titulo||!cont)return;
  if(!lista.length){titulo.style.display='none';cont.style.display='none';return;}
  titulo.style.display='block';
  cont.style.display='block';
  cont.innerHTML=lista.map(a=>{
    const fecha=new Date(a.fecha).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-row" style="display:flex;justify-content:space-between;padding:.75rem 1rem;border-bottom:0.5px solid var(--border)">
      <span>👤 ${esc(a.cliente_nombre)}${a.nota?' · '+esc(a.nota):''}<div style="font-size:11px;color:var(--text2)">${fecha} · ${esc(a.operador||'')}${a.sucursal?' · Suc. '+esc(a.sucursal):''}</div></span>
      <span style="color:var(--blue);font-weight:600">+${money(a.monto)}</span>
    </div>`;
  }).join('');
}

function renderDesglose(lista){
  const titulo=document.getElementById('op-titulo');
  const cont=document.getElementById('op-desglose');
  if(!lista.length){titulo.style.display='none';cont.style.display='none';return;}
  titulo.style.display='block';
  cont.style.display='block';
  cont.innerHTML=lista.map(o=>`
    <div class="op-row">
      <div>
        <div class="op-nombre">👤 ${esc(o.operador)}</div>
        <div class="op-ventas">${o.num_ventas} venta${o.num_ventas!==1?'s':''} · 💵 ${money(o.efectivo||0)} · 💳 ${money(o.tarjeta||0)}</div>
      </div>
      <div class="op-total">${money(o.total)}</div>
    </div>`).join('');
}

function renderDesgloseSucursal(lista){
  const titulo=document.getElementById('suc-titulo');
  const cont=document.getElementById('suc-desglose');
  // Con una sesión de sucursal el desglose sería siempre una sola fila con su
  // propia sucursal, repitiendo lo que ya dicen las tarjetas de arriba.
  if(!lista.length || !sesionVeTodo()){titulo.style.display='none';cont.style.display='none';return;}
  titulo.style.display='block';
  cont.style.display='block';
  cont.innerHTML=lista.map(s=>`
    <div class="op-row">
      <div>
        <div class="op-nombre">🏪 Sucursal ${esc(s.sucursal)}</div>
        <div class="op-ventas">${s.num_ventas} venta${s.num_ventas!==1?'s':''} · ${s.items_vendidos} ítems vendidos</div>
      </div>
      <div class="op-total">${money(s.total)}</div>
    </div>`).join('');
}

// El filtro de sucursal solo existe para quien ve el negocio completo (Only
// Enterprises). Una sesión de sucursal solo recibe del backend sus propios
// movimientos, así que ofrecerle elegir otra sucursal solo serviría para que
// la pantalla se quedara vacía sin explicación.
async function cargarSucursalesSelect(){
  if(!sesionVeTodo()) return;
  try{
    const r=await fetch('/api/sucursales');
    const sucursales=await r.json();
    const sel=document.getElementById('f-sucursal');
    sel.innerHTML='<option value="">Todas</option>'+sucursales.map(s=>`<option value="${esc(s.nombre)}">${esc(s.nombre)}</option>`).join('');
    document.getElementById('campo-sucursal').style.display='';
  }catch(e){}
}

function render(){
  const cont=document.getElementById('lista');
  if(!ventas.length){cont.innerHTML='<div class="empty">No hay movimientos en este periodo</div>';return;}
  cont.innerHTML=ventas.map(v=>{
    const fecha=new Date(v.fecha).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
    const desc=v.descuento_extra_pct>0?`<div class="v-desc">desc ${fmtPct(v.descuento_extra_pct)}%</div>`:'';
    const op=v.operador?`<div class="v-items">Operador: ${esc(v.operador)}${v.sucursal?' · Suc. '+esc(v.sucursal):''}</div>`:'';
    const etiquetasMet={tarjeta:'💳 Tarjeta',credito:'📒 Crédito',transferencia:'🏦 Transferencia',efectivo:'💵 Efectivo'};
    const met=etiquetasMet[v.metodo_pago]||'💵 Efectivo';
    const esDev = (v.estado==='devolucion') || (v.total<0);
    const titulo = esDev
      ? `<div class="v-id" style="color:var(--red)">↩️ Devolución #${v.id}</div>`
        + (v.venta_origen_id?`<div class="v-items">del ticket #${v.venta_origen_id}</div>`:'')
      : `<div class="v-id">Venta #${v.id}</div>`;
    const badgeEstado = (!esDev && (v.estado==='parcial'||v.estado==='devuelta'))
      ? `<div class="v-items" style="color:var(--amber)">${v.estado==='devuelta'?'Devuelta por completo':'Con devolución parcial'}</div>`
      : '';
    return `<div class="venta" onclick="verDetalle(${v.id})">
      <div>
        ${titulo}
        <div class="v-fecha">${fecha} · ${met}</div>
        <div class="v-items">${v.num_items} artículo${v.num_items!==1?'s':''}</div>
        ${badgeEstado}
        ${op}
      </div>
      <div style="text-align:right">
        <div class="v-total" style="${v.total<0?'color:var(--red)':''}">${money(v.total)}</div>
        ${desc}
      </div>
    </div>`;
  }).join('');
}

async function verDetalle(id){
  try{
    const r=await authFetch('/api/ventas/'+id);
    ventaDetalle=await r.json();
    const _esDev = ventaDetalle && ((ventaDetalle.estado === 'devolucion') || (ventaDetalle.total < 0));
  const _tit = document.querySelector('#detalle-modal h2');
  if(_tit) _tit.textContent = _esDev ? 'Detalle de devolución' : 'Detalle de venta';
  document.getElementById('detalle-contenido').innerHTML=ticketHTML(ventaDetalle);
    document.getElementById('detalle-modal').classList.add('open');
  }catch(e){}
}
function cerrarDetalle(){document.getElementById('detalle-modal').classList.remove('open');}

precargarLogosActivos();

async function generarPDFTicketVenta(v){
  const jsPDFCtor = window.jspdf.jsPDF;
  const contenedor = document.createElement('div');
  contenedor.style.position = 'absolute';
  contenedor.style.left = '-9999px';
  contenedor.style.top = '0';
  contenedor.style.width = '300px';
  contenedor.style.background = '#ffffff';
  contenedor.style.padding = '16px';
  contenedor.style.fontFamily = 'monospace';
  contenedor.style.fontSize = '13px';
  contenedor.style.color = '#000000';
  contenedor.innerHTML = ticketHTML(v);
  contenedor.querySelectorAll('.tk-sub, .tk-foot, .tk-negocio, .tk-line, .tk-total').forEach(function(el){ el.style.color = '#000000'; });
  contenedor.querySelectorAll('.tk-desc').forEach(function(el){ el.style.color = '#a32d2d'; });
  contenedor.querySelectorAll('.tk-ahorro').forEach(function(el){ el.style.color = '#3b6d11'; });
  document.body.appendChild(contenedor);

  try{
    await new Promise(function(r){ setTimeout(r, 80); });
    const canvas = await html2canvas(contenedor, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const pdfWidth = 320;
    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
    const doc = new jsPDFCtor({unit:'pt', format:[pdfWidth, pdfHeight], orientation:'portrait'});
    doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
    return doc.output('blob');
  } finally {
    document.body.removeChild(contenedor);
  }
}

async function compartirComoPDFVenta(v, nombreArchivo){
  const blob = await generarPDFTicketVenta(v);
  const archivo = new File([blob], nombreArchivo, {type:'application/pdf'});
  const puedeCompartir = navigator.canShare && navigator.canShare({files:[archivo]});
  console.log('[diagnostico compartir]', nombreArchivo, '| canShare:', puedeCompartir, '| tamano:', archivo.size, 'bytes | tipo:', archivo.type);
  if(puedeCompartir){
    try{
      await navigator.share({files:[archivo]});
      return;
    }catch(e){
      console.log('[diagnostico compartir] navigator.share fallo:', e.name, e.message);
      if(e.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  alert('Tu navegador no permite compartir directo. Se descargó el PDF: adjúntalo manualmente en WhatsApp.');
}

function ticketDevolucionHTML(v){
  const fecha = new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  const RAYA = '<svg width="100%" height="3" style="display:block;margin:6px 0"><line x1="0" y1="1.5" x2="100%" y2="1.5" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/></svg>';
  const nombresMet = {efectivo:'EFECTIVO', tarjeta:'TARJETA', credito:'A CRÉDITO', transferencia:'TRANSFERENCIA'};

  let html = '<div class="tk-head">'
    + logosTicketHTML(88)
    + '<div class="tk-sub">COMPROBANTE DE DEVOLUCIÓN</div>'
    + (v.sucursal ? '<div class="tk-sub">Sucursal ' + esc(v.sucursal) + '</div>' : '')
    + '<div class="tk-sub">Devolución #' + v.id + '</div>'
    + (v.venta_origen_id ? '<div class="tk-sub">Ticket original #' + v.venta_origen_id + '</div>' : '')
    + '<div class="tk-sub">' + fecha + '</div>'
    + (v.operador ? '<div class="tk-sub">Operador: ' + esc(v.operador) + '</div>' : '')
    + '</div>' + RAYA;

  let subtotalNeto = 0;
  (v.detalle || []).forEach(function(it){
    const cant = Math.abs(it.cantidad);
    const c = Number.isInteger(cant) ? cant + 'x' : cant.toFixed(3) + 'kg';
    const pUnit = it.precio_unitario || 0;
    const pOrig = (it.precio_original != null && it.precio_original > pUnit) ? it.precio_original : pUnit;
    subtotalNeto += pUnit * cant;
    html += '<div class="tk-line"><span>' + c + ' ' + esc(it.nombre) + '</span><span>' + money(pOrig * cant) + '</span></div>';
    if(pOrig > pUnit){
      const pct = Math.round((1 - pUnit / pOrig) * 100);
      html += '<div class="tk-line tk-desc"><span style="padding-left:12px">Descuento (' + pct + '%)</span><span>'
        + money(-((pOrig - pUnit) * cant)) + '</span></div>';
    }
  });
  html += RAYA;

  const pctGen = v.descuento_extra_pct || 0;
  if(pctGen > 0){
    html += '<div class="tk-line"><span>Subtotal devuelto</span><span>' + money(subtotalNeto) + '</span></div>';
    html += '<div class="tk-line tk-desc"><span>Descuento general (' + fmtPct(pctGen) + '%)</span><span>'
      + money(-(subtotalNeto * pctGen / 100)) + '</span></div>';
    html += RAYA;
  }

  html += '<div class="tk-line tk-total"><span>TOTAL DEVUELTO</span><span>' + money(v.total) + '</span></div>';
  html += RAYA;
  html += '<div class="tk-line"><span>Reembolso</span><span>' + (nombresMet[v.metodo_pago] || v.metodo_pago) + '</span></div>';
  if(v.autorizado_por){
    html += '<div class="tk-line"><span>Motivo</span><span>' + esc(v.autorizado_por) + '</span></div>';
  }
  html += '<div class="tk-foot">Conserve este comprobante</div>';
  return html;
}

function ticketHTML(v){
  if(v && ((v.estado === 'devolucion') || (v.total < 0))) return ticketDevolucionHTML(v);
  const fecha=new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  const RAYA='<svg width="100%" height="3" style="display:block;margin:6px 0"><line x1="0" y1="1.5" x2="100%" y2="1.5" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/></svg>';
  let html=`<div class="tk-head">
    ${logosTicketHTML(88)}
    ${v.sucursal?`<div class="tk-sub">Sucursal ${esc(v.sucursal)}</div>`:''}
    <div class="tk-sub">Ticket de venta #${v.id}</div>
    <div class="tk-sub">${fecha}</div>
    ${v.operador?`<div class="tk-sub">Operador: ${esc(v.operador)}</div>`:''}
  </div>${RAYA}<div class="tk-items">`;
  (v.detalle||[]).forEach(it=>{
    const cant=Number.isInteger(it.cantidad)?it.cantidad+'x':it.cantidad.toFixed(3)+'kg';
    const tieneDescItem = it.precio_original!=null && it.precio_original>it.precio_unitario;
    if(tieneDescItem){
      const importeOriginal = it.precio_original * it.cantidad;
      const pctItem = Math.round((1-it.precio_unitario/it.precio_original)*100);
      html+=`<div class="tk-line"><span>${cant} ${esc(it.nombre)}</span><span>${money(importeOriginal)}</span></div>`;
      html+=`<div class="tk-line tk-desc"><span>Descuento (${pctItem}%)</span><span>${money(it.importe)}</span></div>`;
    }else{
      html+=`<div class="tk-line"><span>${cant} ${esc(it.nombre)}</span><span>${money(it.importe)}</span></div>`;
    }
  });
  html+='</div>'+RAYA;
  if(v.descuento_extra_pct>0){
    html+=`<div class="tk-line"><span>Subtotal</span><span>${money(v.subtotal)}</span></div>`;
    html+=`<div class="tk-line tk-desc"><span>Descuento ${fmtPct(v.descuento_extra_pct)}%</span><span>${money(-(v.subtotal*v.descuento_extra_pct/100))}</span></div>`;
  }
  const ahorroTk=v.ahorro_total!=null?v.ahorro_total:0;
  if(ahorroTk>0.005){
    html+=`<div class="tk-line tk-ahorro"><span>🎉 Ahorraste</span><span>${money(ahorroTk)}</span></div>`;
  }
  html+=`<div class="tk-line tk-total"><span>TOTAL</span><span>${money(v.total)}</span></div>`;
  if(v.metodo_pago==='tarjeta'){
    html+=`<div class="tk-line"><span>Pago</span><span>TARJETA</span></div>`;
    if(v.tpv_terminal)html+=`<div class="tk-line"><span>Terminal</span><span>${esc(v.tpv_terminal)}</span></div>`;
    if(v.tpv_referencia)html+=`<div class="tk-line"><span>Referencia</span><span>${esc(v.tpv_referencia)}</span></div>`;
    if(v.tpv_autorizacion)html+=`<div class="tk-line"><span>Autorización</span><span>${esc(v.tpv_autorizacion)}</span></div>`;
  }else if(v.metodo_pago==='credito'){
    html+=`<div class="tk-line" style="color:var(--amber)"><span>Pago</span><span>A CRÉDITO</span></div>`;
    if(v.cliente_nombre)html+=`<div class="tk-line"><span>Cliente</span><span>${esc(v.cliente_nombre)}</span></div>`;
  }else if(v.metodo_pago==='transferencia'){
    html+=`<div class="tk-line"><span>Pago</span><span>TRANSFERENCIA</span></div>`;
    if(v.transferencia_referencia)html+=`<div class="tk-line"><span>Referencia</span><span>${esc(v.transferencia_referencia)}</span></div>`;
  }else{
    html+=`<div class="tk-line"><span>Pago</span><span>EFECTIVO</span></div>`;
    if(v.pago_con!=null){
      html+=`<div class="tk-line"><span>Pagó con</span><span>${money(v.pago_con)}</span></div>`;
      html+=`<div class="tk-line"><span>Cambio</span><span>${money(v.cambio||0)}</span></div>`;
    }
  }
  html+='<div class="tk-foot">¡Gracias por su compra!</div>';
  return html;
}

function ticketTextoPlano(v){
  if(!v)return '';
  const fecha=new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
  let txt=`🏪 MI NEGOCIO`;
  if(v.sucursal)txt+=` — Sucursal ${v.sucursal}`;
  txt+=`\n📋 Ticket #${v.id} | ${fecha}`;
  if(v.operador)txt+=`\n👤 ${v.operador}`;
  txt+=`\n─────────────────────\n`;
  (v.detalle||[]).forEach(it=>{
    const cant=Number.isInteger(it.cantidad)?it.cantidad+'x':it.cantidad.toFixed(3)+'kg';
    txt+=`${cant} ${it.nombre} — ${money(it.importe)}\n`;
  });
  txt+=`─────────────────────\n`;
  if(v.descuento_extra_pct>0){
    txt+=`Subtotal: ${money(v.subtotal)}\n`;
    txt+=`Descuento ${fmtPct(v.descuento_extra_pct)}%: -${money(v.subtotal*v.descuento_extra_pct/100)}\n`;
  }
  const ahorroTxt=v.ahorro_total!=null?v.ahorro_total:0;
  if(ahorroTxt>0.005){
    txt+=`🎉 Ahorraste: ${money(ahorroTxt)}\n`;
  }
  txt+=`💰 TOTAL: ${money(v.total)}\n`;
  if(v.metodo_pago==='tarjeta'){
    txt+=`💳 Pago: Tarjeta`;
    if(v.tpv_terminal)txt+=` (${v.tpv_terminal})`;
    txt+=`\n`;
    if(v.tpv_referencia)txt+=`Ref: ${v.tpv_referencia}\n`;
  }else if(v.metodo_pago==='credito'){
    txt+=`📒 Pago: A crédito`;
    if(v.cliente_nombre)txt+=` (${v.cliente_nombre})`;
    txt+=`\n`;
  }else if(v.metodo_pago==='transferencia'){
    txt+=`🏦 Pago: Transferencia\n`;
    if(v.transferencia_referencia)txt+=`Ref: ${v.transferencia_referencia}\n`;
  }else if(v.pago_con){
    txt+=`💵 Pagó: ${money(v.pago_con)} | Cambio: ${money(v.cambio||0)}\n`;
  }
  txt+=`\n¡Gracias por su compra! 🙏`;
  return txt;
}

async function descargarCSV(){
  if(!ventas.length){alert('No hay ventas para exportar');return;}
  // Descargar el detalle completo de cada venta para incluir las descripciones
  const detalles = await Promise.all(ventas.map(async v=>{
    try{ const r=await authFetch('/api/ventas/'+v.id); return await r.json(); }
    catch(e){ return null; }
  }));
  let csv='Venta,Sucursal,Fecha,Operador,Metodo pago,Terminal TPV,Ref TPV,Autorizacion TPV,No. item,Producto,Cantidad,Precio unit.,Importe,Total venta,Descuento %,Pago con,Cambio\n';
  detalles.forEach(v=>{
    if(!v)return;
    const fecha=new Date(v.fecha).toLocaleString('es-MX').replace(',', '');
    const nombresMet={tarjeta:'Tarjeta',credito:'Crédito',transferencia:'Transferencia',efectivo:'Efectivo'};
    const metodo=nombresMet[v.metodo_pago]||'Efectivo';
    const term=v.tpv_terminal||'';
    const ref=v.tpv_referencia||'';
    const aut=v.tpv_autorizacion||'';
    (v.detalle||[]).forEach((it,idx)=>{
      const esPrimero = idx===0;
      const nombre=(it.nombre||'').replace(/"/g,'""');
      csv+=`${v.id},"${v.sucursal||''}","${fecha}","${v.operador||''}","${metodo}","${term}","${ref}","${aut}",${idx+1},"${nombre}",${it.cantidad},${it.precio_unitario},${it.importe},`;
      csv+=`${esPrimero?v.total:''},${esPrimero?v.descuento_extra_pct:''},${esPrimero?(v.pago_con||''):''},${esPrimero?(v.cambio||''):''}\n`;
    });
  });
  bajarArchivo(csv,`ventas_detalle_${new Date().toISOString().slice(0,10)}.csv`,'text/csv');
}

function bajarArchivo(contenido,nombre,tipo){
  const blob=new Blob([contenido],{type:tipo+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=nombre;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
}

// ─── Reporte completo en PDF ────────────────────────────────────────────
async function generarReportePDF(desdeISO, hastaISO, etiquetaPeriodo){
  let params = [];
  if(desdeISO) params.push('desde=' + encodeURIComponent(desdeISO));
  if(hastaISO) params.push('hasta=' + encodeURIComponent(hastaISO));
  const url = '/api/reporte-completo' + (params.length ? '?' + params.join('&') : '');

  let d;
  try{
    const r = await authFetch(url);
    if(!r.ok){ alert('No se pudo generar el reporte'); return; }
    d = await r.json();
  }catch(e){ alert('Error de conexión al generar el reporte'); return; }

  const nombresMetodo = {efectivo:'Efectivo', tarjeta:'Tarjeta', credito:'Crédito', transferencia:'Transferencia'};
  const jsPDFCtor = window.jspdf.jsPDF;
  const W = 595, M = 40, RIGHT = W - M;
  const doc = new jsPDFCtor({unit:'pt', format:'a4', orientation:'portrait'});
  let y = 40;

  function linea(){
    doc.setDrawColor(0);
    doc.setLineDashPattern([3, 2], 0);
    doc.line(M, y, RIGHT, y);
    doc.setLineDashPattern([], 0);
    y += 18;
  }
  function fila(etiqueta, valor, bold, size){
    doc.setFont('courier','bold');
    doc.setFontSize(size || 10);
    doc.setTextColor(0);
    doc.text(String(etiqueta), M, y);
    doc.text(String(valor), RIGHT, y, {align:'right'});
    y += (size || 10) + 6;
  }
  function titulo(txt){
    doc.setFont('courier','bold'); doc.setFontSize(12); doc.setTextColor(0);
    doc.text(txt, M, y);
    y += 20;
  }

  try{
    // Reporte consolidado (todas las tiendas): logo genérico, no el de una sola tienda.
    const logoData = await cargarImagenBase64('/static/logo.png');
    const lw = 110, lh = 59;
    doc.addImage(logoData, 'PNG', (W - lw)/2, y, lw, lh);
    y += lh + 14;
  }catch(e){
    doc.setFont('courier','bold'); doc.setFontSize(15); doc.setTextColor(0);
    doc.text('ONLY ENTERPRISES', W/2, y + 12, {align:'center'});
    y += 32;
  }

  doc.setFont('courier','bold'); doc.setFontSize(15); doc.setTextColor(0);
  doc.text('Reporte de ventas', W/2, y, {align:'center'}); y += 18;
  doc.setFont('courier','bold'); doc.setFontSize(10);
  doc.text(etiquetaPeriodo || '', W/2, y, {align:'center'}); y += 14;
  doc.setFontSize(9);
  doc.text('Generado: ' + new Date().toLocaleString('es-MX').replace(',',''), W/2, y, {align:'center'});
  y += 18;
  linea();

  titulo('Resumen');
  fila('Ventas totales (' + d.num_ventas + ' ventas)', money(d.total_vendido));
  fila('Gastos (' + (d.num_gastos || 0) + ')', '-' + money(d.gastos));
  if(d.devoluciones_num){
    fila('Devoluciones (' + d.devoluciones_num + ')', '-' + money(d.devoluciones_total));
  }
  fila('Ganancia después de gastos', money(d.ganancia_neta), true, 12);
  fila('Cuentas por cobrar', money(d.total_por_cobrar));
  y += 6;
  linea();

  titulo('Métodos de pago');
  if(!d.desglose_metodos_pago.length){
    doc.setFont('courier','bold'); doc.setFontSize(10);
    doc.text('Sin ventas en el período', M, y); y += 16;
  }else{
    d.desglose_metodos_pago.forEach(function(m){
      fila((nombresMetodo[m.metodo] || m.metodo) + ' (' + m.cantidad + ')', money(m.total));
    });
  }
  y += 6;
  linea();

  // Lo que debe haber en el cajón no son solo las ventas en efectivo: los
  // abonos cobrados en efectivo entran, y los gastos pagados en efectivo salen.
  if(d.cuadre_caja){
    const cc = d.cuadre_caja;
    titulo('Cuadre de caja (efectivo)');
    fila('Ventas en efectivo', '+' + money(cc.ventas_efectivo));
    fila('Abonos cobrados en efectivo', '+' + money(cc.abonos_efectivo));
    fila('Gastos pagados en efectivo', '-' + money(cc.gastos_efectivo));
    fila('Efectivo neto del periodo', money(cc.esperado_en_caja), true, 12);
    y += 6;
    linea();
  }

  titulo('Clientes a crédito');
  if(!d.clientes_detalle.length){
    doc.setFont('courier','bold'); doc.setFontSize(10);
    doc.text('Sin movimientos de crédito en el período', M, y); y += 16;
  }else{
    const c1 = M, c2 = M + 200, c3 = M + 310, c4 = RIGHT;
    doc.setFont('courier','bold'); doc.setFontSize(9); doc.setTextColor(0);
    doc.text('Cliente', c1, y);
    doc.text('Ventas créd.', c2, y, {align:'right'});
    doc.text('Pagos', c3, y, {align:'right'});
    doc.text('Saldo', c4, y, {align:'right'});
    y += 14;
    doc.setFont('courier','bold');
    d.clientes_detalle.forEach(function(c){
      if(y > 780){ doc.addPage(); y = 50; }
      const nombreCorto = doc.splitTextToSize(c.nombre, 190)[0];
      doc.setFont('courier','bold'); doc.setFontSize(9);
      doc.text(nombreCorto, c1, y);
      doc.text(money(c.ventas_credito_periodo), c2, y, {align:'right'});
      doc.text(money(c.pagos_periodo), c3, y, {align:'right'});
      doc.setFont('courier','bold');
      doc.text(money(c.saldo_actual), c4, y, {align:'right'});
      y += 14;
    });
  }

  const blob = doc.output('blob');
  const urlBlob = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = urlBlob; a.download = 'reporte_' + new Date().toISOString().slice(0,10) + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(urlBlob); }, 3000);
}

function reporteDesdeHistorial(){
  const dStr = document.getElementById('f-desde').value;
  const hStr = document.getElementById('f-hasta').value;
  let desdeISO=null, hastaISO=null, etiqueta='Todo el histórico';
  if(dStr){ desdeISO = new Date(dStr+'T00:00:00').toISOString(); }
  if(hStr){ hastaISO = new Date(hStr+'T23:59:59.999').toISOString(); }
  if(dStr && hStr) etiqueta = dStr==hStr ? dStr : (dStr + ' a ' + hStr);
  else if(dStr) etiqueta = 'Desde ' + dStr;
  else if(hStr) etiqueta = 'Hasta ' + hStr;
  generarReportePDF(desdeISO, hastaISO, etiqueta);
}
