<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a1a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente · Only Enterprises</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--bg2:#fff;--border:#e2e0d8;--text:#1a1a18;--text2:#6b6b66;
  --blue:#185fa5;--blue-bg:#e6f1fb;--red:#a32d2d;--red-bg:#fcebeb
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#252522;--border:#3a3a36;--text:#e8e6dc;--text2:#9c9a92;
  --blue:#85b7eb;--blue-bg:#042c53;--red:#f09595;--red-bg:#501313
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.topbar{background:color-mix(in srgb, var(--bg2) 70%, transparent);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:0.5px solid var(--border);padding:0 1rem;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:600;flex:1;text-align:center}
.btn-inicio{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px;border:0.5px solid var(--border);border-radius:8px;background:transparent;color:var(--text);text-decoration:none}
.nota{max-width:560px;margin:3rem auto;padding:0 1.5rem;text-align:center;color:var(--text2);font-size:14px;line-height:1.6}
/* En esta página el panel ocupa la pantalla, no la esquina */
.robot-panel{position:static!important;width:auto!important;height:calc(100vh - 54px)!important;
  max-width:760px;margin:0 auto;border-radius:0!important;border-left:none!important;
  border-right:none!important;box-shadow:none!important}
.robot-fab{display:none!important}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="btn-inicio" title="Inicio"><img src="/static/icon-nav-v2.png" alt="Inicio" style="height:32px;width:32px"></a>
  <h1 class="topbar-title">Asistente</h1>
  <span style="width:56px"></span>
</div>

<div class="nota" id="nota">Cargando…</div>

<script src="/static/auth.js?v=1787328487"></script>
<script>
requireAuth();
// El widget (lo carga auth.js) se abre solo y ocupa toda la pantalla.
// El robot flotante de la esquina aparece en el resto de las pantallas.
window.CHAT_ABRIR_AL_CARGAR = true;
setTimeout(() => {
  const n = document.getElementById('nota');
  if (document.querySelector('.robot-panel')) n.remove();
  else n.textContent = 'No se pudo cargar el asistente. Recarga la página.';
}, 1200);
</script>
</body>
</html>
